<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quote Studio · Soạn báo giá Base 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="st-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style id="st-css">/* Quote Studio — phần trang (dùng cả cho file HTML xuất ra). */
:root{--st-gap-in:2mm;--st-gap-group:5mm;--st-gap-section:9mm;--st-accent:#5B8CFF;--st-accent-2:#8FB0FF;--st-ok:#22C55E;--st-bad:#F0565B;--st-warn:#F5A524;--f-display:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;--f-ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
.st-page{position:relative;width:210mm;margin:0 auto 36px}
.st-sheet{position:relative;box-sizing:border-box;width:210mm;min-height:297mm;padding:11mm 14mm 9mm;display:flex;flex-direction:column;font:400 13px/1.55 var(--f-ui);overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
.st-page[data-bg="dark"] .st-sheet{color:#EEF1FF;background:radial-gradient(130mm 95mm at 88% 4%,rgba(91,140,255,.26),transparent 70%),radial-gradient(110mm 80mm at 0% 100%,rgba(91,140,255,.12),transparent 70%),linear-gradient(165deg,#141C50 0%,#0B1030 55%,#070B1D 100%);--ink:#EEF1FF;--ink-2:#BCC4E8;--ink-3:#8C95BA;--line:rgba(255,255,255,.15);--card:rgba(255,255,255,.06);--card-line:rgba(255,255,255,.15);--soft:rgba(255,255,255,.05);--hl:#8FB0FF;--accent-bg:linear-gradient(160deg,rgba(91,140,255,.30),rgba(91,140,255,.10));--accent-line:rgba(143,176,255,.6)}
.st-page[data-bg="light"] .st-sheet{color:#0E1430;background:#fff;--ink:#0E1430;--ink-2:#454E70;--ink-3:#6B7393;--line:#E3E7F1;--card:#F5F7FC;--card-line:#E3E7F1;--soft:#F7F8FC;--hl:#3563E9;--accent-bg:#EEF3FF;--accent-line:#BFD0FF}
.st-ph{display:flex;justify-content:space-between;gap:8mm;height:8mm;margin-bottom:var(--st-gap-group);font:700 9.5px/1.3 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.st-pf{display:flex;justify-content:space-between;align-items:flex-end;gap:8mm;height:5mm;margin-top:var(--st-gap-group);font:500 9.5px/1.3 var(--f-ui);color:var(--ink-3)}
.st-grid{--grid-h:254mm;position:relative;min-height:var(--grid-h);display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--st-gap-group);align-content:start}
.st-page[data-nochrome] .st-grid{--grid-h:277mm}
.st-b{grid-column:span var(--w,12);min-height:var(--h,auto);position:relative;min-width:0;display:flex;flex-direction:column;container-type:inline-size;border-radius:3.5mm;box-sizing:border-box}
.st-c{flex:1;min-width:0;outline:none;display:flex;flex-direction:column}
.st-c > *{margin:0}
.st-c > * + *{margin-top:var(--st-gap-in)}
/* Kiểu khối: chỉ đổi nền/viền/đệm, không đổi nội dung */
.st-s-card{background:var(--card);border:1px solid var(--card-line);padding:var(--st-gap-group)}
.st-s-white{background:#fff;color:#0E1430;padding:var(--st-gap-group);border:1px solid #E3E7F1;--ink:#0E1430;--ink-2:#454E70;--ink-3:#6B7393;--line:#E3E7F1;--card:#F5F7FC;--soft:#F7F8FC;--hl:#3563E9}
.st-page[data-bg="light"] .st-s-white{box-shadow:0 1.5mm 5mm rgba(14,20,48,.08)}
.st-s-accent{background:var(--accent-bg);border:1px solid var(--accent-line);padding:var(--st-gap-group)}
.st-s-line{border-left:3px solid var(--st-accent);padding:1mm 0 1mm 4.5mm;border-radius:0}
/* Tiêu đề gần nội dung phía dưới hơn nhóm phía trên. */
.st-t-heading{margin-bottom:calc(var(--st-gap-in)*2 - var(--st-gap-group))}
.st-t-heading:not(:first-child){margin-top:calc(var(--st-gap-section) - var(--st-gap-group))}
/* Tiêu điểm: giữ HTML, chỉ tăng phân cấp và đổi nền/viền của khối. */
.st-b.is-focus{background:var(--accent-bg);border:1px solid var(--accent-line);padding:var(--st-gap-group)}
.st-b.is-focus.st-s-white{--accent-bg:#EEF3FF;--accent-line:#AFC4FF}
.st-b.is-focus.st-s-line{border-left:3px solid var(--st-accent);border-radius:3.5mm}
/* Chữ trong khối; số lớn co giãn theo độ rộng khối (container query) */
.st-c h1{font:800 clamp(26px,7.4cqw,50px)/1.08 var(--f-display);letter-spacing:-.02em}
.st-c h2{font:800 clamp(18px,4.3cqw,29px)/1.2 var(--f-display);letter-spacing:-.01em}
.st-c h3{font:700 clamp(13px,3.2cqw,15.5px)/1.35 var(--f-display)}
.st-b.is-focus .st-c{font-size:14px}
.st-b.is-focus .st-c table{font-size:12.5px}
.st-b.is-focus .st-c h2{font-size:clamp(21px,4.8cqw,33px)}
.st-b.is-focus .st-c h3{font-size:clamp(15px,3.7cqw,18px)}
.st-b.is-focus .st-c .v{font-size:clamp(21px,12.5cqw,43px)}
.st-b.is-focus .st-c .q{font-size:16px}
.st-c .eyebrow{font:700 10.5px/1.3 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--hl)}
.st-c .lead{font-size:15px;line-height:1.55;color:var(--ink-2)}
.st-c .hl{color:var(--hl)}
.st-c .k{font:700 9.5px/1.35 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.st-c .v{font:800 clamp(18px,11.5cqw,38px)/1.1 var(--f-display);letter-spacing:-.01em}
.st-c .v.bad{color:var(--st-bad)}.st-c .v.ok{color:var(--st-ok)}
.st-c .s{font-size:11.5px;line-height:1.5;color:var(--ink-3)}
.st-c .q{font:600 14px/1.5 var(--f-display)}
.st-c .no{display:grid;place-items:center;width:7mm;height:7mm;border-radius:50%;background:var(--st-accent);color:#fff;font:800 12px/1 var(--f-display)}
.st-c .center{text-align:center}
.st-c b,.st-c strong{font-weight:700}
.st-c ul{list-style:none;padding:0}
.st-c ul li{position:relative;padding-left:4.5mm}
.st-c ul li + li{margin-top:var(--st-gap-in)}
.st-c ul li::before{content:'';position:absolute;left:0;top:.62em;width:1.6mm;height:1.6mm;border-radius:50%;background:var(--st-accent)}
.st-c ol{padding-left:5mm}
.st-c ol.steps{list-style:none;padding:0;counter-reset:st}
.st-c ol.steps li{counter-increment:st;position:relative;padding:var(--st-gap-in) 0 var(--st-gap-in) 11mm;border-bottom:1px solid var(--line)}
.st-c ol.steps li::before{content:counter(st);position:absolute;left:0;top:2mm;width:7.5mm;height:7.5mm;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font:800 12px/1 var(--f-display)}
.st-c ol.steps li.key::before{background:var(--st-accent);border-color:var(--st-accent);color:#fff}
.st-c ol.steps li .s{display:block}
.st-c .chips{display:flex;flex-wrap:wrap;gap:var(--st-gap-in)}
.st-c .chip{display:inline-block;padding:.5mm 2.4mm;border-radius:99px;border:1px solid var(--line);font:600 10.5px/1.6 var(--f-ui);white-space:nowrap}
.st-c .tag{display:inline-block;padding:.6mm 2.6mm;border-radius:99px;background:var(--st-accent);color:#fff;font:700 9.5px/1.6 var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.st-c hr{border:0;border-top:1px solid var(--line);margin:1mm 0}
.st-c table{width:100%;border-collapse:collapse;font-size:11.5px;line-height:1.45;overflow-wrap:break-word}
.st-c th{text-align:left;padding:1.8mm 2mm;border-bottom:1px solid var(--line);font:700 9px/1.3 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);vertical-align:bottom}
.st-c td{padding:var(--st-gap-in);border-bottom:1px solid var(--line);vertical-align:top}
.st-c .num{text-align:right;font-variant-numeric:tabular-nums}
.st-c td.num{white-space:nowrap}
.st-c table.kv th{width:28%;text-transform:none;letter-spacing:0;font:600 11.5px/1.45 var(--f-ui);vertical-align:top}
.st-c table.kv td:first-child{color:var(--ink-3)}
.st-c table.price{font-size:10.5px}
.st-c table.price th{font-size:8.5px}
.st-c tr.sum td{font-weight:600}
.st-c tr.total td{font-weight:800;border-top:2px solid var(--ink);font-size:12px}
.st-c tr.group td{padding-top:3.5mm;background:var(--soft)}
.st-c table.res td:last-child{color:var(--st-ok)}
.st-c .words{font-size:12.5px}
.st-c .sign-space{height:22mm}
.st-c .img{display:flex;align-items:center;justify-content:flex-start;min-height:12mm;flex:1}
.st-c .img img{display:block;max-width:100%;height:auto;max-height:100%;object-fit:contain}
.st-t-image .st-c .img{justify-content:center;border-radius:2.5mm;overflow:hidden}
.st-t-image .st-c .img img{width:100%}
.st-c .img.cover img{width:100%;height:100%;object-fit:cover}
.st-b[style*="--h"] .st-c .img:not(.logo) img{max-height:calc(var(--h) - 10mm)}
/* Khung chung, độc lập với kích thước file ảnh gốc. */
.st-c .img.logo{box-sizing:border-box;width:min(100%,var(--logo-w,32mm));height:var(--logo-h,22mm);min-height:var(--logo-h,22mm);flex:0 0 auto;align-self:var(--logo-align,start);justify-content:center;border-radius:0;overflow:hidden}
.st-logo-frame .st-c .img.logo{background:#fff;border:1px solid #E3E7F1;border-radius:2mm;padding:2mm}
.st-c .img.logo img{width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain}
.st-c .img.logo.cover img{object-fit:cover}
.st-c table.st-edit-table{table-layout:fixed}
.st-c table.st-edit-table th,.st-c table.st-edit-table td{width:auto;white-space:normal;overflow-wrap:anywhere}
.st-c table.app-list{table-layout:fixed}
.st-c table.app-list th,.st-c table.app-list td{vertical-align:top;white-space:normal;overflow-wrap:anywhere}
.st-c table.app-list tr{break-inside:avoid;page-break-inside:avoid}
.st-c table.app-list th:first-child,.st-c table.app-list td:first-child{text-align:center;font-variant-numeric:tabular-nums}
.st-c .img.is-empty{border:1.5px dashed var(--line);border-radius:3mm;min-height:16mm;justify-content:center}
.st-c .img.is-empty::after{content:'Bấm đúp để chọn ảnh';font:500 11px/1.4 var(--f-ui);color:var(--ink-3)}
.st-c .img.is-empty img{display:none}
.st-t-spacer .st-c,.st-t-divider .st-c{justify-content:center}
.st-a4line,.st-ptools,.st-handle,.st-rw,.st-rh,.st-mini,.st-emptyhint{display:none}
body.st-export{margin:0;background:#E9ECF4}
body.st-export .st-page{margin:24px auto}
body.st-export .st-sheet{height:297mm;overflow:visible;box-shadow:0 10px 40px rgba(14,20,48,.18)}
body.st-export .img.is-empty{display:none}
@page{size:A4;margin:0}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{margin:0;background:none!important}
  .st-page{margin:0!important;break-after:page;page-break-after:always}
  .st-page:last-child{break-after:auto;page-break-after:auto}
  .st-sheet{height:297mm!important;min-height:0!important;overflow:visible!important;box-shadow:none!important}
  .img.is-empty{display:none!important}
}
/* Pha 2 dùng cùng CSS cho editor, preview, HTML và PDF. */
.st-c table.nb{table-layout:fixed}.st-c table.nb th:nth-child(1){width:24%}.st-c table.nb th:nth-child(2){width:31%}.st-c table.nb th:nth-child(3){width:15%}.st-c table.nb th:nth-child(4){width:30%}
.st-c table.nb td{overflow-wrap:anywhere}.st-c table.nb .chip{white-space:normal;margin:0 1mm 1mm 0}.st-c table.nb td .s{margin-top:1mm}
.st-funnel{display:flex;flex-direction:column;gap:var(--st-gap-in)}.st-funnel>div{box-sizing:border-box;padding:3mm 4mm;border:1px solid var(--line);border-radius:2mm;background:var(--soft)}
.st-funnel .st-f1{width:100%}.st-funnel .st-f2{width:88%}.st-funnel .st-f3{width:76%}.st-funnel p{margin:0}.st-funnel .k{margin-bottom:1mm}.st-funnel .st-f3>p:last-child{font-weight:700}
.st-t-assumptions .st-c ul{font-size:11.5px;line-height:1.5}.st-assumption-extra{margin-top:var(--st-gap-in);border-top:1px solid var(--line);padding-top:var(--st-gap-in)}.st-assumption-extra ul{margin-top:var(--st-gap-in)}
.st-t-payment table{table-layout:fixed}.st-t-payment td,.st-t-payment th{overflow-wrap:break-word;text-transform:none;letter-spacing:0}
.st-t-payment th:nth-child(1){width:18%}.st-t-payment th:nth-child(2){width:42%}.st-t-payment th:nth-child(3){width:25%}.st-t-payment th:nth-child(4){width:15%}
body.st-export .st-assumption-extra:has(li:only-child>br:only-child),body.st-preview .st-assumption-extra:has(li:only-child>br:only-child){display:none}
@media print{.st-assumption-extra:has(li:only-child>br:only-child){display:none!important}}
.st-cta-row{border-top:1px solid var(--line);padding-top:var(--st-gap-in)}.st-cta-sign{margin-top:var(--st-gap-group);border-top:1px solid var(--line);padding-top:var(--st-gap-in)}.st-cta-sign .sign-space{height:16mm}
.st-cta-link{color:inherit;text-decoration:underline;overflow-wrap:anywhere}
/* == EDITOR == */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#E9ECF4;color:#0E1430;font:13px/1.45 var(--f-ui)}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid #D9DDE8;background:#fff;border-radius:8px;padding:6px 10px}
button:hover:not(:disabled){border-color:#9DB4F8;background:#F6F8FF}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--st-accent);border-color:var(--st-accent);color:#fff;font-weight:600}
button.primary:hover:not(:disabled){background:#4A7BF0;border-color:#4A7BF0}
button.danger{color:#C4313A}
input{font:inherit;border:1px solid #D9DDE8;border-radius:8px;padding:7px 9px;width:100%;background:#fff;color:inherit}
select{font:inherit;border:1px solid #D9DDE8;border-radius:8px;padding:7px;width:100%;background:#fff;color:inherit}
#st-app{display:grid;grid-template-columns:210px minmax(0,1fr) 312px;grid-template-rows:56px minmax(0,1fr);height:100vh}
.st-top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff;border-bottom:1px solid #E1E4EE}
.st-brand{font:800 15px/1 var(--f-display);white-space:nowrap}
.st-brand span{color:var(--st-accent)}
#st-title{max-width:360px;border-color:transparent;font-weight:600}
#st-title:hover,#st-title:focus{border-color:#D9DDE8}
#st-save{color:#6B7393;font-size:12px;white-space:nowrap}
.st-top-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.st-menu{position:relative}
.st-menu summary{list-style:none;cursor:pointer;border:1px solid #D9DDE8;border-radius:8px;padding:6px 10px;background:#fff}
.st-menu summary::-webkit-details-marker{display:none}
.st-menu > div{position:absolute;right:0;top:calc(100% + 6px);z-index:30;display:grid;gap:2px;min-width:230px;padding:6px;background:#fff;border:1px solid #E1E4EE;border-radius:10px;box-shadow:0 12px 30px rgba(14,20,48,.14)}
.st-menu > div button{border:0;text-align:left;border-radius:6px}
.st-left{grid-column:1;grid-row:2;overflow:auto;background:#fff;border-right:1px solid #E1E4EE;padding:12px 10px}
.st-left-h{display:flex;justify-content:space-between;align-items:center;margin:0 4px 8px;font:700 11px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:#6B7393}
.st-left-h button{padding:3px 9px}
#st-pagelist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
#st-pagelist li{display:grid;grid-template-columns:30px minmax(0,1fr);grid-template-rows:auto auto;column-gap:8px;align-items:center;padding:6px;border-radius:8px;cursor:grab;user-select:none;border:1px solid transparent}
#st-pagelist li:hover{background:#F4F6FB}
#st-pagelist li.is-cur{background:#EEF3FF;border-color:#C9D7FF}
#st-pagelist li.drop{outline:2px solid var(--st-accent)}
#st-pagelist li.st-dragging{opacity:.4}
.st-sw{grid-row:1/3;display:grid;place-items:center;width:30px;height:40px;border-radius:4px;font:700 11px/1 var(--f-display);border:1px solid #DDE2EE}
.st-sw[data-bg="dark"]{background:linear-gradient(165deg,#141C50,#070B1D);color:#fff;border-color:#141C50}
.st-sw[data-bg="light"]{background:#fff;color:#0E1430}
.st-pt{font-size:12px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.st-pover{grid-column:2;justify-self:start;font-size:10.5px;font-weight:700;color:#C4313A}
#st-canvas{grid-column:2;grid-row:2;overflow:auto;padding:30px 24px 120px;position:relative}
.st-right{grid-column:3;grid-row:2;overflow:auto;background:#fff;border-left:1px solid #E1E4EE}
.st-sec{padding:14px 14px 16px;border-bottom:1px solid #EEF0F5}
.st-toggle{padding:0}
.st-toggle>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:13px 14px;font:700 12px/1.4 var(--f-display);user-select:none}
.st-toggle>summary::-webkit-details-marker,.st-library-group>summary::-webkit-details-marker{display:none}
.st-toggle>summary::after,.st-library-group>summary::after{content:'⌄';color:#6B7393}
.st-toggle[open]>summary::after,.st-library-group[open]>summary::after{transform:rotate(180deg)}
.st-toggle[open]>summary{background:#F7F9FD}
.st-section-body{padding:0 14px 14px}
.st-section-body>.st-hint:first-child{margin-top:10px}
.st-library-group{border:1px solid #E3E7F1;border-radius:8px;margin-top:8px;padding:0 8px 8px}
.st-library-group:not([open]){padding-bottom:0}
.st-library-group>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;padding:9px 0;font-weight:600;font-size:12px}
.st-presets{grid-template-columns:repeat(2,1fr)}
.st-panel-hint{padding:0 14px;color:#6B7393;font-size:12px}
.st-saved-row{display:flex;gap:4px;margin:5px 0}.st-saved-row button:first-child{flex:1;text-align:left;overflow-wrap:anywhere}
.st-colors{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.st-colors button{height:29px;background:var(--color)!important;border:2px solid #D9DDE8;border-radius:6px;box-shadow:inset 0 0 0 2px #fff}
.st-colors button:hover{outline:2px solid var(--st-accent);outline-offset:1px}
.st-color-custom{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.st-color-custom label{display:flex;align-items:center;gap:6px;font-size:12px}
.st-color-custom input{width:36px;height:30px;padding:2px}
.st-dimensions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.st-full{width:100%;margin-top:10px}
/* Đường biên và gợi ý nhập chỉ hiện khi chỉnh sửa. */
@media screen{
 body:not(.st-preview):not(.st-export) .st-b.is-sel .st-c th,body:not(.st-preview):not(.st-export) .st-b.is-sel .st-c td{box-shadow:inset 0 0 0 1px #BFD0FF;min-width:24px;position:relative}
 body:not(.st-preview):not(.st-export) .st-b.is-sel .st-c td:empty,body:not(.st-preview):not(.st-export) .st-b.is-sel .st-c td:has(>br:only-child){background:rgba(91,140,255,.07)}
 body:not(.st-preview):not(.st-export) .st-b.is-sel .st-c td:empty::after,body:not(.st-preview):not(.st-export) .st-b.is-sel .st-c td:has(>br:only-child)::after{content:'Nhập…';position:absolute;left:2mm;top:2mm;color:#6B7393;font-size:10px;pointer-events:none}
}
.st-sec h4{margin:0 0 10px;font:700 13px/1.3 var(--f-display);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.st-muted{color:#8A91AD;font:500 11.5px/1.3 var(--f-ui)}
.st-lbl{margin:12px 0 6px;font:600 11.5px/1.3 var(--f-ui);color:#454E70}
.st-hint{margin:8px 0 0;font-size:12px;color:#6B7393}

const QO_KIND='quote-lab-options',QO_VERSION=1;
const QO_SCOPE_NAMES={work:'Work OS',hrm:'HRM OS',combo:'Base Combo','crm-suite':'CRM Suite','crm-mkt':'CRM MKT','crm-sale':'CRM Sale',hiring:'E-Hiring',usage:'AI Credit',labor:'Lao động trực tiếp'};
function qoReadPackage(value){
  const p=typeof value==='string'?JSON.parse(value):value;
  if(!p||p.kind!==QO_KIND||p.version!==QO_VERSION)throw new Error('Cần file phương án .json xuất từ Quote Lab.');
  if(!Array.isArray(p.options)||!p.options.length||p.options.length>3)throw new Error('File phải có từ 1 đến 3 phương án.');
  const ids=new Set();
  const options=p.options.map(o=>{
    const r=o?.r;if(!r||typeof r.id!=='string'||!r.id||ids.has(r.id)||!Number.isInteger(r.years)||r.years<1||r.years>5||!Array.isArray(r.lines)||!r.lines.length)throw new Error('Một phương án trong file không hợp lệ.');
    ids.add(r.id);for(const k of ['monthly','software','total','serviceFee'])if(!Number.isFinite(r[k])||r[k]<0)throw new Error('Số tiền trong phương án không hợp lệ.');
    const ps=r.ps?.gross||0;if(!Number.isFinite(ps)||ps<0||Math.abs(r.total-r.software-ps-r.serviceFee)>1)throw new Error('Tổng tiền không khớp phần mềm + PS + phí dịch vụ.');
    for(const l of r.lines)if(typeof l.name!=='string'||!l.name||!Number.isFinite(l.monthly)||l.monthly<0||!Number.isFinite(l.seats)||l.seats<0||!Array.isArray(l.apps)||l.apps.some(a=>typeof a!=='string'))throw new Error('Hạng mục trong phương án không hợp lệ.');
    return {id:r.id,label:String(o.label||r.lines.filter(l=>!l.addon).map(l=>l.name).join(' + ')+' · '+r.years+' năm'),r:JSON.parse(JSON.stringify(r))};
  });
  return {kind:QO_KIND,version:QO_VERSION,exportedAt:p.exportedAt||null,policy:{effective:String(p.policy?.effective||'')},scopeNames:QO_SCOPE_NAMES,options,recommendedId:options.some(o=>o.id===p.recommendedId)?p.recommendedId:options[0].id};
}
function qoMakePackage(results,{effective='',heading=r=>r.lines.filter(l=>!l.addon).map(l=>l.name).join(' + ')}={}){
  return qoReadPackage({kind:QO_KIND,version:QO_VERSION,exportedAt:new Date().toISOString(),policy:{effective},options:results.map(r=>({r,label:heading(r)+' · '+r.years+' năm'}))});
}

// Hồ sơ khách hàng cho báo giá: file .md/.txt theo mẫu "# MỤC", "Nhãn: giá trị" và "- cột | cột".
const QF_SECTIONS={'BAO GIA':'quote','KHACH HANG':'customer','NGUOI NHAN':'recipients','NGUOI LAP':'preparer','THONG DIEP':'message','NOI DAU':'pains','CHI PHI HIEN TAI':'costs','CHI SO CHINH':'mainKpi','CHI SO THANH CONG':'kpis','GIAI PHAP':'solutions','LO TRINH':'timeline','TRONG PHAM VI':'inScope','NGOAI PHAM VI':'outScope','KHACH HANG PHOI HOP':'duties','NGHIEM THU':'gates','DOANH NGHIEP TUONG TU':'cases','DOI NGU':'team','RUI RO':'risks','DIEU KHOAN':'terms','THANH TOAN':'payment','UU DAI':'offers','BUOC TIEP THEO':'steps'};
const qfFold=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toUpperCase().replace(/\s+/g,' ').trim();

// "1.100" · "1100" · "1,1" · "2,16" → số; trả null nếu không đọc được.
function qfNumber(s){
  let t=String(s??'').replace(/[^\d.,-]/g,'');if(!t||!/\d/.test(t))return null;
  if(t.includes(',')&&t.includes('.'))t=t.replace(/\./g,'').replace(',','.');
  else if(t.includes(','))t=t.replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');
  const n=Number(t);return Number.isFinite(n)?n:null;
}
// "02/11/2026" · "2/11" (lấy năm tham chiếu) · "2026-11-02" → {iso, text}
function qfDate(s,refYear){
  const t=String(s??'').trim();let m=t.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?$/),y,mo,d;
  if(m){d=+m[1];mo=+m[2];y=m[3]?+m[3]:refYear;}
  else if((m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))){y=+m[1];mo=+m[2];d=+m[3];}
  else return null;
  if(!y||mo<1||mo>12||d<1||d>31)return null;
  const p=n=>String(n).padStart(2,'0');
  return {iso:`${y}-${p(mo)}-${p(d)}`,text:`${p(d)}/${p(mo)}/${y}`,short:`${p(d)}/${p(mo)}`};
}

function parseDealFile(text){
  const raw={},warnings=[],errors=[],stray=new Set();let cur=null,lastKV=null,lastItem=null;
  for(const line of String(text??'').replace(/^\uFEFF/,'').split(/\r?\n/)){
    const t=line.trim();
    if(!t){lastKV=lastItem=null;continue;}
    if(t.startsWith('>')||t.startsWith('<!--')||t.startsWith('//'))continue;
    const h=t.match(/^#{1,3}\s+(.+)$/);
    if(h){const key=QF_SECTIONS[qfFold(h[1].replace(/\(.*$/,''))];cur=key??null;if(key)raw[key]??={kv:{},items:[]};else warnings.push(`Không nhận ra mục “${h[1].trim()}”; phần này được bỏ qua.`);lastKV=lastItem=null;continue;}
    if(!cur)continue;
    const sec=raw[cur],li=t.match(/^[-*•]\s*(.*)$/);
    if(li){const cells=li[1].split('|').map(s=>s.trim());if(cells.some(Boolean)){sec.items.push(cells);lastItem=cells;}lastKV=null;continue;}
    const kv=t.match(/^([^:|]{1,48}):\s*(.*)$/);
    if(kv&&!/^\d/.test(kv[1])&&!/^https?$/i.test(kv[1])){const k=qfFold(kv[1]);sec.kv[k]=kv[2].trim();lastKV=k;lastItem=null;continue;}
    if(lastKV)sec.kv[lastKV]=(sec.kv[lastKV]+' '+t).trim();
    else if(lastItem)lastItem[lastItem.length-1]=(lastItem[lastItem.length-1]+' '+t).trim();
    else stray.add(cur);
  }
  for(const s of stray)warnings.push(`Mục ${s}: có dòng không theo dạng “Nhãn: giá trị” hoặc “- cột | cột”, đã bỏ qua.`);
  const sec=k=>raw[k]??{kv:{},items:[]};
  const get=(k,...names)=>{const s=sec(k);for(const n of names){const v=s.kv[qfFold(n)];if(v)return v;}return '';};
  const cell=(a,i)=>(a[i]??'').trim();
  const flag=(v,word)=>qfFold(v).includes(qfFold(word));

  const quoteDate=qfDate(get('quote','Ngày báo giá','Ngày'))??qfDate(new Date().toLocaleDateString('en-GB'));
  const refYear=+quoteDate.iso.slice(0,4);
  const valid=qfDate(get('quote','Hiệu lực đến','Hiệu lực'),refYear);
  const deal={

    customer:{name:get('customer','Tên công ty','Tên khách hàng','Khách hàng'),short:get('customer','Tên ngắn'),tax:get('customer','Mã số thuế'),address:get('customer','Địa chỉ'),context:get('customer','Bối cảnh'),goal:get('customer','Mục tiêu'),industry:get('customer','Ngành'),industryContext:get('customer','Bối cảnh ngành')},
    recipients:sec('recipients').items.map(a=>({name:cell(a,0),title:cell(a,1),phone:cell(a,2),email:cell(a,3)})).filter(x=>x.name),
    preparer:{name:get('preparer','Họ tên','Tên'),title:get('preparer','Chức danh'),phone:get('preparer','Điện thoại','Số điện thoại'),email:get('preparer','Email'),company:get('preparer','Pháp nhân','Công ty'),tax:get('preparer','Mã số thuế'),address:get('preparer','Địa chỉ'),signer:get('preparer','Người ký'),signerTitle:get('preparer','Chức danh người ký')},
    message:{title:get('message','Tiêu đề bìa','Tiêu đề'),highlight:get('message','Điểm nhấn'),lead:get('message','Mô tả')},
    pains:{source:get('pains','Ghi nhận qua','Nguồn'),heading:get('pains','Tiêu đề'),lead:get('pains','Mô tả'),items:sec('pains').items.map(a=>({title:cell(a,0),quote:cell(a,1).replace(/^["“]|["”]$/g,''),who:cell(a,2),fact:cell(a,3)})).filter(x=>x.title)},
    costs:{heading:get('costs','Tiêu đề'),note:get('costs','Ghi chú'),source:get('costs','Nguồn'),dateText:get('costs','Ngày ghi nhận'),items:sec('costs').items.map(a=>({item:cell(a,0),method:cell(a,1),amount:qfNumber(cell(a,2)),cash:flag(cell(a,3),'tiền mặt')})).filter(x=>x.item)},
    mainKpi:null,
    kpis:{when:get('kpis','Thời điểm đo'),confirmed:get('kpis','Xác nhận'),note:get('kpis','Ghi chú'),items:sec('kpis').items.map(a=>({name:cell(a,0),current:cell(a,1),target:cell(a,2),owner:cell(a,3)})).filter(x=>x.name)},
    solutions:{heading:get('solutions','Tiêu đề'),excluded:get('solutions','Chưa đưa vào'),items:sec('solutions').items.map(a=>{const numbered=/^\d+$/.test(cell(a,0)),b=numbered?a:['',...a];return {no:cell(b,0),problem:cell(b,1),apps:cell(b,2).split(/[,;]/).map(s=>s.trim()).filter(Boolean),desc:cell(b,3),result:cell(b,4)};}).filter(x=>x.problem)},
    timeline:{heading:get('timeline','Tiêu đề'),lead:get('timeline','Mô tả'),items:[]},
    inScope:sec('inScope').items.map(a=>a.filter(Boolean).join(' · ')).filter(Boolean),

    terms:sec('terms').items.map(a=>({label:cell(a,0),text:cell(a,1)})).filter(x=>x.label),

  const k=sec('mainKpi');
  if(Object.values(k.kv).some(Boolean)){
    const m={name:get('mainKpi','Tên','Chỉ số'),unit:get('mainKpi','Đơn vị'),current:qfNumber(get('mainKpi','Hiện tại')),target:qfNumber(get('mainKpi','Mục tiêu')),threshold:qfNumber(get('mainKpi','Ngưỡng')),thresholdLabel:get('mainKpi','Nhãn ngưỡng'),heading:get('mainKpi','Tiêu đề'),lead:get('mainKpi','Mô tả')};

    const s=qfDate(cell(a,1),refYear),e=qfDate(cell(a,2),refYear);
    if(!cell(a,0))continue;
    if(!s){warnings.push(`Lộ trình “${cell(a,0)}”: ngày bắt đầu không hợp lệ (dùng dd/mm/yyyy).`);continue;}
    deal.timeline.items.push({name:cell(a,0),start:s.iso,end:(e??s).iso,startText:s.text,endText:(e??s).text,milestone:!e||e.iso===s.iso,key:flag(cell(a,3),'chính')});
  }
  for(const a of sec('steps').items){
    const dt=qfDate(cell(a,0),refYear);if(!cell(a,1))continue;
    deal.steps.items.push({date:dt?.iso??'',dateText:dt?.short??cell(a,0),task:cell(a,1),owner:cell(a,2),key:flag(cell(a,3),'chính')});
  }
  if(valid&&valid.iso<deal.quote.date)errors.push(`“Hiệu lực đến” (${valid.text}) sớm hơn “Ngày báo giá” (${deal.quote.dateText}).`);
  for(const x of deal.steps.items)if(x.date&&x.date<deal.quote.date)warnings.push(`Bước tiếp theo “${x.task}” có ngày ${x.dateText}, trước ngày báo giá.`);
  for(const x of deal.timeline.items)if(x.start<deal.quote.date)warnings.push(`Lộ trình “${x.name}” bắt đầu ${x.startText}, trước ngày báo giá.`);
  if(!deal.customer.name)errors.push('Thiếu “Tên công ty” trong mục # KHÁCH HÀNG.');
  if(!deal.customer.short)deal.customer.short=deal.customer.name.replace(/^(Công ty|Cty)\s+(TNHH|CP|Cổ phần)?\s*/i,'').trim()||deal.customer.name;
  if(!deal.recipients.length)warnings.push('Chưa có người nhận trong mục # NGƯỜI NHẬN.');
  if(!deal.quote.validText)warnings.push('Chưa có “Hiệu lực đến” trong mục # BÁO GIÁ.');
  if(deal.costs.items.some(c=>c.amount===null))warnings.push('Một số dòng chi phí chưa có số tiền (triệu đồng) ở cột thứ ba.');
  return deal;
}

// Thư viện use-case: mỗi use-case bắt đầu bằng "# USE-CASE"; kết quả viết "- Chỉ số | Trước | Sau".
function parseUseCaseFile(text,fileName=''){
  const blocks=[],warnings=[];let cur=null,lastKV=null,lastItem=null;
  const start=title=>{cur={title,kv:{},items:[]};blocks.push(cur);lastKV=lastItem=null;};
  for(const line of String(text??'').replace(/^\uFEFF/,'').split(/\r?\n/)){
    const t=line.trim();
    if(!t){lastKV=lastItem=null;continue;}
    if(t.startsWith('>')||t.startsWith('<!--')||t.startsWith('//'))continue;
    const h=t.match(/^#{1,3}\s+(.+)$/);
    if(h){const m=h[1].match(/^use[\s-]*case\b\s*[:·\-–]?\s*(.*)$/i);if(m)start(m[1].trim());else if(cur)cur.title=cur.title||h[1].trim();continue;}
    if(!cur)start('');
    const li=t.match(/^[-*•]\s*(.*)$/);
    if(li){const cells=li[1].split('|').map(x=>x.trim());if(cells.some(Boolean)){cur.items.push(cells);lastItem=cells;}lastKV=null;continue;}
    const kv=t.match(/^([^:|]{1,48}):\s*(.*)$/);
    if(kv&&!/^\d/.test(kv[1])&&!/^https?$/i.test(kv[1])){const k=qfFold(kv[1]);cur.kv[k]=kv[2].trim();lastKV=k;lastItem=null;continue;}
    if(lastKV)cur.kv[lastKV]=(cur.kv[lastKV]+' '+t).trim();
    else if(lastItem)lastItem[lastItem.length-1]=(lastItem[lastItem.length-1]+' '+t).trim();
  }
  const hash=x=>{let h=5381;for(let i=0;i<x.length;i++)h=((h*33)^x.charCodeAt(i))>>>0;return h.toString(36);};
  const cases=[];
  blocks.forEach((b,i)=>{
    const get=(...names)=>{for(const n of names){const v=b.kv[qfFold(n)];if(v)return v;}return '';};
    const name=get('Tên','Doanh nghiệp','Khách hàng')||b.title;
    const results=b.items.map(a=>a.filter(Boolean).length>=3?{metric:a[0],before:a[1],after:a[2]}:{text:a.filter(Boolean).join(' · ')}).filter(r=>r.metric||r.text);
    if(!results.length&&get('Kết quả'))results.push({text:get('Kết quả')});
    const problem=get('Bài toán','Vấn đề');
    if(!name){warnings.push(`Use-case thứ ${i+1}${fileName?' trong '+fileName:''}: thiếu “Tên”, đã bỏ qua.`);return;}
    if(!problem&&!results.length){warnings.push(`Use-case “${name}”: cần ít nhất “Bài toán” hoặc một dòng kết quả.`);return;}
    const pub=qfFold(get('Công khai tên','Nêu tên'));
    cases.push({id:'uc-'+hash(fileName+'|'+name+'|'+problem),file:fileName,name,public:/^(CO|YES|X|DONG Y)/.test(pub),industry:get('Ngành'),size:get('Quy mô'),problem,apps:get('App','Ứng dụng','Sản phẩm').split(/[,;]/).map(x=>x.trim()).filter(Boolean),solution:get('Giải pháp','Cách làm'),duration:get('Thời gian triển khai','Triển khai'),quote:get('Trích lời','Lời khách').replace(/^["“]|["”]$/g,''),who:get('Người nói'),reference:get('Người tham chiếu','Tham chiếu'),source:get('Nguồn'),results,sample:/^\[\s*mẫu\s*\]/i.test(name)});
  });
  if(!blocks.length)warnings.push(`${fileName||'Nội dung'}: không tìm thấy use-case nào (mỗi use-case bắt đầu bằng “# USE-CASE”).`);
  return {cases,warnings};
}

// Báo cáo kiểm tra trước khi tải lên: dùng chung cho tab Soạn báo giá và lệnh check-profile.
function profileReport(text,fileName=''){
  const t=String(text??'');
  if(/^#{1,3}\s*use[\s-]*case\b/im.test(t)){
    const {cases,warnings}=parseUseCaseFile(t,fileName),w=[...warnings];
    for(const c of cases){
      if(c.sample)w.push(`“${c.name}”: use-case mẫu, số liệu minh hoạ; không dùng gửi khách.`);
      if(!c.public)w.push(`“${c.name}”: chưa ghi “Công khai tên: có”, báo giá sẽ ẩn tên doanh nghiệp.`);
      if(!c.reference&&!c.source)w.push(`“${c.name}”: chưa có nguồn hoặc người tham chiếu.`);
      if(!c.results.some(r=>r.metric))w.push(`“${c.name}”: chưa có kết quả dạng “- Chỉ số | Trước | Sau”.`);
    }
    const errors=cases.length?[]:['Không đọc được use-case nào.'];
    return {kind:'usecase',ok:!errors.length,errors,warnings:w,cases,summary:[`File use-case: ${cases.length} case`,...cases.map(c=>`  - ${c.name}${c.industry?' · '+c.industry:''} · ${c.results.length} kết quả${c.public?'':' · ẩn tên'}`)]};
  }
  const d=parseDealFile(t),w=[...d.warnings];
  const holders=[...new Set(t.split(/\r?\n/).filter(l=>!l.trim().startsWith('>')).join('\n').match(/\[[^\]\n]{1,60}\]/g)||[])];
  if(holders.length)w.push(`Còn ${holders.length} chỗ giữ chỗ chưa điền: ${holders.slice(0,6).join(', ')}${holders.length>6?'…':''}`);
  if(d.quote.tag)w.push(`Bìa còn nhãn “${d.quote.tag}”: xoá dòng “Nhãn mẫu” khi gửi khách thật.`);
  if(!d.quote.no)w.push('Chưa có “Số báo giá”.');
  if(!d.preparer.name)w.push('Chưa có tên người lập trong mục # NGƯỜI LẬP.');
  if(!d.message.title)w.push('Chưa có “Tiêu đề bìa”: bìa dùng tiêu đề mặc định.');
  if(!d.pains.items.length)w.push('Chưa có nỗi đau: báo giá không có mục Hiện trạng.');
  else{const n=d.pains.items.filter(p=>!p.quote).length;if(n)w.push(`${n} nỗi đau chưa có lời khách nói.`);}
  if(!d.mainKpi&&!d.kpis.items.length)w.push('Chưa có chỉ số thành công: báo giá không có mục Mục tiêu.');
  if(!d.solutions.items.length)w.push('Chưa có dòng giải pháp: báo giá không có mục Giải pháp.');
  if(!d.steps.items.length)w.push('Chưa có bước tiếp theo có ngày.');
  const counts=[['người nhận',d.recipients.length],['nỗi đau',d.pains.items.length],['dòng chi phí',d.costs.items.length],['chỉ số',d.kpis.items.length+(d.mainKpi?1:0)],['dòng giải pháp',d.solutions.items.length],['mốc lộ trình',d.timeline.items.length],['bước tiếp theo',d.steps.items.length]].filter(([,n])=>n).map(([l,n])=>`${n} ${l}`).join(', ');
  return {kind:'deal',ok:!d.errors.length,errors:d.errors,warnings:w,deal:d,summary:[`Khách hàng: ${d.customer.name||'—'}${d.customer.short&&d.customer.short!==d.customer.name?' ('+d.customer.short+')':''}`,`Báo giá: ${d.quote.no||'—'} · ngày ${d.quote.dateText} · hiệu lực đến ${d.quote.validText||'—'}`,`Đọc được: ${counts||'chưa có mục nào'}`]};
}
function formatProfileReport(r,fileName=''){
  const lines=[`== ${fileName||'Nội dung'} · ${r.kind==='usecase'?'File use-case':'Hồ sơ khách hàng'}`,...r.summary];
  if(r.errors.length)lines.push(`Lỗi (${r.errors.length}) — phải sửa:`,...r.errors.map(e=>'  ✕ '+e));
  if(r.warnings.length)lines.push(`Lưu ý (${r.warnings.length}):`,...r.warnings.map(e=>'  ! '+e));
  lines.push(r.ok?'Kết quả: ĐẠT — tải lên Quote Lab được.':'Kết quả: CHƯA ĐẠT — sửa lỗi rồi kiểm tra lại.');
  return lines.join('\n');
}

const stP2E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stP2Has=s=>!!String(s??'').trim()&&!/^\[[\s\S]*\]$/.test(String(s).trim());
const stP2Fold=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase().replace(/\s+/g,' ').trim();
const stP2N=(n,d=0)=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:d}).format(n);
const stP2Money=n=>stP2N(Math.round(n))+' đ';
const stP2Big=n=>Math.abs(n)>=1e9?stP2N(n/1e9,2)+' tỷ đồng':stP2N(n/1e6,1)+' triệu đồng';
const stP2Table=(head,rows,cls='')=>`<table class="${cls}"><thead><tr>${head.map(h=>`<th>${stP2E(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

  let n=Math.round(Math.abs(value));if(!n)return 'Không đồng';
  const d=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'],units=['','nghìn','triệu','tỷ','nghìn tỷ','triệu tỷ'];
  const three=(x,full)=>{const h=Math.floor(x/100),t=Math.floor(x%100/10),u=x%10,w=[];
    if(full||h)w.push(d[h]+' trăm');
    if(t>1){w.push(d[t]+' mươi');if(u===1)w.push('mốt');else if(u===4)w.push('tư');else if(u===5)w.push('lăm');else if(u)w.push(d[u]);}
    else if(t===1){w.push('mười');if(u===5)w.push('lăm');else if(u)w.push(d[u]);}
    else if(u){if(full||h)w.push('lẻ');w.push(d[u]);}
    return w.join(' ');};
  const groups=[];while(n>0){groups.push(n%1000);n=Math.floor(n/1000);}
  const out=[];
  for(let i=groups.length-1;i>=0;i--){if(!groups[i])continue;out.push(three(groups[i],i<groups.length-1)+(units[i]?' '+units[i]:''));}
  const s=(value<0?'âm ':'')+out.join(' ')+' đồng';
  return s.charAt(0).toUpperCase()+s.slice(1);
}

const stB=(type,html,w,style,extra={})=>({id:stId('b'),type,w:w??ST_TYPES[type].w,style:style??ST_TYPES[type].style,h:0,html,...extra});
const stHead=(eyebrow,h,lead)=>stB('heading',`<p class="eyebrow">${stE(eyebrow)}</p><h2>${stE(h)}</h2>${lead?`<p class="lead">${stE(lead)}</p>`:''}`);
const stTable=(head,rows,cls='')=>`<table${cls?` class="${cls}"`:''}><thead><tr>${head.map(h=>`<th${h.num?' class="num"':''}>${stE(h.t??h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${head[i]?.num?' class="num"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const stSpan=n=>n<=1?12:n===2?6:4;
const stClean=s=>s&&!/^\[.*\]$/.test(String(s).trim());

// Tên dòng gói và mức nhân sự.
function stLineName(l,scopeNames){return (l.addon?'Add-on ':l.scope==='combo'?'':(scopeNames[l.scope]||l.scope)+' · ')+l.name+(l.lite?' Lite':'');}
function stPs(r){return r?.ps?.items?.length?r.ps:null;}
function stPeople(r){return (r.staff||[]).filter(g=>g.count>0).reduce((s,g)=>s+g.count,0);}

// Các block lấy số liệu từ phương án: dựng lại được khi Quote Lab gửi số mới.
function stSummaryMetrics(ctx){
  const {rec,years,valYear,valCash,payback}=ctx,r=rec.r,out=[],ps=stPs(r),people=stPeople(r);
  out.push([`Đầu tư ${years} năm, thanh toán trước`,stShort(r.total),`phần mềm ${stMoney(r.monthly)} mỗi tháng${ps?.gross?', cộng dịch vụ triển khai':''}`]);
  const pb=payback(rec);
  if(pb)out.push([valCash(rec)?'Hoàn vốn, chỉ tính tiền mặt':'Hoàn vốn ước tính',`~${pb} tháng`,`hiệu quả khoảng ${stBig(valYear(rec)||valCash(rec))} mỗi năm`]);
  if(people)out.push(['Người dùng',stNf(people)+' người',(r.staff||[]).filter(g=>g.count>0).map(g=>`${g.name} ${stNf(g.count)}`).join(' · ')]);
  if(out.length<3)out.push(['Kỳ hạn',`${years} năm`,'thanh toán trước toàn bộ']);
  return out.slice(0,3).map(([k,v,s])=>`<p class="k">${stE(k)}</p><p class="v">${stE(v)}</p><p class="s">${stE(s)}</p>`);
}
function stOptionHTML(o,i,ctx){
  const r=o.r,isRec=o.id===ctx.rec.id&&ctx.opts.length>1,ps=stPs(r),{scopeNames}=ctx;
  const chips=r.lines.filter(l=>l.scope!=='usage').map(l=>`<span class="chip">${stE((l.addon?'+ ':l.scope==='combo'?'':(scopeNames[l.scope]||l.scope)+' ')+l.name+(l.lite?' Lite':''))}</span>`).join(' ');
  const rows=[['Phần mềm mỗi tháng',stMoney(r.monthly)],[`Phần mềm ${r.years*12} tháng`,stMoney(r.software)+(r.discountAmount?` (đã trừ chiết khấu ${stNf(r.discount,1)}%)`:'')]];
  if(ps?.gross)rows.push(['Dịch vụ triển khai (PS)',stMoney(ps.gross)+' · một lần, gồm VAT']);
  if(r.serviceFee)rows.push(['Phí dịch vụ khác',stMoney(r.serviceFee)]);
  if(ctx.valYear(o))rows.push(['Hiệu quả mỗi năm',stShort(ctx.valYear(o))+(ctx.valCash(o)?` (${stShort(ctx.valCash(o))} tiền mặt)`:'')]);
  const pb=ctx.payback(o);if(pb)rows.push([ctx.valCash(o)?'Hoàn vốn, tiền mặt':'Hoàn vốn',`~${pb} tháng`]);
  rows.push(['Kỳ hạn',`${r.years} năm`]);
  return `<p class="eyebrow">Phương án ${i+1}${isRec?' · Khuyến nghị':''}</p><h3>${stE(o.label)}</h3>${o.solves?`<p class="s">${stE(o.solves)}</p>`:''}<p class="chips">${chips}</p><p class="v">${stE(stShort(r.total))}</p><p class="s">tổng ${r.years} năm${ps?.gross||r.serviceFee?', gồm dịch vụ triển khai':''}</p><table class="kv"><tbody>${rows.map(([k,v])=>`<tr><td>${stE(k)}</td><td class="num">${stE(v)}</td></tr>`).join('')}</tbody></table>`;
}
function stPsHTML(rec){
  const ps=stPs(rec.r);if(!ps)return '';
  const qty=x=>x.qty?`${stNf(x.qty)} × ${x.pack||'buổi'}`:x.sessions?`${x.sessions} buổi`:x.sessionsText||'Theo chính sách';
  return `<h3>Dịch vụ triển khai đi kèm · tính một lần</h3>`+stTable(['Dịch vụ','Khối lượng','Phạm vi chính'],ps.items.map(x=>[stE(x.name),stE(qty(x))+(x.agents?`<br>tối đa ${x.agents} Agents`:''),stE((x.scope||[]).join(' · ')||(x.pack?'Mua thêm · '+x.pack:''))]));
}
function stPriceHTML(ctx){
  const {rec,deal:d,scopeNames}=ctx,r=rec.r,months=r.years*12,ps=stPs(r),q=d.quote||{};
  const start=q.serviceStart||'[Chưa xác nhận]',end=q.serviceEnd||'[Chưa xác nhận]';
  const row=(cells,cls='')=>`<tr${cls?` class="${cls}"`:''}>${cells}</tr>`;
  const sum=(label,val,cls='')=>row(`<td colspan="6">${stE(label)}</td><td class="num">${val}</td>`,'sum'+(cls?' '+cls:''));
  let body=r.lines.map(l=>row(`<td>${stE(l.scope==='combo'?'Base Combo':scopeNames[l.scope]||l.scope)}</td><td>${stE(l.name+(l.lite?' Lite':''))}</td><td>${l.lite?'15 TK (Lite)':l.fixedPrice?'1 gói':stNf(l.seats)+' TK'}</td><td>${stE(start)}</td><td>${stE(end)}</td><td class="num">${stNf(l.monthly)}</td><td class="num">${stNf(l.monthly*months)}</td>`)).join('');
  body+=sum(`Cộng phần mềm ${months} tháng theo giá niêm yết`,stNf(r.listPrice));
  body+=sum('Ưu đãi (nếu có)'+(r.discountAmount?` · Chiết khấu phần mềm ${stNf(r.discount,1)}%`:''),r.discountAmount?'−'+stNf(r.discountAmount):'Không');
  for(const offer of d.offers?.items||[])body+=sum('Ưu đãi có điều kiện: '+offer.offer+(offer.commit?' · '+offer.commit:''),stE(offer.value||'Theo điều kiện'));
  if(r.discountAmount)body+=sum('Cộng phần mềm sau chiết khấu',stNf(r.software));
  if(ps){
    body+=row(`<td colspan="7"><b>Dịch vụ triển khai (Professional Service) · tính một lần</b></td>`,'group');
    body+=ps.items.map(x=>row(`<td>${stE(x.name)}</td><td>${stE(x.pack||'Triển khai')}</td><td>${stE(x.qty?stNf(x.qty)+' gói':x.sessions?x.sessions+' buổi':'1 gói')}</td><td colspan="3">Một lần</td><td class="num">${x.waived?'Miễn phí':stNf(x.net)}</td>`)).join('');
    body+=sum('Cộng dịch vụ triển khai trước VAT',stNf(ps.net));
    if(ps.vat)body+=sum(`VAT ${stNf(ps.vat/ps.net*100)}% dịch vụ triển khai`,stNf(ps.vat));
  }
  if(r.serviceFee)body+=sum('Phí dịch vụ khác (đã gồm thuế nếu có)',stNf(r.serviceFee));
  body+=sum('Tổng giá trị hợp đồng',stNf(r.total),'total');
  return `<table class="price"><thead><tr><th>Gói sản phẩm</th><th>Gói dịch vụ</th><th>Số lượng tài khoản</th><th>Ngày bắt đầu</th><th>Ngày hết hạn</th><th class="num">Chi phí / tháng (VNĐ)</th><th class="num">Thành tiền (VNĐ)</th></tr></thead><tbody>${body}</tbody></table><p class="words"><b>Bằng chữ:</b> ${stE(stWords(r.total))}.</p><p class="s">Ghi chú: Kỳ hạn ${r.years} năm (${months} tháng); thanh toán trước toàn bộ. Chi phí / tháng là tổng phí của số tài khoản trên từng dòng. ${stE(q.note||'Ngày bắt đầu và ngày hết hạn dịch vụ được xác nhận khi ký hợp đồng.')}</p>`;
}

function stContext(payload){
  const d=payload.deal||{},opts=(payload.options||[]).filter(o=>o&&o.r);
  if(!opts.length)throw new Error('Chưa có phương án nào để dựng báo giá.');
  const rec=opts.find(o=>o.id===payload.recommendedId)||opts[0];
  const valYear=o=>(+o.valueYear>0?+o.valueYear:0)*1e6,valCash=o=>(+o.valueCash>0?+o.valueCash:0)*1e6;
  const payback=o=>{const v=valCash(o)||valYear(o);return v?Math.max(1,Math.round(o.r.total/(v/12))):null;};
  const c=d.customer||{};
  return {d,deal:d,opts,rec,years:rec.r.years,valYear,valCash,payback,scopeNames:payload.scopeNames||{},policy:payload.policy||{},short:c.short||c.name||'khách hàng',useCases:(payload.useCases||[]).filter(Boolean)};
}

// Dựng tài liệu Studio từ dữ liệu Quote Lab. Mục thiếu dữ liệu thì bỏ trang đó.
function stBuildDoc(payload,{baseLogo=''}={}){
  const ctx=stContext(payload),{d,opts,rec,years,short}=ctx,q=d.quote||{},c=d.customer||{},prep=d.preparer||{},msg=d.message||{};
  const pages=[],P=(bg,blocks,extra)=>{if(blocks.length)pages.push(stNewPage(bg,blocks,extra));};
  const assets={};if(baseLogo)assets['base-logo']=baseLogo;
  const p2=(type,extra={})=>{const html=stPhase2HTML(type,payload,extra);return html?stB(type,html,ST_TYPES[type].w,ST_TYPES[type].style,{...extra,...(['costOfDelay','assumptions','payment','cta'].includes(type)?{src:'phase2:'+type}:{})}):null;};
  const logo=(id,w)=>stB('logo',`<div class="img logo" contenteditable="false"><img alt="" data-asset="${id||''}"></div>`,w,'plain');

  // 1. Bìa
  const recips=(d.recipients||[]).map(x=>stE([x.name,x.title].filter(Boolean).join(', '))).join('<br>');
  P('dark',[
    ...(q.tag?[stB('text',`<p><span class="tag">${stE(q.tag)}</span></p>`,12,'plain')]:[]),
    stB('cover',`<h1>${stE(msg.title||'Đề xuất giải pháp cho '+short)}${msg.highlight?` <span class="hl">${stE(msg.highlight)}</span>`:''}</h1><p class="lead">${stE(msg.lead||`Đề xuất giải pháp và báo giá Base 2.0 cho ${c.name||short}.`)}</p>`,12,'plain'),
    stB('spacer','',12,'plain',{h:18}),
    ...(recips?[stB('text',`<p class="k">Kính gửi</p><p>${recips}</p>`,6,'plain')]:[]),
    stB('text',`<p class="k">Người lập</p><p>${stE(prep.name||'[Tên chuyên viên tư vấn]')}<br>${stE([prep.phone,prep.email].filter(Boolean).join(' · ')||'[Số điện thoại · Email]')}</p>${q.validText?`<p class="k" style="margin-top:3mm">Hiệu lực</p><p>Đến hết ngày ${stE(q.validText)}</p>`:''}`,6,'plain'),
    logo('base-logo',4),stB('spacer','',4,'plain'),logo('',4),
  ],{chrome:true,role:'cover'});

  // 2. Tóm tắt
  const pb=ctx.payback(rec),rows=[];
  if(c.context)rows.push(['Bối cảnh',c.context]);
  if(c.goal)rows.push(['Mục tiêu',c.goal]);
  rows.push(['Phương án khuyến nghị',`${rec.label}: ${rec.r.lines.filter(l=>!l.addon&&l.scope!=='usage').map(l=>stLineName(l,ctx.scopeNames)).join(', ')}.`]);
  const tl=d.timeline?.items||[],steps=d.steps?.items||[];
  if(tl.length){const ms=tl.filter(x=>x.milestone);rows.push(['Thời gian',`Bắt đầu ${tl[0].startText}${ms.length?'; '+ms.map(m=>`${stLc(m.name)} ${m.startText}`).join(', '):''}.`]);}
  if(steps.length)rows.push(['Bước tiếp theo',`${steps[0].task}${steps[0].dateText?' ngày '+steps[0].dateText:''}.`]);
  P('dark',[
    stHead('Tóm tắt điều hành',pb?`Đầu tư ${stBig(rec.r.total)} cho ${years} năm, hoàn vốn trong khoảng ${pb} tháng.`:`Đầu tư ${stBig(rec.r.total)} cho ${years} năm với phương án ${rec.label}.`,`Chúng tôi khuyến nghị phương án ${rec.label}.`),
    ...stSummaryMetrics(ctx).map((h,i)=>stB('metric',h,4,'card',{src:'metric:'+i})),
    stB('table',`<table class="kv"><tbody>${rows.map(([k,v])=>`<tr><th>${stE(k)}</th><td>${stE(v)}</td></tr>`).join('')}</tbody></table>`,12,'card',{src:'summary-rows'}),
    ...[p2('cta',{variant:'compact',style:'card'})].filter(Boolean),
  ],{role:'summary'});

  // 3. Hiện trạng
  const pains=d.pains?.items||[],costs=d.costs?.items||[];
  if(pains.length||costs.length){
    const costSum=costs.reduce((s,x)=>s+(x.amount||0),0)*1e6;
    const blocks=[stHead('Hiện trạng',d.pains?.heading||d.costs?.heading||(costSum?`Mỗi năm ${short} trả khoảng ${stBig(costSum)} cho cách vận hành hiện tại.`:`${pains.length} vấn đề ${short} cần giải quyết.`),d.pains?.lead||(pains.length?`${pains.length} vấn đề ghi nhận${d.pains?.source?' qua '+d.pains.source:''}, bằng lời của chính đội ngũ ${short}.`:''))];
    pains.forEach((p,i)=>blocks.push(stB('card',`<p class="no">${i+1}</p><h3>${stE(p.title)}</h3>${p.quote?`<p class="q">“${stE(p.quote)}”</p>`:''}${p.who?`<p class="s">${stE(p.who)}</p>`:''}${p.fact?`<p>${stE(p.fact)}</p>`:''}`,6,'card')));
    if(costs.length)blocks.push(stB('table',`<h3>Cái giá mỗi năm, ước tính thận trọng</h3>`+stTable(['Hạng mục','Cách tính',{t:'Ước tính mỗi năm',num:true}],[...costs.map(x=>[stE(x.item),stE(x.method),x.amount===null?'—':stE(stShort(x.amount*1e6))+(x.cash?' (tiền mặt)':'')]),['<b>Tổng</b>','',`<b>${stE(stShort(costSum))}</b>`]])+(d.costs?.note?`<p class="s">${stE(d.costs.note)}</p>`:''),12,'plain'));
    const funnel=p2('problemFunnel'),delay=p2('costOfDelay');if(funnel)blocks.splice(1,0,funnel);if(delay)blocks.push(delay);
    P('light',blocks,{role:'problem'});
  }

  // 4. Mục tiêu
  const k=d.mainKpi,kpis=d.kpis?.items||[];
  if(k||kpis.length){
    const unit=k?.unit?' '+k.unit:'';
    const blocks=[stHead('Mục tiêu và tiêu chí thành công',k?.heading||(k?`Đưa ${stLc(k.name)} từ ${k.current} về ${k.target}${unit}.`:'Thành công được đo bằng các chỉ số hai bên đã thống nhất.'),k?.lead||'')];
    if(k){blocks.push(stB('metric',`<p class="k">Hôm nay</p><p class="v bad">${stE(k.current+unit)}</p><p class="s">${stE(k.name)}</p>`,6,'card'));blocks.push(stB('metric',`<p class="k">Mục tiêu</p><p class="v ok">${stE(k.target+unit)}</p><p class="s">${k.threshold!==null&&k.threshold!==undefined?stE((k.thresholdLabel||'Ngưỡng')+': '+k.threshold+unit):stE(k.name)}</p>`,6,'card'));}
    if(kpis.length)blocks.push(stB('table',`<h3>${stE(d.kpis.when?'Chỉ số đo '+d.kpis.when:'Chỉ số thành công')}${d.kpis.confirmed?` <span class="tag">Đã xác nhận ${stE(d.kpis.confirmed)}</span>`:''}</h3>`+stTable(['Chỉ số','Hiện tại','Mục tiêu','Người theo dõi'],kpis.map(x=>[stE(x.name),stE(x.current),stE(x.target),stE(x.owner)]))+(d.kpis.note?`<p class="s">${stE(d.kpis.note)}</p>`:''),12,'white'));
    P('dark',blocks,{role:'goals'});
  }

  // 5. Giải pháp: chỉ gắn lợi ích khi dòng có pain liên quan và đủ nội dung.
  const sols=d.solutions?.items||[],nb=p2('needBenefit');
  if(sols.length){
    const blocks=[stHead('Giải pháp đề xuất',d.solutions.heading||'Giải pháp gắn với nhu cầu và kết quả khách hàng đã nêu.','')];
    if(nb)blocks.push(nb);
    const partial=sols.filter(s=>!stP2SolutionPain(d,s));
    if(partial.length)blocks.push(stB('table',stTable(['Vấn đề trong hồ sơ','Cách xử lý đã nhập','App / phạm vi'],partial.map(s=>[stE(s.problem),stE(s.desc||''),(s.apps||[]).map(stE).join(', ')])),12,'plain'));
    if(d.solutions.excluded)blocks.push(stB('note',`<p><b>Chưa đưa vào đợt này:</b> ${stE(d.solutions.excluded)}</p>`,12,'line'));
    P('light',blocks,{role:'solution'});
  }

  // 6. Use-case
  const ucs=ctx.useCases;
  if(ucs.length){
    const shown=u=>u.public?u.name:`Một doanh nghiệp ${stLc(u.industry||'cùng nhóm ngành')}`;
    const blocks=[stHead('Doanh nghiệp đã làm được',ucs.length===1?`${shown(ucs[0])} đã giải bài toán tương tự trên Base.`:`${ucs.length} doanh nghiệp đã giải bài toán tương tự trên Base.`,'Kết quả do chính doanh nghiệp ghi nhận sau khi vận hành trên Base.')];
    for(const u of ucs){
      const meta=[u.public?u.industry:'',u.size,u.duration?'triển khai '+u.duration:''].filter(Boolean).join(' · ');
      const res=(u.results||[]).map(r=>r.metric?`<tr><td>${stE(r.metric)}</td><td>${stE(r.before)}</td><td><b>${stE(r.after)}</b></td></tr>`:`<tr><td colspan="3">${stE(r.text)}</td></tr>`).join('');
      const role=u.public?u.who:(String(u.who||'').includes('·')?u.who.split('·').slice(1).join('·').trim():'');
      const ref=[u.reference?'Người tham chiếu: '+u.reference:'',u.source?'Nguồn: '+u.source:''].filter(Boolean).join(' · ');
      blocks.push(stB('card',`<h3>${stE(shown(u))}</h3>${meta?`<p class="s">${stE(meta)}</p>`:''}${u.problem?`<p class="k">Bài toán</p><p>${stE(u.problem)}</p>`:''}${u.apps?.length||u.solution?`<p class="k">Cách làm trên Base</p>${u.apps?.length?`<p class="chips">${u.apps.map(a=>`<span class="chip">${stE(a)}</span>`).join(' ')}</p>`:''}${u.solution?`<p>${stE(u.solution)}</p>`:''}`:''}${res?`<p class="k">Kết quả</p><table class="res"><thead><tr><th>Chỉ số</th><th>Trước</th><th>Sau</th></tr></thead><tbody>${res}</tbody></table>`:''}${u.quote?`<p class="q">“${stE(u.quote)}”</p>${role?`<p class="s">${stE(role)}</p>`:''}`:''}${ref?`<p class="s">${stE(ref)}</p>`:''}`,ucs.length===1?12:6,'white'));
    }
    P('dark',blocks,{role:'proof'});
  }

  // 7. Phạm vi và lộ trình
  const inScope=d.inScope||[],outScope=d.outScope||[],duties=d.duties||[],gates=d.gates||[];
  if(tl.length||inScope.length||outScope.length||duties.length||gates.length){
    const blocks=[stHead(tl.length?'Phạm vi và lộ trình triển khai':'Phạm vi triển khai',d.timeline?.heading||'Phạm vi triển khai và trách nhiệm của hai bên.',d.timeline?.lead||'')];

    const lists=[['Trong phạm vi',inScope],['Ngoài phạm vi (báo giá riêng khi cần)',outScope],[`${short} phối hợp`,duties]].filter(([,a])=>a.length);

  // 8. Phương án đầu tư
  {

  // 9. Đội ngũ, rủi ro

  if(team.length||risks.length||cases.length){
    const blocks=[stHead(cases.length?'Bằng chứng, đội ngũ và cam kết':'Đội ngũ và cam kết',d.risks?.heading||(risks.length?'Mọi rủi ro chính đều đã có cách xử lý từ trước.':'Đội ngũ phụ trách triển khai và đồng hành sau triển khai.'),'')];

    P('light',blocks,{role:cases.length?'proof':'plan'});
  }

  // 10. Điều khoản
  {
    const anyPs=opts.some(o=>stPs(o.r)?.gross);
    const terms=d.terms?.length?[...d.terms]:[{label:'Thanh toán phần mềm',text:`Thanh toán trước toàn bộ phí phần mềm của kỳ hạn ${years} năm.`},{label:'Thuế',text:'Giá phần mềm không cộng VAT theo Chính sách giá Base 2.0'+(anyPs?'; dịch vụ triển khai (Professional Service) cộng VAT 8%':'')+'; phí dịch vụ khác đã gồm thuế nếu có.'},{label:'Căn cứ giá',text:`Chính sách giá Base 2.0${ctx.policy.effective?' hiệu lực '+ctx.policy.effective:''}.`}];
    if(anyPs&&!terms.some(t=>/triển khai|professional/i.test(t.label)))terms.push({label:'Dịch vụ triển khai',text:'Phí Professional Service tính một lần cho cả hợp đồng, không nhân theo số năm; giá chưa gồm VAT, cộng VAT 8%.'});
    const blocks=[stHead('Điều khoản thương mại',q.validText?(q.reason?`Hiệu lực đến hết ${q.validText}, vì ${q.reason}.`:`Báo giá có hiệu lực đến hết ${q.validText}.`):'Điều khoản thương mại.','')];
    terms.filter(stP2PaymentTermAllowed).forEach(t=>blocks.push(stB('card',`<p class="k">${stE(t.label)}</p><p>${stE(t.text)}</p>`,6,'plain')));
    const offers=d.offers?.items||[];
    if(offers.length)blocks.push(stB('table',`<h3>Ưu đãi có điều kiện</h3>`+stTable([`${short} cam kết`,'Ưu đãi',{t:'Giá trị',num:true}],offers.map(o=>[stE(o.commit),stE(o.offer),stE(o.value)]))+(d.offers.note?`<p class="s">${stE(d.offers.note)}</p>`:''),12,'plain'));
    const payment=p2('payment',{w:12});if(payment)blocks.splice(1,0,payment);
    P('light',blocks,{role:'terms'});
  }

  // 11. Bước tiếp theo
  if(steps.length){
    const key=steps.find(s=>s.key),cta=p2('cta');
    P('dark',[
      stHead('Bước tiếp theo',d.steps.heading||(key?`${key.task} trước ${key.dateText}.`:`${steps[0].task} ngày ${steps[0].dateText}.`),''),
      stB('steps',`<ol class="steps">${steps.map(s=>`<li${s.key?' class="key"':''}><b>${stE(s.task)}</b> <span class="s">${stE([s.owner,s.dateText].filter(Boolean).join(' · '))}</span></li>`).join('')}</ol>`,12,'plain'),
      ...(cta?[cta]:[stB('text',`<p class="s">Người lập: ${stE([prep.name,prep.phone,prep.email].filter(Boolean).join(' · ')||'[Tên chuyên viên tư vấn]')}</p>`,12,'plain')]),
    ],{role:'action'});
  }

  // 12. Phụ lục: form báo giá dịch vụ Base
  {
    const company=stClean(prep.company)?prep.company:'Công ty Cổ phần Base Enterprise';
    const contact=(d.recipients||[])[0]||{},dp=q.dateText?.split('/')||[];

      logo('base-logo',4),
      stB('text',`<p><b>${stE(company.toUpperCase())}</b></p><p class="s">Địa chỉ trụ sở: ${stE(prep.address||'[Địa chỉ pháp nhân xuất hợp đồng]')}<br>${prep.tax?'Mã số thuế: '+stE(prep.tax)+' · ':''}Website: https://base.vn/</p>`,8,'plain'),
      stB('heading',`<h2 class="center">BÁO GIÁ DỊCH VỤ</h2><p class="center s">Hà Nội, ngày ${stE(dp[0]||'[ ]')} tháng ${stE(dp[1]||'[ ]')} năm ${stE(dp[2]||'[ ]')}${q.no?' · Số báo giá: '+stE(q.no):''}</p>`,12,'plain'),
      stB('text',`<p>Kính gửi Quý Khách Hàng: <b>${stE(c.name||short)}</b></p><p>Địa chỉ: ${stE(c.address||'[Địa chỉ khách hàng]')}</p><p>Người liên hệ: ${stE(contact.name||'[Họ tên]')}, Số điện thoại: ${stE(contact.phone||'[ ]')}, Email: ${stE(contact.email||'[ ]')}</p>${c.tax?`<p>Mã số thuế: ${stE(c.tax)}</p>`:''}<p>${stE(company)} (“Base”) trân trọng cảm ơn Quý Khách Hàng đã quan tâm và tin tưởng dịch vụ phần mềm mà Base cung cấp. Qua đây, Base xin gửi đến Quý Khách Hàng Báo Giá Dịch Vụ chi tiết đối với những sản phẩm và giải pháp của Base mà Quý Khách Hàng đang quan tâm.</p>`,12,'plain'),
      stB('table',stPriceHTML(ctx),12,'plain',{src:'price'}),
      stB('text',`<h3>1. Lưu ý</h3><p>Base cung cấp sản phẩm dịch vụ phần mềm không cộng VAT theo Chính sách giá Base 2.0${ctx.policy.effective?' hiệu lực '+stE(ctx.policy.effective):''}${stPs(rec.r)?'; dịch vụ triển khai (Professional Service) cộng VAT 8% và tính một lần':''}; phí dịch vụ khác đã gồm thuế nếu có.</p><p>Báo giá trên có hiệu lực đến ${stE(q.validText||'[Chưa xác nhận]')}.</p><p>Mọi chi tiết về báo giá, xin vui lòng liên hệ: ${stE(prep.name||'[Chuyên viên tư vấn]')}, Số điện thoại: ${stE(prep.phone||'[ ]')}, Email: ${stE(prep.email||'[ ]')}.</p><h3>2. Bảo mật thông tin</h3><p>Báo Giá Dịch Vụ này chỉ được áp dụng đối với ${stE(c.name||short)} mà không áp dụng với một bên thứ ba nào khác.</p><p>Bằng việc tiếp nhận Báo Giá Dịch Vụ này, Quý Khách Hàng mặc nhiên đồng ý bảo mật toàn bộ nội dung trong Báo Giá Dịch Vụ này.</p>`,12,'plain'),
      stB('spacer','',6,'plain'),
      stB('sign',`<p class="k center">Đại diện ${stE(company)}</p><p class="s center">${stE(prep.signerTitle||'[Chức danh người ký được uỷ quyền]')}</p><p class="sign-space"><br></p><p class="center"><b>${stE(prep.signer||'[Họ tên người ký được uỷ quyền]')}</b></p>`,6,'plain'),
    ],{role:'appendix'});
  }

  const roleOrder=['cover','summary','problem','goals','solution','plan','proof','investment','terms','action','appendix'];
  pages.sort((a,b)=>roleOrder.indexOf(a.role||stInferRole(a))-roleOrder.indexOf(b.role||stInferRole(b)));
  for(const page of pages){page.role=stInferRole(page);page.question=ST_ROLE_QUESTIONS[page.role];stSeedFocus(page);}

  return {
    id:stId('d'),version:1,created:Date.now(),updated:Date.now(),
    title:`Báo giá ${short}${q.no?' · '+q.no:''}`,
    header:{left:'BASE.VN · ĐỀ XUẤT GIẢI PHÁP VÀ BÁO GIÁ',right:[q.no,q.dateText].filter(Boolean).join(' · ')},
    footer:{left:`Base 2.0 · Đề xuất giải pháp và báo giá cho ${c.name||short}`},
    assets,pages,dismissed:[],notes:stNotes(payload),dealKey:stDealKey(payload),data:payload,
  };
}

const stDealKey=p=>[p?.deal?.quote?.no||'',p?.deal?.customer?.name||''].join('|');

// Pha 1: dữ liệu kiểm tra và tiêu điểm độc lập với DOM.
const ST_ROLE_NAMES={cover:'Bìa',summary:'Tóm tắt',problem:'Hiện trạng',goals:'Mục tiêu',solution:'Giải pháp',plan:'Triển khai',proof:'Bằng chứng',investment:'Đầu tư',terms:'Điều kiện',action:'Bước tiếp theo',appendix:'Phụ lục',custom:'Nội dung'};
function stText(html){
  return String(html??'').replace(/<(script|style)\b[^>]*>[\s\S]*?<\/\1>/gi,'').replace(/<[^>]+>/g,' ').replace(/&#(x[\da-f]+|\d+);/gi,(_,n)=>{const v=n[0].toLowerCase()==='x'?parseInt(n.slice(1),16):+n;return v>0&&v<=0x10ffff?String.fromCodePoint(v):' ';}).replace(/&(nbsp|amp|lt|gt|quot|apos);/gi,(_,n)=>({nbsp:' ',amp:'&',lt:'<',gt:'>',quot:'"',apos:"'"})[n.toLowerCase()]).replace(/\s+/g,' ').trim();
}
const stFold=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
function stInferRole(page){
  if(page.role)return page.role;
  if((page.blocks||[]).some(b=>b.type==='cover'))return 'cover';
  const first=(page.blocks||[]).find(b=>b.type==='heading')||(page.blocks||[]).find(b=>/class=["'][^"']*\beyebrow\b/.test(b.html)),eyebrow=first?.html.match(/<[^>]*class=["'][^"']*\beyebrow\b[^"']*["'][^>]*>([\s\S]*?)<\/[^>]+>/i)?.[1],name=stFold(stText(eyebrow||''));
  if(/tom tat/.test(name))return 'summary';if(/hien trang|boi canh/.test(name))return 'problem';
  if(/muc tieu|tieu chi/.test(name))return 'goals';if(/giai phap/.test(name))return 'solution';
  if(/doanh nghiep da|bang chung|use.case/.test(name))return 'proof';if(/phuong an|dau tu/.test(name))return 'investment';
  if(/lo trinh|pham vi|doi ngu/.test(name))return 'plan';if(/dieu khoan|dieu kien/.test(name))return 'terms';
  if(/buoc tiep|hanh dong/.test(name))return 'action';
  if((page.blocks||[]).some(b=>b.src==='price')||/bao gia dich vu/i.test(stFold(stText(first?.html))))return 'appendix';
  return 'custom';
}
function stPrepareDoc(doc){
  doc.dismissed??=[];
  for(const p of doc.pages||[]){p.role=stInferRole(p);for(const b of p.blocks||[])if(b.focus!==undefined)b.focus=b.focus===true;}
  return doc;
}
function stFocusPage(page,bid){
  if(!(page.blocks||[]).some(b=>b.id===bid))return false;
  for(const b of page.blocks){if(b.id!==bid&&b.focus&&b.style==='accent')b.style='card';b.focus=b.id===bid;}
  return true;
}
function stSeedFocus(page){
  if(['cover','appendix'].includes(stInferRole(page)))return;
  const blocks=page.blocks||[];if(!blocks.length)return;
  const current=blocks.find(b=>b.focus),accent=blocks.find(b=>b.style==='accent');
  const preferred={summary:b=>b.src==='summary-rows',problem:b=>b.type==='quote'||/class=["'][^"']*\bq\b/.test(b.html),goals:b=>b.type==='table',solution:b=>b.type==='needBenefit'||b.type==='table',plan:b=>b.type==='table'||b.type==='steps',proof:b=>b.type==='card',investment:b=>b.src?.startsWith('option:'),terms:b=>b.type==='card',action:b=>b.type==='cta'||b.type==='steps'}[stInferRole(page)];
  const chosen=current||accent||(preferred&&blocks.find(preferred))||blocks.find(b=>!['heading','spacer','divider','logo'].includes(b.type))||blocks.find(b=>b.type==='heading');
  if(chosen)stFocusPage(page,chosen.id);
}
function stApplyTypeStyle(doc,type,style){
  if(!ST_STYLES.some(([s])=>s===style))return 0;
  let changed=0;for(const p of doc.pages||[])for(const b of p.blocks||[])if(b.type===type&&!b.focus&&b.style!==style){b.style=style;changed++;}
  return changed;
}
function stRows(blocks){
  const rows=[];let row=[],used=0;
  for(const b of blocks||[]){const w=Math.max(1,Math.min(12,+b.w||12));if(used+w>12&&row.length){rows.push(row);row=[];used=0;}row.push(b);used+=w;if(used===12){rows.push(row);row=[];used=0;}}
  if(row.length)rows.push(row);return rows;
}
const stHasDate=t=>[...String(t).matchAll(/\b(\d{1,2})[/-](\d{1,2})(?:[/-](\d{2,4}))?\b/g)].some(m=>+m[1]>=1&&+m[1]<=31&&+m[2]>=1&&+m[2]<=12);
const stContact=t=>/[\w.+-]+@[\w.-]+\.[a-z]{2,}/i.test(t)||/(?:\+?84|0)[\d\s().-]{7,}\d/.test(t);
const stEvidence=html=>{
  const text=stText(html).replace(/\[[^\]]*\]/g,'');
  if(/(?:nguồn|ước tính|đã xác nhận)\s*:?[\s\S]{3,}/i.test(text))return true;
  const sources=[...String(html).matchAll(/<[^>]*class=["'][^"']*\bs\b[^"']*["'][^>]*>([\s\S]*?)<\/[^>]+>/gi)].map(m=>stText(m[1]).replace(/\[[^\]]*\]/g,'')).join(' ');
  return /khách(?: hàng)?/i.test(sources);
};

// measures[pageId] = { overflow, overflowMm?, units?: [[blockId,...],...] }.
// Chỉ tràn trang là lỗi chặn xuất; các quy tắc nội dung hỗ trợ người soạn rà lại.
function stLint(doc,measures={}){
  const items=[],pages=doc?.pages||[],add=(code,level,group,message,p,b,extra={})=>items.push({id:`${code}:${p?.id||'doc'}:${b?.id||extra.key||''}`,code,level,group,message,...(p?{pid:p.id}:{}),...(b?{bid:b.id}:{}),...extra});
  const typeStyles=new Map();
  for(const p of pages){
    const blocks=p.blocks||[],role=stInferRole(p),number=pages.indexOf(p)+1,m=measures[p.id]||{};
    if(m.overflow)add('L-over','error','layout',`Trang ${number} tràn A4${m.overflowMm?` khoảng ${m.overflowMm} mm`:''}. Chuyển phần tràn sang trang mới.`,p);
    const highlights=blocks.filter(b=>b.focus||b.style==='accent');
    if(!['cover','appendix'].includes(role)&&blocks.length&&!highlights.length)add('L-focus','suggestion','layout',`Trang ${number} chưa có tiêu điểm. Chọn một khối quan trọng nhất.`,p);
    if(highlights.length>1)add('L-focus','warning','layout',`Trang ${number} có ${highlights.length} khối tiêu điểm / nổi bật. Giữ một điểm nhấn chính.`,p,highlights[1]);
    const rows=Array.isArray(m.units)?m.units.map(row=>row.map(id=>blocks.find(b=>b.id===id)).filter(Boolean)):stRows(blocks);
    rows.slice(0,-1).forEach((row,i)=>{const sum=row.reduce((n,b)=>n+(+b.w||12),0);if(row.length&&sum<12)add('L-row','suggestion','layout',`Trang ${number}, hàng ${i+1} dùng ${sum}/12 cột. Thử bố cục cân bằng hoặc tăng độ rộng.`,p,row[0],{key:'row-'+i});});
    const meaningful=blocks.filter(b=>!['spacer','divider','logo'].includes(b.type)),last=meaningful.at(-1);
    if(last?.type==='heading')add('L-orphan','warning','layout',`Trang ${number} kết thúc bằng tiêu đề chưa có nội dung đi cùng.`,p,last);
    if(blocks.filter(b=>b.type==='spacer').length>2)add('L-spacer','suggestion','layout',`Trang ${number} có hơn hai khối khoảng trống. Ưu tiên dùng thang khoảng cách.`,p,blocks.find(b=>b.type==='spacer'));
    for(const b of blocks){
      const text=stText(b.html),ph=text.match(/\[[^\]\n]{1,60}\]/g);
      if(ph)add('C-ph','warning','content',`Trang ${number}: còn ${ph.length} chỗ giữ chỗ ${ph[0]}${ph.length>1?'…':''}.`,p,b);
      if(['solution','goals'].includes(role)&&/(?:\d+(?:[.,]\d+)?\s?%|(?:giảm|tăng)\s+\d+)/i.test(text)&&!stEvidence(b.html))add('C-promise','warning','content',`Trang ${number}: kết quả định lượng chưa có nguồn hoặc giả định. Ghi nguồn / “Ước tính” trước khi gửi.`,p,b);
      const titles=[...String(b.html||'').matchAll(/<h[12]\b[^>]*>([\s\S]*?)<\/h[12]>/gi)].map(x=>stFold(stText(x[1])));
      if(role==='investment'&&titles.some(t=>/\b(?:gia|chi phi|phi)\b/.test(t)))add('C-word','suggestion','content',`Trang ${number}: cân nhắc dùng “đầu tư” ở tiêu đề thay cho giá / chi phí.`,p,b);
      const images=[...String(b.html||'').matchAll(/<img\b([^>]*)>/gi)],empty=images.some(([,attrs])=>{const asset=attrs.match(/\bdata-asset\s*=\s*["']([^"']*)["']/i),src=attrs.match(/\bsrc\s*=\s*["']([^"']*)["']/i);return !(asset?String(doc.assets?.[asset[1]]||'').trim():src?.[1]?.trim());});
      const qr=String(b.html||'').match(/<[^>]*class=["'][^"']*\bqr\b[^"']*["'][^>]*>([\s\S]*?)<\/[^>]+>/i);
      if(empty||(qr&&!stText(qr[1])&&!/\b(?:src|href|data-asset)\s*=\s*["'][^"']+/.test(qr[0])))add('L-empty','warning','layout',`Trang ${number}: ảnh, logo hoặc QR chưa có nguồn. Khung trống không được in.`,p,b);
      if(!b.focus){if(!typeStyles.has(b.type))typeStyles.set(b.type,{styles:new Set(),p,b});typeStyles.get(b.type).styles.add(b.style||'plain');}
    }
  }
  for(const [type,x] of typeStyles)if(x.styles.size>=3)add('L-style','suggestion','layout',`Khối ${ST_TYPES[type]?.name||type} đang dùng ${x.styles.size} kiểu. Có thể áp một kiểu chung theo loại.`,x.p,x.b,{key:type});
  const content=pages.filter(p=>!['cover','appendix'].includes(stInferRole(p))&&p.blocks?.length),last=content.at(-1),actions=pages.filter(p=>stInferRole(p)==='action');
  const cta=last?.blocks.find(b=>b.type==='cta'&&stHasDate(stText(b.html).replace(/\[[^\]]*\]/g,''))||b.type==='steps'&&stHasDate(stText(b.html)));
  if(!cta)add('C-cta','warning','content','Cuối đề xuất chưa có một hành động tiếp theo có ngày (trước phụ lục).',last||pages.at(-1));
  if(!actions.some(p=>p.blocks.some(b=>stContact(stText(b.html)))))add('C-contact','warning','content','Trang bước tiếp theo chưa có điện thoại hoặc email của người lập.',actions.at(-1)||last);
  const visibleValidity=pages.some(p=>p.blocks.some(b=>{const t=stText(b.html),m=t.match(/hiệu lực[\s\S]{0,90}/i);return m&&stHasDate(m[0]);}));
  if(!visibleValidity)add('C-validity','warning','content','Chưa có hạn hiệu lực báo giá đã xác nhận.',pages.find(p=>stInferRole(p)==='terms')||last);
  for(const [i,note] of (doc?.notes||[]).entries()){
    const match=note.match(/Phương án (\d+)/),option=match&&doc.data?.options?.[+match[1]-1];let target=null;
    if(option)for(const p of pages){const b=p.blocks.find(b=>b.src==='option:'+option.id);if(b){target={p,b};break;}}
    add('N-source','warning','source',note,target?.p,target?.b,{key:String(i)});
  }
  return items;
}

// Cập nhật các block lấy số liệu (chỉ số tóm tắt, thẻ phương án, PS, bảng giá); giữ chữ đã sửa ở các block khác.
function stRefreshDoc(doc,payload){
  const ctx=stContext(payload),metrics=stSummaryMetrics(ctx);let changed=0;
  for(const p of doc.pages)for(const b of [...p.blocks]){
    if(!b.src)continue;let html=null;
    if(b.src.startsWith('phase2:')){
      if(!ST_P2_TYPES[b.src.slice(7)])continue;
      html=stPhase2HTML(b.src.slice(7),payload,b);
      if(html===null){p.blocks.splice(p.blocks.indexOf(b),1);if(b.focus)stSeedFocus(p);changed++;continue;}
      if(b.type==='assumptions'){const notes=b.html.match(/<!--st-assumption-extra-->[\s\S]*?<!--\/st-assumption-extra-->/)?.[0];if(notes)html=html.replace(/<!--st-assumption-extra-->[\s\S]*?<!--\/st-assumption-extra-->/,()=>notes);}
    }
    else if(b.src.startsWith('metric:'))html=metrics[+b.src.slice(7)]??null;
    else if(b.src.startsWith('option:')){const i=ctx.opts.findIndex(o=>o.id===b.src.slice(7));if(i>=0)html=stOptionHTML(ctx.opts[i],i,ctx);}
    else if(b.src==='ps')html=stPsHTML(ctx.rec)||null;
    else if(b.src==='price')html=stPriceHTML(ctx);
    if(html!==null&&html!==b.html){b.html=html;changed++;}
  }
  doc.data=payload;doc.notes=stNotes(payload);doc.updated=Date.now();
  return changed;
}

// Việc cần kiểm tra trước khi gửi; hiện trong Studio, không in.
function stNotes(payload){
  const notes=[],d=payload.deal||{},q=d.quote||{},opts=(payload.options||[]).filter(o=>o&&o.r),money=n=>stMoney(n);
  opts.forEach((o,i)=>{const x=o.r,p=`Phương án ${i+1}`,ps=stPs(x);
    if(x.approval)notes.push(`${p}: có Lite, chiết khấu hoặc miễn PS. Cần phê duyệt (Trading Order) trước khi gửi khách.`);
    if(!x.feeKnown)notes.push(`${p}: chưa xác nhận đủ phí dịch vụ${ps?' (PS '+money(ps.gross)+(ps.assumed?', có phần tạm tính':'')+')':''}.`);
    if(ps){for(const t of [...(ps.approvals||[]),...(ps.notes||[])])notes.push(`${p}: ${t}`);if(ps.items.some(i=>i.kind==='ai'&&i.net))notes.push(`${p}: thuế suất PS with AI chưa ghi trong chính sách; đang cộng VAT 8%. Xác nhận với kế toán.`);}
    if(x.gap)notes.push(`${p}: nằm ngoài khoảng ngân sách đã lọc.`);});
  for(const u of payload.useCases||[]){if(u.sample)notes.push(`Use-case “${u.name}” là mẫu định dạng, số liệu minh hoạ. Thay bằng use-case thật trước khi gửi.`);if(!u.public)notes.push(`Use-case “${u.name}” đang ẩn tên doanh nghiệp vì hồ sơ chưa ghi “Công khai tên: có”.`);if(!u.reference&&!u.source)notes.push(`Use-case “${u.name}” chưa có nguồn hoặc người tham chiếu.`);}
  if(q.tag)notes.push(`Bìa đang có nhãn “${q.tag}”. Xoá nhãn này khi gửi khách thật.`);
  notes.push('Đối chiếu các câu mô tả tính năng với sản phẩm thực tế trước khi gửi.');
  notes.push(...stPaymentIssues(payload));
  for(const w of d.warnings||[])notes.push('Hồ sơ: '+w);
  return notes;
}

const ST_CLOUD_EMAIL='dung.le05@base.vn',ST_CLOUD_CONFIG_KEY='st-firebase-config';

function stWorkspaceAdapter(repo,{sanitizeDoc=d=>d}={}){
  const templates=async()=>await repo.getKV(ST_TEMPLATE_KEY)||[];
  return {
    get:async(kind,id)=>kind==='doc'?repo.getDoc(id):kind==='draft'?repo.getDraft(id):kind==='template'?(await templates()).find(x=>x.id===id):kind==='library'?{id:'block-library',name:'Thư viện khối',blocks:await repo.getKV('st-library')||[]}:null,
    all:async kind=>kind==='doc'?repo.allDocs():kind==='draft'?(await repo.allDrafts()).filter(x=>x.workspaceInputs):kind==='template'?templates():kind==='library'?((await repo.getKV('st-library'))?.length?[{id:'block-library',name:'Thư viện khối',blocks:await repo.getKV('st-library')}]:[]):[],
    put:async(kind,entity)=>{
      if(kind==='doc'){const old=await repo.getDoc(entity.id),copy=sanitizeDoc(JSON.parse(JSON.stringify(entity)));delete copy.revision;return repo.saveDoc(copy,old?.revision||0);}
      if(kind==='draft')return repo.putDraft(entity);
      if(kind==='template'){let saved;await repo.updateKV(ST_TEMPLATE_KEY,list=>{const all=list||[],i=all.findIndex(t=>t.id===entity.id);saved={...entity,revision:(all[i]?.revision||0)+1,updated:Date.now()};if(i<0)all.push(saved);else all[i]=saved;return all;});return saved;}
      if(kind==='library'){await repo.setKV('st-library',entity.blocks||[]);return entity;}
      throw new Error('Loại dữ liệu đồng bộ không hợp lệ.');
    }
  };
}

// Kiểm tra thuần nhận dữ liệu và số đo; giao diện chỉ hiển thị và dẫn tới nội dung.
function stChecks(){
  const el=st$('#st-checks');if(!el||!stDoc)return;
  const all=stLint(stDoc,stMeasurements),dismissed=new Set(stDoc.dismissed||[]),visible=all.filter(x=>x.level!=='suggestion'||!dismissed.has(x.id));
  const counts={error:0,warning:0,suggestion:0};visible.forEach(x=>counts[x.level]++);
  const groups=[['layout','Bố cục'],['content','Nội dung'],['source','Lưu ý từ Quote Lab']],names={error:'Lỗi',warning:'Cảnh báo',suggestion:'Gợi ý'};
  el.innerHTML=`<p class="st-check-summary" aria-live="polite">${counts.error} lỗi · ${counts.warning} cảnh báo · ${counts.suggestion} gợi ý</p>${groups.map(([group,name])=>{
    const items=visible.filter(x=>x.group===group);if(!items.length)return '';
    return `<div class="st-check-group"><h5>${name}</h5><ul class="st-checks">${items.map(x=>`<li class="${x.level==='error'?'bad':x.level}" data-check-code="${x.code}"><button type="button" class="st-check-link"${x.bid?` data-goto-block="${stEsc(x.bid)}"`:x.pid?` data-goto-page="${stEsc(x.pid)}"`:''}><span class="st-check-level">${names[x.level]}</span>${stEsc(x.message)}</button>${x.level==='suggestion'?`<button type="button" class="st-dismiss" data-dismiss="${stEsc(x.id)}" aria-label="Ẩn gợi ý">Ẩn</button>`:''}</li>`).join('')}</ul></div>`;
  }).join('')}${visible.length?'':'<p class="st-hint">Không có gì cần xem thêm.</p>'}${all.some(x=>x.level==='suggestion'&&dismissed.has(x.id))?'<div class="st-check-options"><button type="button" data-act="checks-restore">Hiện lại gợi ý đã ẩn</button></div>':''}`;
}
function stSetFocus(bid){stFlush();const r=stFind(bid);if(!r)return;if(r.b.focus){r.b.focus=false;if(r.b.style==='accent')r.b.style='card';}else stFocusPage(r.p,bid);stRenderPage(r.p.id);stPanel();stCommit();}
function stSyncTypeStyle(bid){
  stFlush();const r=stFind(bid);if(!r)return;const changed=stApplyTypeStyle(stDoc,r.b.type,r.b.style);
  if(!changed){stToast('Các khối cùng loại đã dùng kiểu này; tiêu điểm giữ kiểu riêng.');return;}
  for(const p of stDoc.pages)if(p.blocks.some(b=>b.type===r.b.type&&!b.focus))stRenderPage(p.id);
  stPanel();stCommit();stToast(`Đã áp kiểu cho ${changed} khối · hoàn tác được một bước`);
}

// ---------- Chọn ----------
function stSetSel(s,{panel=true}={}){
  if(stSel?.bid!==s?.bid)stTextRange=null;
  stSel=s;
  st$$('.st-b.is-sel,.st-page.is-sel').forEach(e=>e.classList.remove('is-sel'));
  if(s?.bid)stBlockEl(s.bid)?.classList.add('is-sel');else if(s?.pid)stPageEl(s.pid)?.classList.add('is-sel');
  st$$('#st-pagelist li').forEach(li=>li.classList.toggle('is-cur',li.dataset.pid===s?.pid));
  if(panel)stPanel();
}
function stCurrentPage(){
  const c=st$('#st-canvas').getBoundingClientRect();let best=null,score=-1;
  for(const el of st$$('.st-page')){const r=el.getBoundingClientRect(),v=Math.min(r.bottom,c.bottom)-Math.max(r.top,c.top);if(v>score){score=v;best=el.dataset.pid;}}
  return best||stDoc.pages[0]?.id;
}
function stScrollTo(el){el?.scrollIntoView({behavior:'smooth',block:'start'});}

// ---------- Nội dung khối: đọc lại từ trang sau khi gõ ----------
function stFromDOM(bEl){
  const r=bEl&&stFind(bEl.dataset.bid);if(!r)return;
  const c=bEl.querySelector('.st-c').cloneNode(true);
  c.querySelectorAll('img[data-asset]').forEach(i=>i.removeAttribute('src'));
  c.querySelectorAll('.is-empty').forEach(x=>x.classList.remove('is-empty'));
  r.b.html=c.innerHTML;
}

// ---------- Thao tác khối & trang ----------
function stInsert(type,at,prepared){
  stFlush();if(!stDoc.pages.length)stDoc.pages.push(stNewPage('light'));
  const b=prepared||stNewBlock(type);let pid,index;
  if(type==='appList'&&!prepared){const pkg=stPackageChoices(stDoc.data)[0];b.packageId=pkg?.id;b.html=stAppListHTML(pkg);}
  if(at){pid=at.pid;index=at.index;}
  else if(stSel?.bid&&stFind(stSel.bid)){const r=stFind(stSel.bid);pid=r.p.id;index=r.i+1;}
  else{pid=stSel?.pid&&stPage(stSel.pid)?stSel.pid:stCurrentPage();index=stPage(pid).blocks.length;}
  stPage(pid).blocks.splice(index,0,b);stSel={pid,bid:b.id};stRenderPage(pid);stPanel();stCommit();
  const el=stBlockEl(b.id);el?.scrollIntoView({block:'nearest',behavior:'smooth'});
  if(!prepared&&(type==='image'||type==='logo'))stPickImage(b.id);else{const c=el?.querySelector('[contenteditable]'),first=c&&[...c.querySelectorAll('h1,h2,h3,p,li,td,th')].find(x=>x.textContent.trim()&&!x.querySelector('p,li,td'));if(c){c.focus();if(first)stSelectAllIn(first);}}
}
function stSelectAllIn(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);}
function stInsertPreset(id,at){const b=stPresetBlock(id,stDoc?.data);if(b)stInsert(b.type,at,b);}
function stApplyAppPackage(bid,packageId){
  const r=stFind(bid),pkg=stPackageChoices(stDoc?.data).find(x=>x.id===packageId);if(!r||!pkg||r.b.type!=='appList')return;
  stFlush();r.b.packageId=pkg.id;r.b.html=stAppListHTML(pkg);stRenderPage(r.p.id);stPanel();stCommit();
}
async function stSaveLibrary(){
  stFlush();const b=stSel?.bid&&stFind(stSel.bid)?.b;if(!b)return;
  if(b.src){stToast('Khối số liệu liên kết lấy theo từng quotation. Dùng mẫu trong thư viện để tránh mang giá của khách cũ sang bản mới.');return;}
  const v=await stDialog('Lưu khối vào thư viện','<label class="st-field"><span>Tên mẫu</span><input id="st-library-name" maxlength="80" value="'+stEsc(ST_TYPES[b.type]?.name||'Khối nội dung')+'"></label>',[{label:'Huỷ',value:false},{label:'Lưu mẫu',value:true,primary:true}]);
  if(!v)return;const name=st$('#st-library-name').value.trim();if(!name){stToast('Cần đặt tên cho mẫu.');return;}
  const block=stQuoteClone(b);delete block.id;delete block.src;block.focus=false;if(block.style==='accent')block.style='card';block.html=stSanitize(block.html);
  const assets={};const box=document.createElement('template');box.innerHTML=block.html;box.content.querySelectorAll('img[data-asset]').forEach(i=>{if(stDoc.assets[i.dataset.asset])assets[i.dataset.asset]=stDoc.assets[i.dataset.asset];i.removeAttribute('src');});block.html=box.innerHTML;
  try{const all=await stStore.getKV('st-library')||[];all.push({id:stQuoteId('tpl'),name,block,assets});await stStore.setKV('st-library',all);await stCloudService?.queue('library',{id:'block-library',name:'Thư viện khối',blocks:all});stLibrary=all;stPanelOpen.library=true;stPanelOpen['lib-saved']=true;st$('[data-section="library"]').open=true;st$('[data-section="lib-saved"]').open=true;stPanel();stToast('Đã lưu mẫu trên trình duyệt này.');}catch{stToast('Chưa lưu được mẫu vào thư viện.');}
}
