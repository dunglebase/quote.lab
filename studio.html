// Việc cần xem trước khi gửi: ghi chú từ Quote Lab, trang tràn, chỗ giữ chỗ [..] còn trống, ảnh trống.
function stChecks(){
  const el=st$('#st-checks');if(!el||!stDoc)return;
  const items=[];
  st$$('.st-page.is-over').forEach(p=>items.push({t:`Trang ${stDoc.pages.findIndex(x=>x.id===p.dataset.pid)+1} tràn khổ A4.`,pid:p.dataset.pid,bad:true}));
  stDoc.pages.forEach((p,i)=>{for(const b of p.blocks){const tx=b.html.replace(/<[^>]+>/g,' ');const m=tx.match(/\[[^\]\n]{1,60}\]/g);if(m)items.push({t:`Trang ${i+1}: còn ${m.length} chỗ giữ chỗ ${stEsc(m[0])}${m.length>1?'…':''}`,bid:b.id});}});
  for(const n of stDoc.notes||[])items.push({t:stEsc(n)});
  el.innerHTML=`<h4>Kiểm tra trước khi gửi <span class="st-muted">${items.length}</span></h4>${items.length?`<ul class="st-checks">${items.map(x=>`<li class="${x.bad?'bad':''}"${x.pid?` data-goto-page="${x.pid}"`:''}${x.bid?` data-goto-block="${x.bid}"`:''}>${x.t}</li>`).join('')}</ul>`:'<p class="st-hint">Không có gì cần xem thêm.</p>'}`;
}

// ---------- Chọn ----------
function stSetSel(s,{panel=true}={}){
  stSel=s;
  st$$('.st-b.is-sel,.st-page.is-sel').forEach(e=>e.classList.remove('is-sel'));
  if(s?.bid)stBlockEl(s.bid)?.classList.add('is-sel');else if(s?.pid)stPageEl(s.pid)?.classList.add('is-sel');
  st$$('#st-pagelist li').forEach(li=>li.classList.toggle('is-cur',li.dataset.pid===s?.pid));
  if(panel)stPanel();
}
function stCurrentPage(){
  const c=st$('#st-canvas').getBoundingClientRect();let best=null,score=-1;
  for(const el of st$$('.st-page')){const r=el.getBoundingClientRect(),v=Math.min(r.bottom,c.bottom)-Math.max(r.top,c.top);if(v>score){score=v;best=el.dataset.pid;}}
  return best||stDoc.pages[0]?.id;
}
function stScrollTo(el){el?.scrollIntoView({behavior:'smooth',block:'start'});}

// ---------- Nội dung khối: đọc lại từ trang sau khi gõ ----------
function stFromDOM(bEl){
  const r=bEl&&stFind(bEl.dataset.bid);if(!r)return;
  const c=bEl.querySelector('.st-c').cloneNode(true);
  c.querySelectorAll('img[data-asset]').forEach(i=>i.removeAttribute('src'));
  c.querySelectorAll('.is-empty').forEach(x=>x.classList.remove('is-empty'));
  r.b.html=c.innerHTML;
}

// ---------- Thao tác khối & trang ----------
function stInsert(type,at){
  stFlush();if(!stDoc.pages.length)stDoc.pages.push(stNewPage('light'));
  const b=stNewBlock(type);let pid,index;
  if(at){pid=at.pid;index=at.index;}
  else if(stSel?.bid&&stFind(stSel.bid)){const r=stFind(stSel.bid);pid=r.p.id;index=r.i+1;}
  else{pid=stSel?.pid&&stPage(stSel.pid)?stSel.pid:stCurrentPage();index=stPage(pid).blocks.length;}
  stPage(pid).blocks.splice(index,0,b);stSel={pid,bid:b.id};stRenderPage(pid);stPanel();stCommit();
  const el=stBlockEl(b.id);el?.scrollIntoView({block:'nearest',behavior:'smooth'});
  if(type==='image'||type==='logo')stPickImage(b.id);else{const c=el?.querySelector('[contenteditable]'),first=c&&[...c.querySelectorAll('h1,h2,h3,p,li,td,th')].find(x=>x.textContent.trim()&&!x.querySelector('p,li,td'));if(c){c.focus();if(first)stSelectAllIn(first);}}
}
function stSelectAllIn(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);}
function stDup(bid){stFlush();const r=stFind(bid);if(!r)return;const c=JSON.parse(JSON.stringify(r.b));c.id=stId('b');r.p.blocks.splice(r.i+1,0,c);stSel={pid:r.p.id,bid:c.id};stRenderPage(r.p.id);stPanel();stCommit();}
function stDel(bid){stFlush();const r=stFind(bid);if(!r)return;r.p.blocks.splice(r.i,1);stSel={pid:r.p.id};stRenderPage(r.p.id);stPanel();stCommit();stToast('Đã xoá khối · ⌘Z / Ctrl+Z để hoàn tác');}
function stMove(bid,pid,index){
  stFlush();const r=stFind(bid);if(!r)return;const from=r.p,to=stPage(pid);
  from.blocks.splice(r.i,1);if(from===to&&r.i<index)index--;to.blocks.splice(Math.max(0,Math.min(index,to.blocks.length)),0,r.b);
  stSel={pid,bid};if(from!==to)stRenderPage(from.id);stRenderPage(pid);stPanel();stCommit();
}
function stSetProp(bid,prop,val){stFlush();const r=stFind(bid);if(!r)return;r.b[prop]=val;stRenderPage(r.p.id);stPanel();stCommit();}
function stAddPage(afterIndex,bg){stFlush();const ref=stDoc.pages[afterIndex];const p=stNewPage(bg||ref?.bg||'light',[stNewBlock('heading')]);stDoc.pages.splice(afterIndex+1,0,p);stSel={pid:p.id};stRender();stCommit();stScrollTo(stPageEl(p.id));}
function stDupPage(pid){stFlush();const p=stPage(pid),i=stDoc.pages.indexOf(p),c=JSON.parse(JSON.stringify(p));c.id=stId('p');c.blocks.forEach(b=>b.id=stId('b'));stDoc.pages.splice(i+1,0,c);stSel={pid:c.id};stRender();stCommit();stScrollTo(stPageEl(c.id));}
async function stDelPage(pid){
  const p=stPage(pid);if(!p)return;
  if(p.blocks.length&&!await stDialog('Xoá trang?',`Trang này có ${p.blocks.length} khối. Có thể hoàn tác bằng ⌘Z / Ctrl+Z.`,[{label:'Huỷ',value:false},{label:'Xoá trang',value:true,danger:true}]))return;
  stFlush();stDoc.pages.splice(stDoc.pages.indexOf(p),1);stSel=null;stRender();stCommit();
}
function stMovePage(pid,index){stFlush();const p=stPage(pid),i=stDoc.pages.indexOf(p);stDoc.pages.splice(i,1);if(i<index)index--;stDoc.pages.splice(index,0,p);stSel={pid};stRender();stCommit();}
function stApplyLayout(pid,id){stFlush();const p=stPage(pid),L=ST_LAYOUTS.find(x=>x.id===id);if(!p||!L)return;const spans=stLayoutSpans(L,p.blocks);p.blocks.forEach((b,i)=>b.w=spans[i]);p.layout=id;stRenderPage(pid);stPanel();stCommit();}

// ---------- Tràn trang ----------
function stScheduleMeasure(){clearTimeout(stMeasureT);stMeasureT=setTimeout(stMeasure,120);}
const stLimit=grid=>parseFloat(getComputedStyle(grid).minHeight)||0;
function stMeasure(){
  for(const el of st$$('.st-page')){
    const grid=el.querySelector('.st-grid'),over=grid.offsetHeight-stLimit(grid),o=over>2;
    el.classList.toggle('is-over',o);el.querySelector('.st-over').hidden=el.querySelector('.st-fix').hidden=!o;
    if(o)el.querySelector('.st-over').textContent=`Tràn ${Math.ceil(over/ST_PXMM)} mm`;
    const li=st$(`#st-pagelist li[data-pid="${el.dataset.pid}"] .st-pover`);if(li)li.hidden=!o;
  }
  stChecks();
}
// Chuyển các hàng khối nằm ngoài khổ A4 sang một trang mới ngay sau. Khối đầu trang quá cao: tách bảng theo dòng nếu có.
function stFixOverflow(pid){
  const p=stPage(pid),el=stPageEl(pid);if(!p||!el)return false;
  const grid=el.querySelector('.st-grid'),limit=stLimit(grid),kids=[...grid.querySelectorAll(':scope > .st-b')];
  const idx=kids.findIndex(k=>k.offsetTop+k.offsetHeight>limit+2);if(idx<0)return false;
  let cut=idx;while(cut>0&&kids[cut-1].offsetTop===kids[idx].offsetTop)cut--;
  if(cut>1&&p.blocks[cut-1].type==='heading'&&kids[cut-1].offsetTop<kids[cut].offsetTop)cut--;
  if(cut===0){
    const k=kids[idx],b=p.blocks[idx],tbl=k.querySelector('.st-c table');
    if(!tbl)return 'too-tall';
    const gTop=grid.getBoundingClientRect().top,rows=[...(tbl.tBodies[0]?.rows||[])];
    const s=rows.findIndex(row=>row.getBoundingClientRect().bottom-gTop>limit);
    if(s<1)return 'too-tall';
    const make=keepFirst=>{const c=k.querySelector('.st-c').cloneNode(true),t=c.querySelector('table'),body=t.tBodies[0];[...body.rows].forEach((row,i)=>{if(keepFirst?i>=s:i<s)row.remove();});
      if(keepFirst){let n=t.nextSibling;while(n){const nx=n.nextSibling;n.remove();n=nx;}}else{let n=t.previousSibling;while(n){const pv=n.previousSibling;n.remove();n=pv;}t.insertAdjacentHTML('beforebegin','<p class="s">(tiếp theo)</p>');}
      c.querySelectorAll('img[data-asset]').forEach(i=>i.removeAttribute('src'));return c.innerHTML;};
    const rest={...JSON.parse(JSON.stringify(b)),id:stId('b'),html:make(false),src:undefined};
    b.html=make(true);const moved=[rest,...p.blocks.splice(idx+1)];
    stDoc.pages.splice(stDoc.pages.indexOf(p)+1,0,stNewPage(p.bg,moved,{chrome:p.chrome}));
    return 'split';
  }
  const moved=p.blocks.splice(cut);
  stDoc.pages.splice(stDoc.pages.indexOf(p)+1,0,stNewPage(p.bg,moved,{chrome:p.chrome}));
  return 'moved';
}
async function stSettle(){try{await document.fonts?.ready;}catch{}await Promise.all(st$$('#st-pages img[src]').map(i=>i.decode?.().catch(()=>{})));await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));}
async function stAutoPaginate(){
  for(let guard=0;guard<80;guard++){
    let changed=false;
    for(const p of [...stDoc.pages]){const r=stFixOverflow(p.id);if(r==='moved'||r==='split'){changed=true;stRender();await stSettle();break;}}
    if(!changed)break;
  }
  stMeasure();
}
// Một lần bấm: chia liên tiếp cho tới khi trang cuối của chuỗi vừa khổ A4.
async function stFixClick(pid){
  stFlush();let cur=pid,made=0,last=null;
  for(let guard=0;guard<30&&cur;guard++){
    const r=stFixOverflow(cur);last=r;
    if(r!=='moved'&&r!=='split')break;
    made++;stRender();await stSettle();
    cur=stDoc.pages[stDoc.pages.findIndex(p=>p.id===cur)+1]?.id;
  }
  if(made){stCommit();stMeasure();stToast(`Đã chuyển phần tràn sang ${made} trang mới`);}
  if(last==='too-tall')stToast('Có khối dài hơn một trang. Rút gọn chữ, giảm độ rộng các khối cạnh nó, hoặc nhân bản rồi chia nội dung.');
}

// ---------- Ảnh ----------
function stPickImage(bid){stImgTarget=bid;const f=st$('#st-file-img');f.value='';f.click();}
async function stLoadImage(file){
  if(!file||!stImgTarget)return;
  if(file.size>12e6){stToast('Ảnh lớn hơn 12 MB. Hãy chọn ảnh nhỏ hơn.');return;}
  const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});
  let out=url;
  if(!/svg/.test(file.type)){
    const img=new Image();img.src=url;await img.decode();const k=Math.min(1,1800/Math.max(img.width,img.height));
    if(k<1||file.size>600e3){const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);out=cv.toDataURL(/png|webp/.test(file.type)?'image/png':'image/jpeg',.9);}
  }
  const r=stFind(stImgTarget),el=stBlockEl(stImgTarget);if(!r||!el)return;
  stFlush();const id=stId('a');stDoc.assets[id]=out;
  let box=el.querySelector('.st-c .img');
  if(!box){el.querySelector('.st-c').insertAdjacentHTML('afterbegin','<div class="img" contenteditable="false"><img alt=""></div>');box=el.querySelector('.st-c .img');}
  const img=box.querySelector('img')||box.appendChild(document.createElement('img'));img.dataset.asset=id;
  stFromDOM(el);stHydrate(el);stCommit();stScheduleMeasure();
}

// ---------- Bảng ----------
function stTableOp(op){
  const bEl=stSel?.bid&&stBlockEl(stSel.bid);if(!bEl)return;
  const cell=stCell&&bEl.contains(stCell)?stCell:null,tbl=cell?.closest('table')||bEl.querySelector('table');
  if(!tbl){stToast('Khối này chưa có bảng.');return;}
  const body=tbl.tBodies[0],row=cell?.closest('tr')||body?.rows[body.rows.length-1],ci=cell?cell.cellIndex:(row?.cells.length||1)-1;
  stFlush();
  if(op==='row-add'){const base=row.parentElement.tagName==='THEAD'?body.rows[0]:row,nr=base.cloneNode(true);[...nr.cells].forEach(c=>c.innerHTML='<br>');if(row.parentElement.tagName==='THEAD')body.prepend(nr);else row.after(nr);}
  else if(op==='row-del'){if(row.parentElement.tagName!=='TBODY'||body.rows.length<2){stToast('Bảng cần ít nhất một dòng.');return;}row.remove();}
  else if(op==='col-add'){for(const r of tbl.rows){const ref=r.cells[Math.min(ci,r.cells.length-1)];if(!ref)continue;const c=document.createElement(ref.tagName);c.innerHTML='<br>';ref.after(c);}}
  else if(op==='col-del'){if((tbl.rows[0]?.cells.length||0)<2){stToast('Bảng cần ít nhất một cột.');return;}for(const r of tbl.rows){if(r.cells.length<2)continue;r.cells[Math.min(ci,r.cells.length-1)].remove();}}
  stCell=null;stFromDOM(bEl);stCommit();stScheduleMeasure();
}

// ---------- Kéo thả: khối, khối mới từ thư viện, trang trong danh sách ----------
function stDropTarget(x,y){
  const el=document.elementFromPoint(x,y);if(!el)return null;
  const li=el.closest('#st-pagelist li');
  if(li){
    if(stDrag.src.kind==='page'){const r=li.getBoundingClientRect(),after=y>r.top+r.height/2,ids=stDoc.pages.map(p=>p.id);return {kind:'page',index:ids.indexOf(li.dataset.pid)+(after?1:0),line:{x:r.left,y:after?r.bottom:r.top,w:r.width}};}
    const r=li.getBoundingClientRect();return {pid:li.dataset.pid,index:stPage(li.dataset.pid).blocks.length,box:r};
  }
  if(stDrag.src.kind==='page')return null;
  const b=el.closest('.st-b');
  if(b&&b.dataset.bid!==stDrag.src.bid&&!b.closest('.st-dragging')){
    const f=stFind(b.dataset.bid),r=b.getBoundingClientRect(),full=f.b.w>=12;
    const after=full?y>r.top+r.height/2:x>r.left+r.width/2;
    return {pid:f.p.id,index:f.i+(after?1:0),line:full?{x:r.left,y:after?r.bottom+2:r.top-2,w:r.width}:{x:after?r.right+2:r.left-2,y:r.top,h:r.height}};
  }
  const pg=el.closest('.st-page');
  if(pg){
    const p=stPage(pg.dataset.pid),kids=[...pg.querySelectorAll('.st-grid > .st-b')].filter(k=>k.dataset.bid!==stDrag.src.bid);
    let index=p.blocks.length,ref=null;
    for(const k of kids){const r=k.getBoundingClientRect();if(y<r.top+r.height/2){index=p.blocks.findIndex(b=>b.id===k.dataset.bid);ref=r;break;}}
    const g=pg.querySelector('.st-grid').getBoundingClientRect();
    if(ref)return {pid:p.id,index,line:{x:g.left,y:ref.top-3,w:g.width}};
    const last=kids[kids.length-1]?.getBoundingClientRect();
    return {pid:p.id,index,line:{x:g.left,y:last?last.bottom+3:g.top+4,w:g.width}};
  }
  return null;
}
function stShowDrop(t){
  const ind=st$('#st-drop');
  if(!t){ind.hidden=true;st$$('#st-pagelist li.drop').forEach(l=>l.classList.remove('drop'));return;}
  st$$('#st-pagelist li.drop').forEach(l=>l.classList.remove('drop'));
  if(t.box&&!t.line){ind.hidden=true;st$(`#st-pagelist li[data-pid="${t.pid}"]`)?.classList.add('drop');return;}
  ind.hidden=false;const L=t.line;
  Object.assign(ind.style,L.h?{left:L.x-1.5+'px',top:L.y+'px',width:'3px',height:L.h+'px'}:{left:L.x+'px',top:L.y-1.5+'px',width:L.w+'px',height:'3px'});
}
function stStartDrag(e,src,label){
  e.preventDefault();stFlush();
  stDrag={src,x0:e.clientX,y0:e.clientY,moved:false,target:null,label};
  window.addEventListener('pointermove',stDragMove);window.addEventListener('pointerup',stDragEnd,{once:true});window.addEventListener('pointercancel',stDragEnd,{once:true});
}
function stDragMove(e){
  const d=stDrag;if(!d)return;
  if(!d.moved){if(Math.hypot(e.clientX-d.x0,e.clientY-d.y0)<5)return;d.moved=true;document.body.classList.add('st-dragging-on');
    const g=st$('#st-ghost');g.textContent=d.label;g.hidden=false;
    if(d.src.kind==='block')stBlockEl(d.src.bid)?.classList.add('st-dragging');
    if(d.src.kind==='page')st$(`#st-pagelist li[data-pid="${d.src.pid}"]`)?.classList.add('st-dragging');}
  const g=st$('#st-ghost');g.style.left=e.clientX+14+'px';g.style.top=e.clientY+10+'px';
  d.target=stDropTarget(e.clientX,e.clientY);stShowDrop(d.target);
  const c=st$('#st-canvas'),r=c.getBoundingClientRect();
  clearInterval(d.scroll);if(e.clientY<r.top+60)d.scroll=setInterval(()=>c.scrollBy(0,-18),16);else if(e.clientY>r.bottom-60)d.scroll=setInterval(()=>c.scrollBy(0,18),16);
}
function stDragEnd(){
  const d=stDrag;stDrag=null;window.removeEventListener('pointermove',stDragMove);if(!d)return;
  clearInterval(d.scroll);document.body.classList.remove('st-dragging-on');st$('#st-ghost').hidden=true;stShowDrop(null);st$$('.st-dragging').forEach(x=>x.classList.remove('st-dragging'));
  if(!d.moved){if(d.src.kind==='new')stInsert(d.src.type);return;}
  const t=d.target;if(!t)return;
  if(d.src.kind==='page'&&t.kind==='page')stMovePage(d.src.pid,t.index);
  else if(d.src.kind==='block'&&t.pid)stMove(d.src.bid,t.pid,t.index);
  else if(d.src.kind==='new'&&t.pid)stInsert(d.src.type,{pid:t.pid,index:t.index});
}

// ---------- Đổi kích thước ----------
function stStartResize(e,axis,bEl){
  e.preventDefault();e.stopPropagation();stFlush();
  const r=stFind(bEl.dataset.bid);if(!r)return;stSetSel({pid:r.p.id,bid:r.b.id});
  const grid=bEl.parentElement,gr=grid.getBoundingClientRect(),gap=parseFloat(getComputedStyle(grid).columnGap)||0,col=(gr.width-11*gap)/12,r0=bEl.getBoundingClientRect();
  const tip=st$('#st-tip');tip.hidden=false;document.body.classList.add('st-resizing-'+axis);
  const name=w=>(ST_WIDTHS.find(x=>x[0]===w)?.[1]||'')+` · ${w}/12`;
  let val=axis==='w'?r.b.w:r.b.h;
  const move=ev=>{
    if(axis==='w'){val=Math.max(2,Math.min(12,Math.round((ev.clientX-r0.left+gap)/(col+gap))));bEl.style.setProperty('--w',val);tip.textContent='Độ rộng '+name(val);}
    else{val=Math.max(8,Math.round((ev.clientY-r0.top)/ST_PXMM/2)*2);bEl.style.setProperty('--h',val+'mm');tip.textContent=`Chiều cao ${val} mm`;}
    tip.style.left=ev.clientX+14+'px';tip.style.top=ev.clientY+12+'px';
  };
  const up=()=>{window.removeEventListener('pointermove',move);tip.hidden=true;document.body.classList.remove('st-resizing-'+axis);if(val!==(axis==='w'?r.b.w:r.b.h))stSetProp(r.b.id,axis,val);};
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',up,{once:true});move(e);
}

// ---------- Tài liệu ----------
function stBlankDoc(){
  return {id:stId('d'),version:1,created:Date.now(),updated:Date.now(),title:'Báo giá mới',header:{left:'BASE.VN · ĐỀ XUẤT GIẢI PHÁP VÀ BÁO GIÁ',right:''},footer:{left:'Base 2.0 · Đề xuất giải pháp và báo giá'},assets:{'base-logo':QD_BASE_LOGO},notes:[],
    pages:[stNewPage('dark',[stNewBlock('cover'),stNewBlock('spacer',{h:30}),{...stNewBlock('logo'),html:'<div class="img logo" contenteditable="false"><img alt="" data-asset="base-logo"></div>'}])]};
}
async function stOpenDoc(d){
  stFlush();if(stDoc&&stDoc.id!==d.id)await stSaveNow();
  d.assets??={};d.notes??=[];d.header??={left:'',right:''};d.footer??={left:''};
  stDoc=d;stSel=null;stRender();stHistReset();await stSaveNow();
}
async function stNewFromPayload(p){
  let d;try{d=stBuildDoc(p,{baseLogo:QD_BASE_LOGO});}catch(e){stToast(e.message);return;}
  stFlush();if(stDoc)await stSaveNow();
  stDoc=d;stSel=null;stRender();await stSettle();await stAutoPaginate();stHistReset();await stSaveNow();
  stToast(`Đã dựng báo giá ${stDoc.pages.length} trang từ Quote Lab`);
}
async function stOnPayload(p){
  if(!p||p.kind!=='quote-studio-data'||!p.deal||!Array.isArray(p.options))return;
  const key=String(p.sentAt||'');if(key&&stHandled.has(key))return;stHandled.add(key);
  if(stDoc&&stDoc.dealKey===stDealKey(p)){
    const v=await stDialog('Quote Lab gửi số liệu mới',`Bản đang mở là báo giá của cùng khách hàng (<b>${stEsc(stDoc.title)}</b>).`,[{label:'Bỏ qua',value:null},{label:'Tạo bản mới',value:'new'},{label:'Cập nhật số liệu trong bản này',value:'refresh',primary:true}]);
    if(v==='refresh'){stFlush();const n=stRefreshDoc(stDoc,p);stRender();stCommit();stToast(n?`Đã cập nhật ${n} khối số liệu; chữ ở khối khác giữ nguyên`:'Số liệu không đổi');}
    else if(v==='new')stNewFromPayload(p);
    return;
  }
  stNewFromPayload(p);
}
function stDownload(text,type,name){const url=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
const stSlug=s=>String(s||'bao-gia').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'bao-gia';
function stSaveFile(){stFlush();stDownload(JSON.stringify({kind:'quote-studio-doc',...stDoc}),'application/json',stSlug(stDoc.title)+'.quote.json');}
async function stOpenFile(file){
  try{
    const d=JSON.parse(await file.text());
    if(d.kind==='quote-studio-data'){stOnPayload({...d,sentAt:Date.now()});return;}
    if(!Array.isArray(d.pages))throw new Error('File không phải dự án Quote Studio.');
    d.pages.forEach(p=>{p.id||=stId('p');p.bg=p.bg==='dark'?'dark':'light';p.blocks=(p.blocks||[]).map(b=>({...b,id:b.id||stId('b'),w:Math.max(1,Math.min(12,+b.w||12)),h:Math.max(0,+b.h||0),type:ST_TYPES[b.type]?b.type:'text',style:ST_STYLES.some(s=>s[0]===b.style)?b.style:'plain',html:stSanitize(b.html)}));});
    for(const [k,v] of Object.entries(d.assets||{}))if(!/^data:image\//.test(v))delete d.assets[k];
    delete d.kind;d.id||=stId('d');
    await stOpenDoc(d);stToast('Đã mở '+(d.title||file.name));
  }catch(e){stToast('Không mở được file: '+e.message);}
}
function stExportHTML(){
  stFlush();
  const css=st$('#st-css').textContent.split('/* == EDITOR == */')[0];
  const pages=st$$('.st-page').map(el=>{const c=el.cloneNode(true);c.querySelectorAll('.st-ptools,.st-handle,.st-rw,.st-rh,.st-mini,.st-a4line,.st-emptyhint,.img.is-empty').forEach(x=>x.remove());c.querySelectorAll('[contenteditable]').forEach(x=>x.removeAttribute('contenteditable'));c.querySelectorAll('[spellcheck]').forEach(x=>x.removeAttribute('spellcheck'));c.classList.remove('is-sel','is-over');c.querySelectorAll('.is-sel').forEach(x=>x.classList.remove('is-sel'));return c.outerHTML;}).join('\n');
  const fonts=st$('#st-fonts')?.outerHTML||'';
  stDownload(`<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${stEsc(stDoc.title)}</title>${fonts}<style>${css}</style></head><body class="st-export">${pages}</body></html>`,'text/html',stSlug(stDoc.title)+'.html');
}
async function stPrint(){
  stFlush();stMeasure();
  const over=st$$('.st-page.is-over').length;
  if(over&&!await stDialog('Có trang tràn khổ A4',`${over} trang có nội dung vượt khổ A4; phần vượt sẽ bị cắt khi in. Bấm “Chuyển phần tràn sang trang mới” ở trang đó trước khi xuất.`,[{label:'Quay lại sửa',value:false,primary:true},{label:'Vẫn xuất PDF',value:true}]))return;
  stSetSel(null);const old=document.title;document.title=stDoc.title||'Bao gia';
  setTimeout(()=>{window.print();document.title=old;},50);
}
async function stDocsDialog(){
  let list=[];try{list=(await stStore.all())||[];}catch{}
  list.sort((a,b)=>b.updated-a.updated);
  const v=await stDialog('Tài liệu đã lưu trên trình duyệt này',list.length?`<div class="st-doclist">${list.map(d=>`<div class="st-docrow${d.id===stDoc?.id?' cur':''}"><button type="button" data-i="open:${d.id}" class="st-docopen"><b>${stEsc(d.title||'Không tên')}</b><span>${d.pages?.length||0} trang · ${new Date(d.updated).toLocaleString('vi-VN')}</span></button><button type="button" data-i="del:${d.id}" class="danger" title="Xoá">✕</button></div>`).join('')}</div>`:'<p>Chưa có tài liệu nào.</p>',[{label:'Đóng',value:null}]);
  return v;
}

// ---------- Gắn sự kiện ----------
function stWire(){
  const pages=st$('#st-pages');
  pages.addEventListener('input',e=>{const b=e.target.closest('.st-b');if(!b)return;stFromDOM(b);stTypingCommit();stScheduleMeasure();if(/H[123]/.test(e.target.closest('h1,h2,h3')?.tagName||''))stPageList();});
  pages.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    const h=e.target.closest('.st-handle');if(h){const b=h.closest('.st-b'),f=stFind(b.dataset.bid);stSetSel({pid:f.p.id,bid:f.b.id});stStartDrag(e,{kind:'block',bid:b.dataset.bid},'Di chuyển: '+(ST_TYPES[f.b.type]?.name||'khối'));return;}
    const rw=e.target.closest('.st-rw');if(rw){stStartResize(e,'w',rw.closest('.st-b'));return;}
    const rh=e.target.closest('.st-rh');if(rh){stStartResize(e,'h',rh.closest('.st-b'));return;}
  });
  pages.addEventListener('click',e=>{
    const a=e.target.closest('[data-act]');
    if(a){const b=a.closest('.st-b'),pg=a.closest('.st-page');
      if(a.dataset.act==='dup')stDup(b.dataset.bid);else if(a.dataset.act==='del')stDel(b.dataset.bid);
      else if(a.dataset.act==='fix')stFixClick(pg.dataset.pid);else if(a.dataset.act==='page-add-end')stAddPage(stDoc.pages.length-1);
      else if(a.dataset.act==='doc-new')stOpenDoc(stBlankDoc());else if(a.dataset.act==='doc-open-file')st$('#st-file-json').click();
      return;}
    const rec=e.target.closest('[data-open]');if(rec){stStore.get(rec.dataset.open).then(d=>d&&stOpenDoc(d));return;}
    if(!stDoc)return;
    const b=e.target.closest('.st-b');if(b){const f=stFind(b.dataset.bid);if(f&&stSel?.bid!==f.b.id)stSetSel({pid:f.p.id,bid:f.b.id});return;}
    const pg=e.target.closest('.st-page');if(pg){stSetSel({pid:pg.dataset.pid});return;}
    stSetSel(null);
  });
  pages.addEventListener('dblclick',e=>{
    const rh=e.target.closest('.st-rh');if(rh){stSetProp(rh.closest('.st-b').dataset.bid,'h',0);return;}
    const im=e.target.closest('.img');if(im){const b=im.closest('.st-b');stPickImage(b.dataset.bid);}
  });
  pages.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey&&e.target.closest('[contenteditable]')){const t=getSelection().anchorNode,el=t&&(t.nodeType===1?t:t.parentElement);if(el?.closest('td,th,.k,.v,.s,h1,h2,h3,.eyebrow')){e.preventDefault();document.execCommand('insertLineBreak');}}
  });
  pages.addEventListener('paste',e=>{
    if(!e.target.closest('[contenteditable]'))return;e.preventDefault();
    (e.clipboardData?.getData('text/plain')??'').replace(/\r/g,'').split('\n').forEach((line,i)=>{if(i)document.execCommand('insertLineBreak');if(line)document.execCommand('insertText',false,line);});
  });
  pages.addEventListener('drop',e=>e.preventDefault());
  document.addEventListener('selectionchange',()=>{const n=getSelection().anchorNode,el=n&&(n.nodeType===1?n:n.parentElement);const c=el?.closest?.('td,th');if(c&&c.closest('#st-pages'))stCell=c;});

  const panel=st$('#st-panel');
  panel.addEventListener('pointerdown',e=>{
    const lib=e.target.closest('.st-libi');if(lib&&e.button===0){stStartDrag(e,{kind:'new',type:lib.dataset.type},'Thêm: '+ST_TYPES[lib.dataset.type].name);return;}
    if(e.target.closest('[data-cmd]'))e.preventDefault();
  });
  panel.addEventListener('mousedown',e=>{if(e.target.closest('[data-cmd]'))e.preventDefault();});
  panel.addEventListener('click',async e=>{
    const t=e.target.closest('button,[data-goto-page],[data-goto-block],input');if(!t||t.classList.contains('st-libi'))return;
    const bid=stSel?.bid,pid=stSel?.pid;
    if(t.dataset.gotoPage){stSetSel({pid:t.dataset.gotoPage});stScrollTo(stPageEl(t.dataset.gotoPage));return;}
    if(t.dataset.gotoBlock){const f=stFind(t.dataset.gotoBlock);if(f){stSetSel({pid:f.p.id,bid:f.b.id});stBlockEl(f.b.id)?.scrollIntoView({behavior:'smooth',block:'center'});}return;}
    if(t.dataset.w)return stSetProp(bid,'w',+t.dataset.w);
    if(t.dataset.style)return stSetProp(bid,'style',t.dataset.style);
    if(t.dataset.bg){stFlush();stPage(pid).bg=t.dataset.bg;stRenderPage(pid);stPanel();stCommit();return;}
    if(t.dataset.layout)return stApplyLayout(pid,t.dataset.layout);
    if(t.dataset.cmd){const c=t.dataset.cmd;if(c==='hl')document.execCommand('foreColor',false,'#5B8CFF');else document.execCommand(c,false,null);const b=bid&&stBlockEl(bid);if(b){stFromDOM(b);stCommit();}return;}
    const act=t.dataset.act;if(!act)return;
    if(act==='chrome'){stFlush();stPage(pid).chrome=t.checked;stRender();stCommit();return;}
    if(act==='dup')return stDup(bid);if(act==='del')return stDel(bid);
    if(act==='h-auto')return stSetProp(bid,'h',0);
    if(/^(row|col)-/.test(act))return stTableOp(act);
    if(act==='img-pick')return stPickImage(bid);
    if(act==='img-fit'){const b=stBlockEl(bid),box=b?.querySelector('.img');if(box){box.classList.toggle('cover');stFromDOM(b);stCommit();}return;}
    if(act==='img-clear'){const b=stBlockEl(bid),img=b?.querySelector('.img img');if(img){img.removeAttribute('data-asset');img.removeAttribute('src');stFromDOM(b);stHydrate(b);stCommit();}return;}
    if(act==='page-add')return stAddPage(stDoc.pages.indexOf(stPage(pid)));
    if(act==='page-dup')return stDupPage(pid);
    if(act==='page-del')return stDelPage(pid);
  });
  panel.addEventListener('input',e=>{const k=e.target.dataset.doc;if(!k)return;const [a,b]=k.split('.');stDoc[a][b]=e.target.value;st$$(a==='header'?'.st-ph span:'+(b==='left'?'first-child':'last-child'):'.st-pf span:first-child').forEach(s=>s.textContent=e.target.value);stTypingCommit();});

  const list=st$('#st-pagelist');
  list.addEventListener('pointerdown',e=>{const li=e.target.closest('li');if(!li||e.button!==0)return;stStartDrag(e,{kind:'page',pid:li.dataset.pid},'Trang '+(stDoc.pages.findIndex(p=>p.id===li.dataset.pid)+1));});
  list.addEventListener('click',e=>{const li=e.target.closest('li');if(!li)return;stSetSel({pid:li.dataset.pid});stScrollTo(stPageEl(li.dataset.pid));});

  st$('#st-title').addEventListener('input',e=>{if(!stDoc)return;stDoc.title=e.target.value;stTypingCommit();});
  st$('#st-undo').addEventListener('click',stUndo);st$('#st-redo').addEventListener('click',stRedo);
  st$('#st-add-page').addEventListener('click',()=>{if(!stDoc)stOpenDoc(stBlankDoc());else stAddPage(stSel?.pid?stDoc.pages.indexOf(stPage(stSel.pid)):stDoc.pages.length-1);});
  st$('#st-preview').addEventListener('click',()=>{const on=document.body.classList.toggle('st-preview');st$('#st-preview').textContent=on?'Thoát xem trước':'Xem trước';if(on)stSetSel(null);});
  st$('#st-pdf').addEventListener('click',()=>stDoc&&stPrint());
  st$('#st-menu').addEventListener('click',async e=>{
    const b=e.target.closest('button[data-file]');if(!b)return;e.target.closest('details').open=false;
    const k=b.dataset.file;
    if(k==='new')stOpenDoc(stBlankDoc());
    else if(k==='open')st$('#st-file-json').click();
    else if(k==='save'&&stDoc)stSaveFile();
    else if(k==='html'&&stDoc)stExportHTML();
    else if(k==='docs'){const v=await stDocsDialog();if(!v)return;const [op,id]=v.split(':');
      if(op==='open'){const d=await stStore.get(id);if(d)stOpenDoc(d);}
      else if(op==='del'&&await stDialog('Xoá tài liệu?','Tài liệu sẽ bị xoá khỏi trình duyệt này. Thao tác không hoàn tác được.',[{label:'Huỷ',value:false},{label:'Xoá',value:true,danger:true}])){await stStore.del(id);if(stDoc?.id===id){stDoc=null;stRender();}stToast('Đã xoá tài liệu');}}
  });
  st$('#st-file-img').addEventListener('change',e=>stLoadImage(e.target.files[0]));
  st$('#st-file-json').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)stOpenFile(f);});
  document.addEventListener('keydown',e=>{
    const mod=e.metaKey||e.ctrlKey;
    if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?stRedo():stUndo();return;}
    if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();stRedo();return;}
    if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();stSaveNow();return;}
    if(e.key==='Escape'){if(!st$('#st-dialog').hidden){st$('#st-dialog').click();return;}document.activeElement?.blur?.();stSetSel(stSel?.bid?{pid:stSel.pid}:null);return;}
    if((e.key==='Delete'||e.key==='Backspace')&&stSel?.bid&&!e.target.closest?.('[contenteditable],input,textarea'))
      {e.preventDefault();stDel(stSel.bid);}
  });
  window.addEventListener('beforeprint',()=>{stFlush();stSetSel(null,{panel:false});});
  window.addEventListener('message',e=>{if(e.source&&e.source===window.opener)stOnPayload(e.data);});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){stFlush();stSaveNow();}});
}

async function stStart(){
  stWire();
  let d=null;try{const id=await stStore.getKV('current');if(id)d=await stStore.get(id);}catch{}
  if(d)await stOpenDoc(d);else stRender();
  try{const raw=localStorage.getItem('quote-studio-inbox');if(raw){localStorage.removeItem('quote-studio-inbox');const p=JSON.parse(raw);if(Date.now()-(p.sentAt||0)<15*60e3)await stOnPayload(p);}}catch{}
  if(window.opener)try{window.opener.postMessage({kind:'quote-studio-ready'},'*');}catch{}
}
if(document.getElementById('st-app'))stStart();
</script>
