function stKCtx(data,o={}){
  const opts=(data?.options||[]).filter(x=>x&&x.r);
  return {data:data||null,d:data?.deal||{},opts,rec:opts.find(x=>x.id===data?.recommendedId)||opts[0]||null,scopes:{...QO_SCOPE_NAMES,...(data?.scopeNames||{})},policy:data?.policy||{},showVars:!!o.showVars,assetMap:o.assetMap||{},rows:o.rows||{}};
}
function stKOption(ctx,src){if(!src||src==='rec')return ctx.rec;const m=/^opt([1-3])$/.exec(src);return m?ctx.opts[+m[1]-1]||null:ctx.rec;}
const stKLineName=(l,names)=>(l.addon?'Add-on ':l.scope==='combo'?'':(names[l.scope]||l.scope)+' · ')+l.name+(l.lite?' Lite':'');
function stKOptValue(o,f,ctx){
  const r=o?.r;if(!r)return '';const money=v=>Number.isFinite(v)&&v>0?stKMoney(v):'';
  if(f==='label')return o.label||'';
  if(f==='packages')return (r.lines||[]).filter(l=>l.scope!=='usage').map(l=>stKLineName(l,ctx.scopes)).join(', ');
  if(f==='years')return r.years?String(r.years):'';
  if(f==='total')return money(r.total);if(f==='totalShort')return r.total>0?stKShort(r.total):'';if(f==='totalWords')return r.total>0?stWords(r.total):'';
  if(f==='software')return money(r.software);if(f==='monthly')return money(r.monthly);if(f==='ps')return money(r.ps?.gross);if(f==='serviceFee')return money(r.serviceFee);
  if(f==='people'){const n=(r.staff||[]).reduce((s,g)=>s+(g.count>0?g.count:0),0);return n?stKNf(n)+' người':'';}
  return '';
}
function stKValue(ctx,key){
  const [head,f]=String(key).split('.'),d=ctx.d||{};
  if(head==='customer')return String(d.customer?.[f]||'');
  if(head==='recipient')return String((d.recipients||[])[0]?.[f]||'');
  if(head==='quote')return String({no:d.quote?.no,date:d.quote?.dateText,valid:d.quote?.validText,reason:d.quote?.reason}[f]||'');
  if(head==='preparer')return String(d.preparer?.[f]||'');
  if(head==='rec'||/^opt[1-3]$/.test(head))return stKOptValue(stKOption(ctx,head),f,ctx);
  if(key==='options.count')return ctx.opts.length?String(ctx.opts.length):'';
  if(key==='policy.effective')return String(ctx.policy?.effective||'');
  return '';
}

// Quy tắc dựng khối: lỗi chặn lưu phiên bản; cảnh báo / gợi ý giúp người dựng cân nhắc.
function stKLint(spec){
  const s=stKNormalize(spec),out=[],add=(level,msg,el)=>out.push({level,msg,...(el?{el:el.id}:{})}),name=e=>ST_K_ELEMENTS[e.kind].name,mm=Math.round(s.size.w/12*182);

    const L=stKLayout(s.layout.kind);
    if(!s.els.length)add('error','Khối chưa có thành phần. Thêm ít nhất một thành phần ở bước 3.');
    else L.slots.forEach((n,i)=>{if(!s.els.some(e=>e.slot===i))add('warning',`Vùng “${n}” đang trống. Thêm thành phần hoặc chọn bố cục ít vùng hơn.`);});
    if(L.cols>1&&mm/L.cols<38)add('warning',`Mỗi cột chỉ còn khoảng ${Math.round(mm/L.cols)} mm. Tăng độ rộng khối hoặc giảm số cột.`);
    const heads=s.els.filter(e=>e.kind==='heading');if(heads.length>1)add('suggestion','Có hơn một tiêu đề. Mỗi khối nên có một câu kết luận chính; ý phụ dùng nhãn mục hoặc chữ đậm.',heads[1]);
    if(s.els.length>12)add('warning','Khối có hơn 12 thành phần, dễ dài quá một trang. Cân nhắc tách thành hai khối.');

function stKNewKit(){return {schema:1,groups:[],defs:[],migrated:[],updated:Date.now()};}

  for(const g of groups){const seen=new Set([g.id]);let p=g.parent;while(p){if(seen.has(p)){g.parent=null;break;}seen.add(p);p=groups.find(x=>x.id===p)?.parent;}}

    defs.push({id:stKStr(d.id,80),name:stKStr(d.name||'Khối',80),desc:stKStr(d.desc,200),group:ids.has(d.group)?d.group:null,order:+d.order||0,created:+d.created||Date.now(),updated:+d.updated||Date.now(),show:d.show!==false,...(d.seed?{seed:true}:{}),...(d.archivedAt?{archivedAt:+d.archivedAt}:{}),draft:d.draft?stKNormalize(d.draft):null,versions});}

const stKSort=(a,b)=>(a.order-b.order)||a.name.localeCompare(b.name,'vi');

// Xoá nhóm không xoá khối: nhóm con và khối bên trong chuyển lên nhóm cha.

}

async function stKitRead(repo){
  const legacy=await repo.getKV(ST_K_LEGACY)||[];let kit=await repo.getKV(ST_K_KEY);
  if(kit){kit=stKNormalizeKit(kit);if(!stKMigrate(stKNormalizeKit(kit),legacy))return kit;}

function stKUSanitize(html){

  t.content.querySelectorAll('script,style,iframe,object,embed,link,meta,form,input,button,textarea,select').forEach(n=>n.remove());
  t.content.querySelectorAll('*').forEach(n=>{for(const a of [...n.attributes]){const v=a.value.trim().toLowerCase();if(a.name.startsWith('on')||((a.name==='href'||a.name==='src'||a.name==='xlink:href')&&(v.startsWith('javascript:')||(v.startsWith('data:')&&!v.startsWith('data:image/')))))n.removeAttribute(a.name);}});

    }
    if(S.step==='size'){const mm=Math.round(s.size.w/12*182);return `<p class="st-lbl">Độ rộng mặc định trên lưới 12 cột</p><div class="st-widths">${ST_WIDTHS.map(([w,l])=>`<button type="button" data-w="${w}" class="${s.size.w===w?'on':''}" title="${w}/12 cột"><i style="--f:${w/12}"></i><span>${l}</span></button>`).join('')}</div><p class="kx-mini">≈ ${mm} mm trên A4. Trong báo giá vẫn kéo cạnh khối để đổi.</p><label class="st-field"><span>Chiều cao tối thiểu · mm (0 = tự động theo nội dung)</span><input type="number" id="kx-h" min="0" max="250" step="2" value="${s.size.h}"></label><p class="st-lbl">Màu nhấn</p><div class="kx-accents">${ST_K_ACCENTS.map(([v,l,c])=>`<button type="button" data-accent="${v}" class="${s.look.accent===v?'on':''}" style="--c:${c}" aria-pressed="${s.look.accent===v}"><i></i><span>${E(l)}</span></button>`).join('')}</div><p class="kx-mini">Màu nhấn đổi nhãn, chấm danh sách, vạch và viền nhấn. Mỗi màu có cặp sáng / tối để đọc rõ trên cả hai nền trang.</p><p class="st-lbl">Cỡ chữ của khối</p><div class="kx-seg">${ST_K_SCALES.map(([v,l])=>`<button type="button" data-scale="${v}" class="${s.look.scale===v?'on':''}" aria-pressed="${s.look.scale===v}">${E(l)}</button>`).join('')}</div>`;}

<label class="st-field"><span>Mô tả ngắn · hiện khi rê chuột trong trình soạn</span><input id="kx-desc" maxlength="200" value="${E(d.desc||'')}" placeholder="Khối dùng để…"></label><label class="st-check"><input type="checkbox" id="kx-show"${d.show!==false?' checked':''}> Hiện trong “Thư viện của bạn” khi soạn báo giá</label>

<h4 class="kx-h4">Lịch sử phiên bản</h4>${d.versions.length?`<ol class="kx-versions">${[...d.versions].reverse().map(x=>`<li><b>v${x.v}</b><span>${stKUTime(x.at)}${x.note?' · '+E(x.note):''}${u?.versions[x.v]?` · đang dùng trong ${u.versions[x.v]} báo giá`:''}</span></li>`).join('')}</ol>`:'<p class="kx-mini">Chưa có phiên bản. Khối chỉ hiện trong trình soạn sau lần lưu đầu tiên.</p>'}<p class="kx-mini">Mỗi lần lưu tạo phiên bản mới, không ghi đè bản cũ. Báo giá đã chèn khối giữ nguyên phiên bản đó cho tới khi người soạn bấm “Cập nhật khối”.</p>`;

  function paintStep(){

  function paintRight(){
    const el=root.querySelector('#kx-right');if(!el)return;const s=S.work;
    if(s.raw){el.innerHTML=`<div class="kx-sec"><h4>Khối nội dung tự do</h4><p class="kx-mini">Nội dung soạn sẵn, lưu từ báo giá hoặc từ mẫu hệ thống (kiểu gốc: ${E(ST_TYPES[s.baseType]?.name||s.baseType)}). Sửa nội dung ở bước 3; khung, kích thước và màu ở bước 1 và 4.</p><p class="kx-mini">Muốn khối có vùng, thành phần và dữ liệu tự động: tạo khối mới ở thư viện.</p></div>`;return;}
    const L=stKLayout(s.layout.kind),cur=s.els.find(e=>e.id===S.sel);
    const outline=L.slots.map((n,i)=>{const els=s.els.filter(e=>e.slot===i);return `<div class="kx-slot"><p class="kx-slot-h">${E(n)}</p>${els.map(e=>`<div class="kx-el${S.sel===e.id?' on':''}"><button type="button" class="kx-el-name" data-sel="${E(e.id)}">${stKUIcon(e.kind)}<span>${E(ST_K_ELEMENTS[e.kind].name)}<small>${E(summary(e))}</small></span></button><span class="kx-el-act"><button type="button" data-el="up" data-id="${E(e.id)}" title="Chuyển lên" aria-label="Chuyển lên">↑</button><button type="button" data-el="down" data-id="${E(e.id)}" title="Chuyển xuống" aria-label="Chuyển xuống">↓</button><button type="button" data-el="dup" data-id="${E(e.id)}" title="Nhân bản" aria-label="Nhân bản">⧉</button><button type="button" class="danger" data-el="del" data-id="${E(e.id)}" title="Xoá" aria-label="Xoá thành phần">✕</button></span></div>`).join('')||'<p class="kx-empty">Vùng trống · thêm ở bước 3</p>'}</div>`;}).join('');
    let insp='<div class="kx-sec"><p class="kx-mini">Bấm một thành phần trên khối hoặc trong danh sách để sửa nội dung, nguồn dữ liệu và kiểu chữ.</p></div>';
    if(cur){const D=ST_K_ELEMENTS[cur.kind];insp=`<div class="kx-sec kx-insp"><h4>${stKUIcon(cur.kind)}<span>${E(D.name)}</span>${D.bound?'<em class="kx-bound">Dữ liệu tự động</em>':''}</h4><p class="kx-mini">${E(D.desc)}</p>${D.f.map(f=>field(cur,f)).join('')}${L.slots.length>1?`<label class="st-field"><span>Nằm trong vùng</span><select data-slot-of="${E(cur.id)}">${L.slots.map((n,i)=>`<option value="${i}"${cur.slot===i?' selected':''}>${E(n)}</option>`).join('')}</select></label>`:''}${D.tone?seg('Màu','st','tone',ST_K_TONES,cur.s.tone):''}${D.size?seg('Cỡ','st','size',ST_K_SIZES,cur.s.size):''}${D.align?seg('Căn lề','st','align',ST_K_ALIGNS,cur.s.align):''}</div>`;}
    el.innerHTML=`<div class="kx-sec"><h4>Thành phần trong khối <small>${s.els.length}</small></h4>${outline}</div>${insp}`;
  }
  function paintStage(){
    const c=root.querySelector('#kx-canvas');if(!c)return;const s=S.work,data=previewData();
    const block=stKBlockOf(s,stKUSanitize(stKRender(s,data,{showVars:S.data==='names'})));
    c.innerHTML=`<section class="st-page kx-page" data-bg="${S.bg}"><div class="st-sheet"><div class="st-grid">${stKBlockMarkup(block)}${s.size.w<12?`<div class="kx-ghost" style="--w:${12-s.size.w}"><span>Khối khác · ${12-s.size.w}/12</span></div>`:''}</div></div></section>${!s.raw&&!s.els.length?'<p class="kx-empty-stage">Khối đang trống. Chọn khung và bố cục, rồi thêm thành phần ở bước 3.</p>':''}`;
    hydrate(c,s.assets);if(S.sel)c.querySelector(`[data-ke="${CSS.escape(S.sel)}"]`)?.classList.add('kx-on');fitStage();
    const note=root.querySelector('#kx-note');if(note)note.textContent=`Khối ${s.size.w}/12 cột ≈ ${Math.round(s.size.w/12*182)} mm · ${s.size.h?'cao tối thiểu '+s.size.h+' mm':'cao tự động'} · ${S.data==='names'?'đang hiện tên biến':data.sample?'dữ liệu mẫu, không phải số liệu thật':'dữ liệu của báo giá đã chọn'}`;
  }
  function fitStage(){const c=root.querySelector('#kx-canvas'),p=c?.querySelector('.kx-page');if(p)p.style.zoom=String(Math.min(1,Math.max(.35,(c.clientWidth-24)/794)));}
  window.addEventListener('resize',()=>{if(!root.hidden&&S.view==='builder')fitStage();});

  // Mọi thay đổi spec: một bước hoàn tác (gõ chữ gom theo nhịp nghỉ), lưu nháp sau 400 ms.
  function change(fn,{typing=false,parts='tsrc'}={}){
    if(!typing||!S.burst){S.undo.push(S.last);if(S.undo.length>80)S.undo.shift();S.redo=[];}
    S.burst=typing;clearTimeout(S.burstT);if(typing)S.burstT=setTimeout(()=>S.burst=false,700);
    fn(S.work);S.work=stKNormalize(S.work);const snap=JSON.stringify(S.work);
    if(snap===S.undo.at(-1)&&!typing)S.undo.pop();S.last=snap;if(S.sel&&!S.work.els.some(e=>e.id===S.sel))S.sel=null;
    queueSave();paint(parts);
  }
  function queueSave(){clearTimeout(S.saveT);S.saveT=setTimeout(saveDraft,400);paintTop();}
  async function saveDraft(){clearTimeout(S.saveT);S.saveT=0;const id=S.def,spec=S.work;if(!id||!spec)return;const run=write(kit=>{stKSetDraft(kit,id,spec);}).catch(e=>toast('Chưa lưu được nháp: '+e.message));S.saving=run;await run;if(S.saving===run)S.saving=null;paintTop();}
  async function flushDraft(){if(S.saveT)await saveDraft();else if(S.saving)await S.saving;}
  function undo(redo=false){const from=redo?S.redo:S.undo,to=redo?S.undo:S.redo;if(!from.length)return;to.push(S.last);S.last=from.pop();S.work=JSON.parse(S.last);if(S.sel&&!S.work.els.some(e=>e.id===S.sel))S.sel=null;queueSave();paint('tsrc');}
  function addElement(i){
    const x=ST_K_PALETTE[i];if(!x)return;if(S.work.els.length>=40){toast('Một khối tối đa 40 thành phần.');return;}
    change(w=>{const slots=stKLayout(w.layout.kind).slots.length,el=stKNewElement(x.kind,x.p||{},Math.min(S.slot,slots-1)),at=w.els.findIndex(e=>e.id===S.sel);if(at>=0&&w.els[at].slot===el.slot)w.els.splice(at+1,0,el);else w.els.push(el);S.sel=el.id;});
  }
  function elementAction(op,id){
    change(w=>{const i=w.els.findIndex(e=>e.id===id);if(i<0)return;const el=w.els[i];
      if(op==='del'){w.els.splice(i,1);return;}
      if(op==='dup'){const c=JSON.parse(JSON.stringify(el));c.id=stId('e');w.els.splice(i+1,0,c);S.sel=c.id;return;}
      const dir=op==='up'?-1:1;let j=i+dir;while(j>=0&&j<w.els.length&&w.els[j].slot!==el.slot)j+=dir;if(j<0||j>=w.els.length)return;[w.els[i],w.els[j]]=[w.els[j],w.els[i]];S.sel=id;});
  }
  function pickImage(key){
    const f=document.createElement('input');f.type='file';f.accept='image/png,image/jpeg,image/webp,image/svg+xml';
    f.onchange=async()=>{try{const url=await stKUImage(f.files[0]),id=stId('ka'),sel=S.sel;change(w=>{w.assets[id]=url;const el=w.els.find(e=>e.id===sel);if(el)el.p[key]=id;});}catch(e){toast(e.message);}};f.click();
  }
  function insertVar(k,key){
    const tok='{{'+key+'}}';
    if(k==='html'){const r=root.querySelector('#kx-rich');if(!r)return;r.focus();document.execCommand('insertText',false,tok);return;}
    const inp=root.querySelector(`#kx-right [data-f="${k}"]`);if(!inp)return;const a=inp.selectionStart??inp.value.length,b=inp.selectionEnd??a;
    inp.value=inp.value.slice(0,a)+tok+inp.value.slice(b);inp.focus();inp.setSelectionRange(a+tok.length,a+tok.length);inp.dispatchEvent(new Event('input',{bubbles:true}));
  }
  function readRich(el){const c=el.cloneNode(true);c.querySelectorAll('img[data-asset]').forEach(i=>i.removeAttribute('src'));c.querySelectorAll('.is-empty').forEach(x=>x.classList.remove('is-empty'));return stKUSanitize(c.innerHTML);}
  async function publish(){
    if(S.view!=='builder')return;const errors=stKLint(S.work).filter(x=>x.level==='error');
    if(errors.length){S.step='check';paint('s');toast(`Còn ${errors.length} lỗi ở bước Kiểm tra & lưu.`);return;}
    clearTimeout(S.saveT);S.saveT=0;if(S.saving)await S.saving;const note=root.querySelector('#kx-vnote')?.value||'',id=S.def,spec=S.work;
    const v=await write(kit=>{stKSetDraft(kit,id,spec);return stKPublish(kit,id,{note});});
    toast(v?`Đã lưu phiên bản v${v.v}. Báo giá đang dùng phiên bản cũ giữ nguyên.`:'Không có thay đổi so với phiên bản đang dùng.');paint('ts');
  }
  async function metaWrite(fn){clearTimeout(S.metaT);S.metaT=setTimeout(()=>write(kit=>{const d=kit.defs.find(x=>x.id===S.def);if(d){fn(d);d.updated=Date.now();}}).catch(e=>toast(e.message)),350);}

  root.addEventListener('click',async e=>{
    const t=e.target.closest('[data-k],[data-kg],[data-tab],[data-step],[data-frame-kind],[data-frame],[data-layout-kind],[data-lay],[data-add],[data-sel],[data-el],[data-w],[data-accent],[data-scale],[data-st],[data-bgk],[data-pick],[data-unpick],[data-icon]');
    const ke=e.target.closest('#kx-canvas [data-ke]');
    if(ke&&(!t||!ke.contains(t))){S.sel=ke.dataset.ke;paint('rc');return;}
    if(!t)return;const v=t.dataset.v,id=t.dataset.id;
    try{
      if(t.dataset.tab){S.tab=t.dataset.tab;renderLibrary();return;}
      if(t.dataset.kg){S.tab='mine';S.group=t.dataset.kg;renderLibrary();return;}
      if(t.dataset.step){S.step=t.dataset.step;paint('s');return;}
      if(t.dataset.frameKind)return change(w=>{w.frame.kind=t.dataset.frameKind;});
      if(t.dataset.frame)return change(w=>{w.frame[t.dataset.frame]=v;});
      if(t.dataset.layoutKind)return change(w=>{w.layout.kind=t.dataset.layoutKind;S.slot=Math.min(S.slot,stKLayout(w.layout.kind).slots.length-1);});
      if(t.dataset.lay)return change(w=>{w.layout[t.dataset.lay]=v;});
      if(t.dataset.add!==undefined)return addElement(+t.dataset.add);
      if(t.dataset.sel){S.sel=t.dataset.sel;paint('rc');root.querySelector('#kx-right .kx-insp')?.scrollIntoView({block:'nearest'});return;}
      if(t.dataset.el)return elementAction(t.dataset.el,id);
      if(t.dataset.w)return change(w=>{w.size.w=+t.dataset.w;});
      if(t.dataset.accent)return change(w=>{w.look.accent=t.dataset.accent;});
      if(t.dataset.scale)return change(w=>{w.look.scale=t.dataset.scale;});
      if(t.dataset.st){const sel=S.sel;return change(w=>{const el=w.els.find(x=>x.id===sel);if(el)el.s[t.dataset.st]=v;});}
      if(t.dataset.bgk){S.bg=t.dataset.bgk;root.querySelectorAll('[data-bgk]').forEach(b=>{b.classList.toggle('on',b===t);b.setAttribute('aria-pressed',String(b===t));});paint('sc');return;}
      if(t.dataset.pick)return pickImage(t.dataset.pick);
      if(t.dataset.unpick){const sel=S.sel;return change(w=>{const el=w.els.find(x=>x.id===sel);if(el)el.p[t.dataset.unpick]='';});}
      if(t.dataset.icon){const sel=S.sel;return change(w=>{const el=w.els.find(x=>x.id===sel);if(el)el.p.icon=t.dataset.icon;});}
      const k=t.dataset.k;if(!k)return;
      if(k==='home'){if(S.view==='builder')await flushDraft();hide();await onHome();return;}
      if(k==='back'){await flushDraft();S.view='library';S.def=null;setURL();await loadDocs();renderLibrary();return;}
      if(k==='undo')return undo();if(k==='redo')return undo(true);if(k==='publish')return publish();
      if(k==='group-add'||k==='group-sub'){const name=await ask(k==='group-sub'?'Thêm nhóm con':'Nhóm khối mới','Tên nhóm');if(!name)return;const g=await write(kit=>stKAddGroup(kit,name,k==='group-sub'?id:null));S.tab='mine';S.group=g.id;renderLibrary();return;}
      if(k==='group-rename'){const g=S.kit.groups.find(x=>x.id===id);const name=g&&await ask('Đổi tên nhóm','Tên nhóm',g.name);if(!name)return;await write(kit=>stKRenameGroup(kit,id,name));renderLibrary();return;}
      if(k==='group-move'){const g=S.kit.groups.find(x=>x.id===id);if(!g)return;const ok=await dialog('Chuyển nhóm',`<p>Chuyển “${E(g.name)}” cùng các nhóm con và khối bên trong vào:</p><label class="st-field"><span>Nhóm đích</span><select id="kx-move-target">${groupOptions(g.parent,{exclude:id,none:'Cấp gốc (không thuộc nhóm nào)'})}</select></label>`,[{label:'Huỷ',value:false},{label:'Chuyển',value:true,primary:true}]);if(!ok)return;const target=document.getElementById('kx-move-target')?.value||null;await write(kit=>stKMoveGroup(kit,id,target));toast('Đã chuyển nhóm.');renderLibrary();return;}
      if(k==='group-del'){const g=S.kit.groups.find(x=>x.id===id);if(!g)return;if(!await dialog('Xoá nhóm?',`Nhóm “${E(g.name)}” được xoá; nhóm con và khối bên trong chuyển lên ${g.parent?'nhóm cha':'cấp gốc'}. Không khối nào bị xoá.`,[{label:'Huỷ',value:false},{label:'Xoá nhóm',value:true,danger:true}]))return;await write(kit=>stKDeleteGroup(kit,id));if(S.group===id)S.group=g.parent||'all';renderLibrary();return;}
      if(k==='def-new'){const group=S.tab==='mine'?realGroup():null;const d=await write(kit=>stKAddDef(kit,{name:'Khối mới',group,spec:stKNewSpec()}));return openBuilder(d.id);}
      if(k==='def-edit'&&id)return openBuilder(id);
      if(k==='def-dup'){await write(kit=>stKDupDef(kit,id));toast('Đã nhân bản khối.');paintList();return;}
      if(k==='def-del'){await write(kit=>stKArchiveDef(kit,id));toast('Đã chuyển vào thùng rác. Báo giá đã chèn khối này giữ nguyên nội dung.');renderLibrary();return;}
      if(k==='def-restore'){await write(kit=>stKArchiveDef(kit,id,false));renderLibrary();return;}
      if(k==='def-purge'){if(!await dialog('Xoá vĩnh viễn?','Khối và lịch sử phiên bản bị xoá khỏi thư viện. Báo giá đã chèn khối vẫn giữ nguyên nội dung.',[{label:'Huỷ',value:false},{label:'Xoá vĩnh viễn',value:true,danger:true}]))return;await write(kit=>stKPurgeDef(kit,id));renderLibrary();return;}
      if(k==='preset-copy'){const p=ST_PRESETS.find(x=>x.id===id);if(!p)return;const d=await write(kit=>stKAddDef(kit,{name:p.name+' · tuỳ chỉnh',group:realGroup(),spec:stKSnapshot({type:p.type,style:ST_TYPES[p.type].style,w:p.w||ST_TYPES[p.type].w,html:p.html})}));return openBuilder(d.id);}
    }catch(err){toast(err.message);}
  });
  root.addEventListener('keydown',e=>{
    if(S.view==='builder'&&(e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&!e.target.closest('input,textarea,[contenteditable]')){e.preventDefault();undo(e.shiftKey);return;}
    if(e.key==='Enter'&&e.target.matches('.kl-thumb[data-k]')){e.preventDefault();e.target.click();}
  });
  root.addEventListener('input',e=>{
    const t=e.target;
    if(t.id==='kl-search'){S.query=t.value;paintList();return;}
    if(t.id==='kx-name'){const name=t.value;metaWrite(d=>{d.name=name.trim()||d.name;});return;}
    if(t.id==='kx-desc'){const desc=t.value;metaWrite(d=>{d.desc=desc;});return;}
    if(t.id==='kx-h'){const h=+t.value||0;change(w=>{w.size.h=h;},{typing:true,parts:'tc'});return;}
    if(t.id==='kx-rich'){const html=readRich(t);change(w=>{w.els[0].p.html=html;},{typing:true,parts:'tc'});return;}
    if(t.dataset.f&&t.tagName!=='SELECT'){const sel=S.sel,k=t.dataset.f,val=t.value;change(w=>{const el=w.els.find(x=>x.id===sel);if(el)el.p[k]=val;},{typing:true,parts:'tc'});}
  });
  root.addEventListener('change',async e=>{
    const t=e.target;
    try{
      if(t.dataset.kMove){await write(kit=>stKMoveDef(kit,t.dataset.kMove,t.value||null));toast('Đã chuyển khối.');renderLibrary();return;}
      if(t.id==='kx-group'){const g=t.value||null;await write(kit=>stKMoveDef(kit,S.def,g));return;}
      if(t.id==='kx-show'){const on=t.checked;await write(kit=>{const d=kit.defs.find(x=>x.id===S.def);if(d)d.show=on;});return;}
      if(t.id==='kx-data'){S.data=t.value;paint('rc');return;}
      if(t.id==='kx-slot'){S.slot=+t.value||0;return;}
      if(t.dataset.varFor){const key=t.value;t.value='';if(key)insertVar(t.dataset.varFor,key);return;}
      if(t.dataset.slotOf){const id=t.dataset.slotOf,slot=+t.value;change(w=>{const el=w.els.find(x=>x.id===id);if(el)el.slot=slot;});return;}
      if(t.dataset.f&&t.tagName==='SELECT'){const sel=S.sel,k=t.dataset.f,val=t.value;change(w=>{const el=w.els.find(x=>x.id===sel);if(el)el.p[k]=val;},{parts:'tsc'});return;}
    }catch(err){toast(err.message);}
  });
  root.addEventListener('paste',e=>{if(!e.target.closest('#kx-rich'))return;e.preventDefault();(e.clipboardData?.getData('text/plain')??'').replace(/\r/g,'').split('\n').forEach((line,i)=>{if(i)document.execCommand('insertLineBreak');if(line)document.execCommand('insertText',false,line);});});
  stQuoteEvents.subscribe(async ev=>{if(ev.type!=='kit-saved'||ev.writer===ST_KU_WRITER||root.hidden)return;await reload();});
  async function reload(){S.kit=await stKitRead(repo);if(root.hidden)return;if(S.view==='library')renderLibrary();else if(!def()){S.view='library';renderLibrary();}else paintTop();}
  async function show(defId){
    S.kit=await stKitRead(repo);await loadDocs();
    root.hidden=false;document.getElementById('st-home').hidden=true;document.getElementById('st-app').hidden=true;document.body.classList.add('st-home-mode','st-kit-mode');
    if(defId&&S.kit.defs.some(d=>d.id===defId&&!d.archivedAt))return openBuilder(defId);
    S.view='library';S.def=null;setURL();renderLibrary();
  }
  // Bỏ DOM xem trước khi rời trang thư viện để trình soạn không gặp các trang .st-page của thư viện.
  function hide(){if(S.view==='builder')flushDraft();root.hidden=true;root.innerHTML='';S.view='library';document.body.classList.remove('st-kit-mode');}
  return {show,hide,reload,visible:()=>!root.hidden,flush:flushDraft};
}

const stHEsc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stHTime=n=>new Date(n||Date.now()).toLocaleString('vi-VN',{dateStyle:'short',timeStyle:'short'});
const stHMoney=n=>new Intl.NumberFormat('vi-VN').format(n)+' đ';
function stWorkspaceAdapter(repo,{sanitizeDoc=d=>d}={}){
  const templates=async()=>await repo.getKV(ST_TEMPLATE_KEY)||[];
  // Một bản ghi đồng bộ cho thư viện: blocks = “Khối đã lưu” cũ (máy bản cũ vẫn đọc được), kit = Thư viện khối có nhóm và phiên bản.
  const library=async()=>({id:'block-library',name:'Thư viện khối',blocks:await repo.getKV('st-library')||[],kit:await repo.getKV(ST_K_KEY)||null});
  return {
    get:async(kind,id)=>kind==='doc'?repo.getDoc(id):kind==='draft'?repo.getDraft(id):kind==='template'?(await templates()).find(x=>x.id===id):kind==='library'?library():null,
    all:async kind=>{if(kind!=='library')return kind==='doc'?repo.allDocs():kind==='draft'?(await repo.allDrafts()).filter(x=>x.workspaceInputs):kind==='template'?templates():[];const l=await library();return l.blocks.length||l.kit?[l]:[];},
    put:async(kind,entity)=>{
      if(kind==='doc'){const old=await repo.getDoc(entity.id),copy=sanitizeDoc(JSON.parse(JSON.stringify(entity)));delete copy.revision;return repo.saveDoc(copy,old?.revision||0);}
      if(kind==='draft')return repo.putDraft(entity);
      if(kind==='template'){let saved;await repo.updateKV(ST_TEMPLATE_KEY,list=>{const all=list||[],i=all.findIndex(t=>t.id===entity.id);saved={...entity,revision:(all[i]?.revision||0)+1,updated:Date.now()};if(i<0)all.push(saved);else all[i]=saved;return all;});return saved;}
      if(kind==='library'){if(Array.isArray(entity.blocks))await repo.setKV('st-library',entity.blocks);if(entity.kit)await repo.setKV(ST_K_KEY,stKNormalizeKit(entity.kit));return library();}
      throw new Error('Loại dữ liệu đồng bộ không hợp lệ.');
    }
  };
}

function stSanitize(html){
  const t=document.createElement('template');t.innerHTML=String(html??'');
  t.content.querySelectorAll('script,style,iframe,object,embed,link,meta,form,input,button,textarea,select').forEach(n=>n.remove());
  t.content.querySelectorAll('*').forEach(n=>{for(const a of [...n.attributes]){const v=a.value.trim().toLowerCase();if(a.name.startsWith('on')||((a.name==='href'||a.name==='src'||a.name==='xlink:href')&&(v.startsWith('javascript:')||(v.startsWith('data:')&&!v.startsWith('data:image/')))))n.removeAttribute(a.name);}});

}

// Kiểm tra thuần nhận dữ liệu và số đo; giao diện chỉ hiển thị và dẫn tới nội dung.
function stChecks(){
  const el=st$('#st-checks');if(!el||!stDoc)return;
  const all=stLint(stDoc,stMeasurements),dismissed=new Set(stDoc.dismissed||[]),visible=all.filter(x=>x.level!=='suggestion'||!dismissed.has(x.id));

  const groups=[['layout','Bố cục'],['content','Nội dung'],['source','Lưu ý từ Quote Lab']],names={error:'Lỗi',warning:'Cảnh báo',suggestion:'Gợi ý'};
  el.innerHTML=`<p class="st-check-summary" aria-live="polite">${counts.error} lỗi · ${counts.warning} cảnh báo · ${counts.suggestion} gợi ý</p>${groups.map(([group,name])=>{
    const items=visible.filter(x=>x.group===group);if(!items.length)return '';
    return `<div class="st-check-group"><h5>${name}</h5><ul class="st-checks">${items.map(x=>`<li class="${x.level==='error'?'bad':x.level}" data-check-code="${x.code}"><button type="button" class="st-check-link"${x.bid?` data-goto-block="${stEsc(x.bid)}"`:x.pid?` data-goto-page="${stEsc(x.pid)}"`:''}><span class="st-check-level">${names[x.level]}</span>${stEsc(x.message)}</button>${x.level==='suggestion'?`<button type="button" class="st-dismiss" data-dismiss="${stEsc(x.id)}" aria-label="Ẩn gợi ý">Ẩn</button>`:''}</li>`).join('')}</ul></div>`;
  }).join('')}${visible.length?'':'<p class="st-hint">Không có gì cần xem thêm.</p>'}${all.some(x=>x.level==='suggestion'&&dismissed.has(x.id))?'<div class="st-check-options"><button type="button" data-act="checks-restore">Hiện lại gợi ý đã ẩn</button></div>':''}`;
}
function stSetFocus(bid){stFlush();const r=stFind(bid);if(!r)return;if(r.b.focus){r.b.focus=false;if(r.b.style==='accent')r.b.style='card';}else stFocusPage(r.p,bid);stRenderPage(r.p.id);stPanel();stCommit();}
function stSyncTypeStyle(bid){
  stFlush();const r=stFind(bid);if(!r)return;const changed=stApplyTypeStyle(stDoc,r.b.type,r.b.style);

function stSetSel(s,{panel=true}={}){
  if(stSel?.bid!==s?.bid)stTextRange=null;
  stSel=s;
  st$$('.st-b.is-sel,.st-page.is-sel').forEach(e=>e.classList.remove('is-sel'));
  if(s?.bid)stBlockEl(s.bid)?.classList.add('is-sel');else if(s?.pid)stPageEl(s.pid)?.classList.add('is-sel');
  st$$('#st-pagelist li').forEach(li=>li.classList.toggle('is-cur',li.dataset.pid===s?.pid));

function stCurrentPage(){
  const c=st$('#st-canvas').getBoundingClientRect();let best=null,score=-1;
  for(const el of st$$('#st-pages > .st-page')){const r=el.getBoundingClientRect(),v=Math.min(r.bottom,c.bottom)-Math.max(r.top,c.top);if(v>score){score=v;best=el.dataset.pid;}}
  return best||stDoc.pages[0]?.id;
}

function stFromDOM(bEl){

// ---------- Thao tác khối & trang ----------
function stInsert(type,at,prepared){
  stFlush();if(!stDoc.pages.length)stDoc.pages.push(stNewPage('light'));
  const b=prepared||stNewBlock(type);let pid,index;
  if(type==='appList'&&!prepared){const pkg=stPackageChoices(stDoc.data)[0];b.packageId=pkg?.id;b.html=stAppListHTML(pkg);}
  if(at){pid=at.pid;index=at.index;}
  else if(stSel?.bid&&stFind(stSel.bid)){const r=stFind(stSel.bid);pid=r.p.id;index=r.i+1;}
  else{pid=stSel?.pid&&stPage(stSel.pid)?stSel.pid:stCurrentPage();index=stPage(pid).blocks.length;}
  stPage(pid).blocks.splice(index,0,b);stSel={pid,bid:b.id};stRenderPage(pid);stPanel();stCommit();
  const el=stBlockEl(b.id);el?.scrollIntoView({block:'nearest',behavior:'smooth'});
  if(!prepared&&(type==='image'||type==='logo'))stPickImage(b.id);else{const c=el?.querySelector('[contenteditable]'),first=c&&[...c.querySelectorAll('h1,h2,h3,p,li,td,th')].find(x=>x.textContent.trim()&&!x.querySelector('p,li,td'));if(c){c.focus();if(first)stSelectAllIn(first);}}
}

function stFixOverflow(pid){

    const rest={...JSON.parse(JSON.stringify(b)),id:stId('b'),html:make(false),src:undefined};

  }

    const to=ci+(op==='col-left'?-1:1);if(to<0||to>=row.cells.length){stToast(op==='col-left'?'Cột đã ở bên trái cùng.':'Cột đã ở bên phải cùng.');return;}

  }
  stCell=next;stFromDOM(bEl);stCommit();stScheduleMeasure();
  if(next){bEl.querySelector('.st-c').focus();stSelectAllIn(next);next.scrollIntoView({block:'nearest',inline:'nearest'});}
}

function stDropTarget(x,y){
  const el=document.elementFromPoint(x,y);if(!el)return null;
  const li=el.closest('#st-pagelist li');
  if(li){
    if(stDrag.src.kind==='page'){const r=li.getBoundingClientRect(),after=y>r.top+r.height/2,ids=stDoc.pages.map(p=>p.id);return {kind:'page',index:ids.indexOf(li.dataset.pid)+(after?1:0),line:{x:r.left,y:after?r.bottom:r.top,w:r.width}};}
    const r=li.getBoundingClientRect();return {pid:li.dataset.pid,index:stPage(li.dataset.pid).blocks.length,box:r};
  }
  if(stDrag.src.kind==='page')return null;
  const b=el.closest('.st-b');
  if(b&&b.dataset.bid!==stDrag.src.bid&&!b.closest('.st-dragging')){
    const f=stFind(b.dataset.bid),r=b.getBoundingClientRect(),full=f.b.w>=12;
    const after=full?y>r.top+r.height/2:x>r.left+r.width/2;
    return {pid:f.p.id,index:f.i+(after?1:0),line:full?{x:r.left,y:after?r.bottom+2:r.top-2,w:r.width}:{x:after?r.right+2:r.left-2,y:r.top,h:r.height}};
  }
  const pg=el.closest('.st-page');
  if(pg){
    const p=stPage(pg.dataset.pid),kids=[...pg.querySelectorAll('.st-grid > .st-b')].filter(k=>k.dataset.bid!==stDrag.src.bid);
    let index=p.blocks.length,ref=null;
    for(const k of kids){const r=k.getBoundingClientRect();if(y<r.top+r.height/2){index=p.blocks.findIndex(b=>b.id===k.dataset.bid);ref=r;break;}}
    const g=pg.querySelector('.st-grid').getBoundingClientRect();
    if(ref)return {pid:p.id,index,line:{x:g.left,y:ref.top-3,w:g.width}};
    const last=kids[kids.length-1]?.getBoundingClientRect();
    return {pid:p.id,index,line:{x:g.left,y:last?last.bottom+3:g.top+4,w:g.width}};
  }
  return null;
}
function stShowDrop(t){

  st$$('#st-pagelist li.drop').forEach(l=>l.classList.remove('drop'));

}
function stStartDrag(e,src,label){
  e.preventDefault();stFlush();
  stDrag={src,x0:e.clientX,y0:e.clientY,moved:false,target:null,label};
  window.addEventListener('pointermove',stDragMove);window.addEventListener('pointerup',stDragEnd,{once:true});window.addEventListener('pointercancel',stDragEnd,{once:true});
}
function stDragMove(e){
  const d=stDrag;if(!d)return;
  if(!d.moved){if(Math.hypot(e.clientX-d.x0,e.clientY-d.y0)<5)return;d.moved=true;document.body.classList.add('st-dragging-on');
    const g=st$('#st-ghost');g.textContent=d.label;g.hidden=false;
    if(d.src.kind==='block')stBlockEl(d.src.bid)?.classList.add('st-dragging');
    if(d.src.kind==='page')st$(`#st-pagelist li[data-pid="${d.src.pid}"]`)?.classList.add('st-dragging');}
  const g=st$('#st-ghost');g.style.left=e.clientX+14+'px';g.style.top=e.clientY+10+'px';
  d.target=stDropTarget(e.clientX,e.clientY);stShowDrop(d.target);

  clearInterval(d.scroll);if(e.clientY<r.top+60)d.scroll=setInterval(()=>c.scrollBy(0,-18),16);else if(e.clientY>r.bottom-60)d.scroll=setInterval(()=>c.scrollBy(0,18),16);
}
function stDragEnd(){
  const d=stDrag;stDrag=null;window.removeEventListener('pointermove',stDragMove);if(!d)return;
  clearInterval(d.scroll);document.body.classList.remove('st-dragging-on');st$('#st-ghost').hidden=true;stShowDrop(null);st$$('.st-dragging').forEach(x=>x.classList.remove('st-dragging'));
  if(!d.moved){if(d.src.kind==='new')d.src.kit?stInsertKit(d.src.kit):d.src.preset?stInsertPreset(d.src.preset):stInsert(d.src.type);return;}
  const t=d.target;if(!t)return;
  if(d.src.kind==='page'&&t.kind==='page')stMovePage(d.src.pid,t.index);
  else if(d.src.kind==='block'&&t.pid)stMove(d.src.bid,t.pid,t.index);
  else if(d.src.kind==='new'&&t.pid)d.src.kit?stInsertKit(d.src.kit,{pid:t.pid,index:t.index}):d.src.preset?stInsertPreset(d.src.preset,{pid:t.pid,index:t.index}):stInsert(d.src.type,{pid:t.pid,index:t.index});
}

function stStartResize(e,axis,bEl){
  e.preventDefault();e.stopPropagation();stFlush();
  const r=stFind(bEl.dataset.bid);if(!r)return;stSetSel({pid:r.p.id,bid:r.b.id});
  const grid=bEl.parentElement,gr=grid.getBoundingClientRect(),gap=parseFloat(getComputedStyle(grid).columnGap)||0,col=(gr.width-11*gap)/12,r0=bEl.getBoundingClientRect();
  const tip=st$('#st-tip');tip.hidden=false;document.body.classList.add('st-resizing-'+axis);
  const name=w=>(ST_WIDTHS.find(x=>x[0]===w)?.[1]||'')+` · ${w}/12`;
  let val=axis==='w'?r.b.w:r.b.h;
  const move=ev=>{
    if(axis==='w'){val=Math.max(2,Math.min(12,Math.round((ev.clientX-r0.left+gap)/(col+gap))));bEl.style.setProperty('--w',val);tip.textContent='Độ rộng '+name(val);}
    else{val=Math.max(8,Math.round((ev.clientY-r0.top)/ST_PXMM/2)*2);bEl.style.setProperty('--h',val+'mm');tip.textContent=`Chiều cao ${val} mm`;}
    tip.style.left=ev.clientX+14+'px';tip.style.top=ev.clientY+12+'px';
  };
  const up=()=>{window.removeEventListener('pointermove',move);tip.hidden=true;document.body.classList.remove('st-resizing-'+axis);if(val!==(axis==='w'?r.b.w:r.b.h))stSetProp(r.b.id,axis,val);};
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',up,{once:true});move(e);
}

  });
  pages.addEventListener('dblclick',e=>{

  });
  pages.addEventListener('mouseup',()=>stCaretOutOfVar());
  pages.addEventListener('keydown',e=>{

    if(e.key==='Enter'&&!e.shiftKey&&e.target.closest('[contenteditable]')){const t=getSelection().anchorNode,el=t&&(t.nodeType===1?t:t.parentElement);if(el?.closest('td,th,.k,.v,.s,h1,h2,h3,.eyebrow')){e.preventDefault();document.execCommand('insertLineBreak');}}
  });
  pages.addEventListener('paste',e=>{
    if(!e.target.closest('[contenteditable]'))return;e.preventDefault();
    (e.clipboardData?.getData('text/plain')??'').replace(/\r/g,'').split('\n').forEach((line,i)=>{if(i)document.execCommand('insertLineBreak');if(line)document.execCommand('insertText',false,line);});
  });
  pages.addEventListener('drop',e=>e.preventDefault());
  document.addEventListener('selectionchange',()=>{const selection=getSelection(),n=selection.anchorNode,el=n&&(n.nodeType===1?n:n.parentElement);
    const b=el?.closest?.('#st-pages .st-b');if(!b)return;const c=el.closest('td,th');if(c)stCell=c;if(selection.rangeCount){const range=selection.getRangeAt(0);if(b.querySelector('.st-c').contains(range.commonAncestorContainer))stTextRange={bid:b.dataset.bid,range:range.cloneRange()};}});

  const panel=st$('#st-panel');
  panel.addEventListener('click',e=>{const summary=e.target.closest('summary'),d=summary?.parentElement;if(d?.dataset.section)d.dataset.userToggle='1';});
  panel.addEventListener('toggle',e=>{if(e.target.dataset.userToggle)stPanelOpen[e.target.dataset.section]=e.target.open;},true);
  panel.addEventListener('change',e=>{
    const t=e.target,bid=stSel?.bid,r=bid&&stFind(bid);
    if(t.hasAttribute('data-custom-color')){stColor(t.value);return;}
    if(t.hasAttribute('data-page-question')){const pid=stSel?.pid||panel.dataset.pid,p=stPage(pid);if(p){stFlush();p.question=t.value;stCommit();}return;}
    if(!r)return;
    if(t.hasAttribute('data-reusable')){stSetProp(bid,'reusable',t.checked);return;}
    if(t.hasAttribute('data-cta-url')){stSetCTALink(bid,t.value);return;}
    if(t.dataset.logo){const v=+t.value,max=t.dataset.logo==='w'?180:100;if(!Number.isFinite(v)||v<8||v>max){stToast(`Kích thước logo từ 8 đến ${max} mm.`);stPanel();return;}stSetProp(bid,t.dataset.logo==='w'?'logoW':'logoH',v);}
    if(t.hasAttribute('data-logo-align'))stSetProp(bid,'logoAlign',t.value);
    if(t.hasAttribute('data-logo-frame'))stSetProp(bid,'logoFrame',t.checked);
    if(t.hasAttribute('data-package'))stApplyAppPackage(bid,t.value);
    if(t.hasAttribute('data-package-all')){stPkgAll=t.checked;stPanel();}
    if(t.dataset.frame){const f={...(r.b.frame||{}),[t.dataset.frame]:t.value};stSetProp(bid,'frame',f);}
  });
  panel.addEventListener('pointerdown',e=>{
    const lib=e.target.closest('.st-libi');if(lib&&e.button===0){if(lib.dataset.kit){const d=stKit?.defs.find(x=>x.id===lib.dataset.kit);if(d)stStartDrag(e,{kind:'new',kit:d.id},'Thêm: '+d.name);return;}const preset=ST_PRESETS.find(p=>p.id===lib.dataset.preset),type=preset?.type||lib.dataset.type;stStartDrag(e,{kind:'new',type,preset:preset?.id},'Thêm: '+(preset?.name||ST_TYPES[type].name));return;}
    if(e.target.closest('[data-cmd],[data-color],[data-act="color-reset"]'))e.preventDefault();
  });
  panel.addEventListener('mousedown',e=>{if(e.target.closest('[data-cmd],[data-color],[data-act="color-reset"]'))e.preventDefault();});
  panel.addEventListener('click',async e=>{
    const t=e.target.closest('button,[data-goto-page],[data-goto-block],input');if(!t)return;if(t.classList.contains('st-libi')){if(e.detail===0)t.dataset.kit?stInsertKit(t.dataset.kit):t.dataset.preset?stInsertPreset(t.dataset.preset):stInsert(t.dataset.type);return;}
    const bid=stSel?.bid,pid=stSel?.pid||panel.dataset.pid;
    if(t.dataset.dismiss){stFlush();stDoc.dismissed??=[];if(!stDoc.dismissed.includes(t.dataset.dismiss))stDoc.dismissed.push(t.dataset.dismiss);stCommit();stChecks();return;}
    if(t.dataset.gotoPage){stSetSel({pid:t.dataset.gotoPage});stScrollTo(stPageEl(t.dataset.gotoPage));return;}
    if(t.dataset.gotoBlock){const f=stFind(t.dataset.gotoBlock);if(f){stSetSel({pid:f.p.id,bid:f.b.id});stBlockEl(f.b.id)?.scrollIntoView({behavior:'smooth',block:'center'});}return;}
    if(t.dataset.w)return stSetProp(bid,'w',+t.dataset.w);
    if(t.dataset.style)return stSetProp(bid,'style',t.dataset.style);
    if(t.dataset.bg){stFlush();stPage(pid).bg=t.dataset.bg;stRenderPage(pid);stPanel();stCommit();return;}
    if(t.dataset.layout)return stApplyLayout(pid,t.dataset.layout);
    if(t.dataset.color)return stColor(t.dataset.color);
    if(t.dataset.cmd){const b=bid&&stBlockEl(bid);if(b){stRestoreTextSelection(b);document.execCommand(t.dataset.cmd,false,null);stFromDOM(b);stCommit();stScheduleMeasure();}return;}
    const act=t.dataset.act;if(!act)return;
    if(act==='apps-rebuild')return stApplyAppPackage(bid,stFind(bid)?.b.packageId);
    if(act==='kit-open')return stKitOpen();if(act==='kit-edit')return stKitOpen(stFind(bid)?.b.kit?.def);if(act==='kit-upgrade')return stKitUpgrade();if(act==='kit-refresh')return stKitRefresh();if(act==='kit-detach')return stKitDetach();
    if(act==='docs')return stHomeUI.home();if(act==='library-save')return stSaveLibrary();if(act==='logo-all')return stSyncLogo();if(act==='color-reset')return stResetColor();
    if(act==='phase2-fill')return stFillPhase2(bid);if(act==='phase2-detach')return stSetProp(bid,'src',undefined);
    if(act==='focus')return stSetFocus(bid);if(act==='style-all')return stSyncTypeStyle(bid);
    if(act==='checks-restore'){stFlush();stDoc.dismissed=[];stCommit();stChecks();return;}
    if(act==='chrome'){stFlush();stPage(pid).chrome=t.checked;stRender();stCommit();return;}
    if(act==='dup')return stDup(bid);if(act==='del')return stDel(bid);
    if(act==='h-auto')return stSetProp(bid,'h',0);
    if(/^(row|col)-/.test(act))return stTableOp(act);
    if(act==='img-pick')return stPickImage(bid);
    if(act==='img-logo'){const b=stBlockEl(bid),r=stFind(bid),box=b?.querySelector('.img');if(box){stFlush();box.classList.add('logo');box.classList.remove('cover');r.b.logoW=32;r.b.logoH=22;r.b.h=0;stFromDOM(b);stRenderPage(r.p.id);stPanel();stCommit();}return;}
    if(act==='img-fit'){const b=stBlockEl(bid),box=b?.querySelector('.img');if(box){box.classList.toggle('cover');stFromDOM(b);stCommit();}return;}
    if(act==='img-clear'){const b=stBlockEl(bid),img=b?.querySelector('.img img');if(img){img.removeAttribute('data-asset');img.removeAttribute('src');stFromDOM(b);stHydrate(b);stCommit();}return;}
    if(act==='page-add')return stAddPage(stDoc.pages.indexOf(stPage(pid)));
    if(act==='page-dup')return stDupPage(pid);
    if(act==='page-del')return stDelPage(pid);
  });
  panel.addEventListener('input',e=>{const k=e.target.dataset.doc;if(!k)return;const [a,b]=k.split('.');stDoc[a][b]=e.target.value;st$$(a==='header'?'.st-ph span:'+(b==='left'?'first-child':'last-child'):'.st-pf span:first-child').forEach(s=>s.textContent=e.target.value);stTypingCommit();});

  const list=st$('#st-pagelist');
  list.addEventListener('pointerdown',e=>{const li=e.target.closest('li');if(!li||e.button!==0)return;stStartDrag(e,{kind:'page',pid:li.dataset.pid},'Trang '+(stDoc.pages.findIndex(p=>p.id===li.dataset.pid)+1));});
  list.addEventListener('click',e=>{const li=e.target.closest('li');if(!li)return;stSetSel({pid:li.dataset.pid});stScrollTo(stPageEl(li.dataset.pid));});

  st$('#st-docs').addEventListener('click',()=>stHomeUI.home());st$('#st-home-button').addEventListener('click',()=>stHomeUI.home());st$('#st-inputs').addEventListener('click',async()=>{stFlush();await stSaveNow();await stHomeUI.editInputs(stDoc);});
  st$('#st-source-update').addEventListener('click',()=>stPendingSource&&stAskSource(stPendingSource));
  st$('#st-title').addEventListener('input',e=>{if(!stDoc)return;stDoc.title=e.target.value;stTypingCommit();});
  st$('#st-undo').addEventListener('click',stUndo);st$('#st-redo').addEventListener('click',stRedo);
  st$('#st-add-page').addEventListener('click',()=>{if(!stDoc)stOpenDoc(stBlankDoc());else stAddPage(stSel?.pid?stDoc.pages.indexOf(stPage(stSel.pid)):stDoc.pages.length-1);});
  st$('#st-preview').addEventListener('click',()=>{const on=document.body.classList.toggle('st-preview');st$('#st-preview').textContent=on?'Thoát xem trước':'Xem trước';if(on)stSetSel(null);});
  st$('#st-pdf').addEventListener('click',()=>stDoc&&stPrint());
  st$('#st-menu').addEventListener('click',async e=>{
    const b=e.target.closest('button[data-file]');if(!b)return;e.target.closest('details').open=false;
    const k=b.dataset.file;
    if(k==='new')stOpenDoc(stBlankDoc());
    else if(k==='open')st$('#st-file-json').click();
    else if(k==='save'&&stDoc)stSaveFile();
    else if(k==='html'&&stDoc)stExportHTML();
    else if(k==='docs')await stHomeUI.home();else if(k==='template'&&stDoc){stFlush();await stSaveNow();await stHomeUI.promptTemplate(stDoc);}else if(k==='firebase'){await stHomeUI.home();await stHomeUI.showFirebase();}
  });
  st$('#st-file-img').addEventListener('change',e=>stLoadImage(e.target.files[0]));
  st$('#st-file-json').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)stOpenFile(f);});
  document.addEventListener('keydown',e=>{
    const mod=e.metaKey||e.ctrlKey;
    if(e.key==='Escape'&&!st$('#st-dialog').hidden){st$('#st-dialog').click();return;}
    if(st$('#st-app').hidden)return;
    if(e.altKey&&e.shiftKey&&/^Arrow(Up|Down|Left|Right)$/.test(e.key)&&(n=>(n?.nodeType===1?n:n?.parentElement)?.closest('#st-pages td,#st-pages th'))(getSelection().anchorNode)){e.preventDefault();stTableOp({ArrowUp:'row-up',ArrowDown:'row-down',ArrowLeft:'col-left',ArrowRight:'col-right'}[e.key]);return;}
    if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?stRedo():stUndo();return;}
    if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();stRedo();return;}
    if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();stSaveNow();return;}
    if(e.key==='Escape'){if(!st$('#st-dialog').hidden){st$('#st-dialog').click();return;}document.activeElement?.blur?.();stSetSel(stSel?.bid?{pid:stSel.pid}:null);return;}
    if((e.key==='Delete'||e.key==='Backspace')&&stSel?.bid&&!e.target.closest?.('[contenteditable],input,textarea'))
      {e.preventDefault();stDel(stSel.bid);}
  });
  window.addEventListener('beforeprint',()=>{stFlush();stSetSel(null,{panel:false});});
  window.addEventListener('message',e=>{if(!stQuoteOriginOK(e.origin))return;if(stReadonly&&e.source===window.parent&&e.data?.kind==='quote-studio-preview-data'){stReadPreview(e.data.doc);return;}if(e.source===window.opener&&['quote-studio-data','quote-studio-open'].includes(e.data?.kind))stQueuePayload(e.data);if(stChildWindows.has(e.source)&&e.data?.kind==='quote-studio-saved')try{window.opener?.postMessage(e.data,stQuoteTargetOrigin());}catch{}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){stFlush();stSaveNow();}});
}

async function stStart(){
  stSetupWorkspace();if(!stReadonly)stWire();else window.addEventListener('message',e=>{if(e.source===window.parent&&stQuoteOriginOK(e.origin)&&e.data?.kind==='quote-studio-preview-data')stReadPreview(e.data.doc);});
  stQuoteEvents.subscribe(async event=>{if(event.type==='doc-saved'&&stReadonly&&event.docId===stRoute.searchParams.get('doc')){const doc=await stStore.get(event.docId);if((doc?.revision||0)>(stDoc?.revision||0))await stReadPreview(doc);}});
  if(stReadonly){document.body.classList.add('st-preview-readonly','st-preview');const d=await stStore.get(stRoute.searchParams.get('doc')).catch(()=>null);if(d)await stReadPreview(d);else st$('#st-pages').innerHTML='<p>Đang tải bản Studio đã lưu…</p>';stPreviewHeight();window.addEventListener('resize',stPreviewHeight);return;}
  let d=null;const id=stRoute.searchParams.get('doc');
  try{if(id)d=await stStore.get(id);else if(stRoute.searchParams.get('quotation'))d=await stQuoteRepo.findDoc(stRoute.searchParams.get('quotation'));}catch{}
  if(d&&!stQuoteMatches(d,stRoute.searchParams.get('quotation')))d=null;
  await stKitReload();stQuoteEvents.subscribe(event=>{if(event.type==='kit-saved')stKitReload();});
  stQuoteSession.set('quote-studio-seen','1');if(d)await stOpenDoc(d);else if(stRoute.searchParams.get('blocks'))await stKitUI.show(stRoute.searchParams.get('block'));else{await stHomeUI.home();const draft=stRoute.searchParams.get('draft');if(draft)await stHomeUI.resume(draft);}
  const qid=stRoute.searchParams.get('quotation');
  try{const key=qid?'quote-studio-inbox:'+qid:'quote-studio-inbox',raw=localStorage.getItem(key);if(raw){localStorage.removeItem(key);const p=JSON.parse(raw);if(Date.now()-(p.sentAt||0)<15*60e3)await stOnPayload(p);}}catch{}
  if(window.opener)try{window.opener.postMessage({kind:'quote-studio-ready',quotationId:qid},stQuoteTargetOrigin());}catch{}
}
let stCloudService=null,stHomeUI=null;
function stSanitizeDoc(d){d.assets??={};d.pages=(d.pages||[]).map(p=>({...p,blocks:(p.blocks||[]).map(b=>({...b,html:stSanitize(b.html)}))}));return d;}
function stSetupWorkspace(){
  const adapter=stWorkspaceAdapter(stQuoteRepo,{sanitizeDoc:stSanitizeDoc});
  stCloudService=stCreateCloud({repo:stQuoteRepo,adapter,onStatus:()=>stHomeUI?.syncStatus(),onRemote:async event=>{
    if(event.kind==='doc'&&stDoc?.id===event.entity.id&&!stReadonly&&!document.body.classList.contains('st-home-mode')){stFlush();if(stSavedSnapshots.get(stDoc)===stQuoteDocSignature(stDoc))await stOpenDoc(event.entity);else await stSaveNow();}
    if(event.kind==='library'){await stKitReload();await stKitUI?.reload();}stHomeUI?.refresh();
  },onConflict:async event=>{
    if(event.kind==='doc'&&stDoc?.id===event.fromId){stFlush();Object.assign(stDoc,{id:event.entity.id,quotationId:event.entity.quotationId,title:event.entity.title,revision:event.entity.revision});stRememberDoc(stDoc);stCommit();await stSaveNow();stToast('Có chỉnh sửa ở nơi khác. Đã giữ phần của bạn trong một báo giá riêng.');}
    if(event.kind==='draft')stHomeUI?.onDraftConflict(event.fromId,event.entity.id);
  }});
  stKitUI=setupKitStudio({repo:stQuoteRepo,cloud:stCloudService,toast:stToast,dialog:stDialog,listDocs:()=>stQuoteRepo.allDocs(),onHome:()=>stHomeUI.home()});
  stHomeUI=setupStudioHome({repo:stQuoteRepo,adapter,cloud:stCloudService,openDoc:stOpenDoc,openKit:()=>stKitUI.show(),createBlankDoc:async()=>{await stOpenDoc(stBlankDoc());await stSaveNow();},backFromEditor:async()=>{stFlush();await stSaveNow();stDoc=null;stSel=null;},toast:stToast,
    askTemplateName:async name=>{const ok=await stDialog('Lưu thành template','<label class="st-field"><span>Tên template</span><input id="st-template-name" value="'+stEsc(name)+'"></label><p>Khách hàng và giá sẽ được điền lại từ hồ sơ mới. Khối đã đánh dấu giữ nội dung được tái sử dụng.</p>',[{label:'Huỷ',value:false},{label:'Lưu template',value:true,primary:true}]);return ok?st$('#st-template-name').value:null;},
    createDoc:async(input,tpl,context={})=>{stFlush();if(stDoc)await stSaveNow();const d=stWorkspaceBuild(input,tpl,{baseLogo:QD_BASE_LOGO});if(context.draftId){d.quotationId=context.draftId;d.data.quotationId=d.quotationId;}d.sourceSignature=stQuoteSignature(d.data);stDoc=stPrepareDoc(d);stSel=null;stMeasurements={};stHomeUI.hide();stRememberDoc(d);stRender();await stSettle();await stAutoPaginate();stHistReset();await stSaveNow();const draft=await stQuoteRepo.getDraft(d.quotationId);if(draft)await stCloudService.queue('draft',draft);stToast('Đã tạo báo giá độc lập từ bộ hồ sơ.');},
    updateDoc:async(input,id)=>{const target=await stQuoteRepo.getDoc(id);if(!target)throw new Error('Không tìm thấy báo giá.');const payload=stInputPayload(input);if(payload.deal.customer.name!==target.data?.deal?.customer?.name)throw new Error('Hồ sơ thuộc khách hàng khác. Chọn tạo báo giá mới để giữ bản đang có.');await stOpenDoc(target);stFlush();payload.quotationId=target.quotationId;stRefreshDoc(stDoc,payload);stKRefreshDoc(stDoc,payload);stDoc.inputs=input;stDoc.sourceSignature=stQuoteSignature(payload);stRender();stCommit();await stSaveNow();stToast('Đã cập nhật bộ đầu vào và các khối liên kết. Nội dung độc lập giữ nguyên.');}
  });
  stCloudService.start().catch(e=>stToast(e.message));
}
if(document.getElementById('st-app'))stBoot=stStart();
