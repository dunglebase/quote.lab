<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quote Studio · Soạn báo giá Base 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="st-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style id="st-css">/* Quote Studio — phần trang (dùng cả cho file HTML xuất ra). */
:root{--st-accent:#5B8CFF;--st-accent-2:#8FB0FF;--st-ok:#22C55E;--st-bad:#F0565B;--st-warn:#F5A524;--f-display:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;--f-ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
.st-page{position:relative;width:210mm;margin:0 auto 36px}
.st-sheet{position:relative;box-sizing:border-box;width:210mm;min-height:297mm;padding:11mm 14mm 9mm;display:flex;flex-direction:column;font:400 13px/1.55 var(--f-ui);overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
.st-page[data-bg="dark"] .st-sheet{color:#EEF1FF;background:radial-gradient(130mm 95mm at 88% 4%,rgba(91,140,255,.26),transparent 70%),radial-gradient(110mm 80mm at 0% 100%,rgba(91,140,255,.12),transparent 70%),linear-gradient(165deg,#141C50 0%,#0B1030 55%,#070B1D 100%);--ink:#EEF1FF;--ink-2:#BCC4E8;--ink-3:#8C95BA;--line:rgba(255,255,255,.15);--card:rgba(255,255,255,.06);--card-line:rgba(255,255,255,.15);--soft:rgba(255,255,255,.05);--hl:#8FB0FF;--accent-bg:linear-gradient(160deg,rgba(91,140,255,.30),rgba(91,140,255,.10));--accent-line:rgba(143,176,255,.6)}
.st-page[data-bg="light"] .st-sheet{color:#0E1430;background:#fff;--ink:#0E1430;--ink-2:#454E70;--ink-3:#6B7393;--line:#E3E7F1;--card:#F5F7FC;--card-line:#E3E7F1;--soft:#F7F8FC;--hl:#3563E9;--accent-bg:#EEF3FF;--accent-line:#BFD0FF}
.st-ph{display:flex;justify-content:space-between;gap:8mm;height:8mm;margin-bottom:5mm;font:700 9.5px/1.3 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.st-pf{display:flex;justify-content:space-between;align-items:flex-end;gap:8mm;height:5mm;margin-top:5mm;font:500 9.5px/1.3 var(--f-ui);color:var(--ink-3)}
.st-grid{--grid-h:254mm;position:relative;min-height:var(--grid-h);display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5mm;align-content:start}
.st-page[data-nochrome] .st-grid{--grid-h:277mm}
.st-b{grid-column:span var(--w,12);min-height:var(--h,auto);position:relative;min-width:0;display:flex;flex-direction:column;container-type:inline-size;border-radius:3.5mm;box-sizing:border-box}
.st-c{flex:1;min-width:0;outline:none;display:flex;flex-direction:column}
.st-c > *{margin:0}
.st-c > * + *{margin-top:2.4mm}
/* Kiểu khối: chỉ đổi nền/viền/đệm, không đổi nội dung */
.st-s-card{background:var(--card);border:1px solid var(--card-line);padding:5mm}
.st-s-white{background:#fff;color:#0E1430;padding:5mm;border:1px solid #E3E7F1;--ink:#0E1430;--ink-2:#454E70;--ink-3:#6B7393;--line:#E3E7F1;--card:#F5F7FC;--soft:#F7F8FC;--hl:#3563E9}
.st-page[data-bg="light"] .st-s-white{box-shadow:0 1.5mm 5mm rgba(14,20,48,.08)}
.st-s-accent{background:var(--accent-bg);border:1px solid var(--accent-line);padding:5mm}
.st-s-line{border-left:3px solid var(--st-accent);padding:1mm 0 1mm 4.5mm;border-radius:0}
/* Chữ trong khối; số lớn co giãn theo độ rộng khối (container query) */
.st-c h1{font:800 clamp(26px,7.4cqw,50px)/1.08 var(--f-display);letter-spacing:-.02em}
.st-c h2{font:800 clamp(18px,4.3cqw,29px)/1.2 var(--f-display);letter-spacing:-.01em}
.st-c h3{font:700 clamp(13px,3.2cqw,15.5px)/1.35 var(--f-display)}
.st-c .eyebrow{font:700 10.5px/1.3 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--hl)}
.st-c .lead{font-size:15px;line-height:1.55;color:var(--ink-2)}
.st-c .hl{color:var(--hl)}
.st-c .k{font:700 9.5px/1.35 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.st-c .v{font:800 clamp(18px,11.5cqw,38px)/1.1 var(--f-display);letter-spacing:-.01em}
.st-c .v.bad{color:var(--st-bad)}.st-c .v.ok{color:var(--st-ok)}
.st-c .s{font-size:11.5px;line-height:1.5;color:var(--ink-3)}
.st-c .q{font:600 14px/1.5 var(--f-display)}
.st-c .no{display:grid;place-items:center;width:7mm;height:7mm;border-radius:50%;background:var(--st-accent);color:#fff;font:800 12px/1 var(--f-display)}
.st-c .center{text-align:center}
.st-c b,.st-c strong{font-weight:700}
.st-c ul{list-style:none;padding:0}
.st-c ul li{position:relative;padding-left:4.5mm}
.st-c ul li + li{margin-top:1.4mm}
.st-c ul li::before{content:'';position:absolute;left:0;top:.62em;width:1.6mm;height:1.6mm;border-radius:50%;background:var(--st-accent)}
.st-c ol{padding-left:5mm}
.st-c ol.steps{list-style:none;padding:0;counter-reset:st}
.st-c ol.steps li{counter-increment:st;position:relative;padding:2.6mm 0 2.6mm 11mm;border-bottom:1px solid var(--line)}
.st-c ol.steps li::before{content:counter(st);position:absolute;left:0;top:2mm;width:7.5mm;height:7.5mm;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font:800 12px/1 var(--f-display)}
.st-c ol.steps li.key::before{background:var(--st-accent);border-color:var(--st-accent);color:#fff}
.st-c ol.steps li .s{display:block}
.st-c .chips{display:flex;flex-wrap:wrap;gap:1.5mm}
.st-c .chip{display:inline-block;padding:.5mm 2.4mm;border-radius:99px;border:1px solid var(--line);font:600 10.5px/1.6 var(--f-ui);white-space:nowrap}
.st-c .tag{display:inline-block;padding:.6mm 2.6mm;border-radius:99px;background:var(--st-accent);color:#fff;font:700 9.5px/1.6 var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.st-c hr{border:0;border-top:1px solid var(--line);margin:1mm 0}
.st-c table{width:100%;border-collapse:collapse;font-size:11.5px;line-height:1.45;overflow-wrap:break-word}
.st-c th{text-align:left;padding:1.8mm 2mm;border-bottom:1px solid var(--line);font:700 9px/1.3 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);vertical-align:bottom}
.st-c td{padding:2mm;border-bottom:1px solid var(--line);vertical-align:top}
.st-c .num{text-align:right;font-variant-numeric:tabular-nums}
.st-c td.num{white-space:nowrap}
.st-c table.kv th{width:28%;text-transform:none;letter-spacing:0;font:600 11.5px/1.45 var(--f-ui);vertical-align:top}
.st-c table.kv td:first-child{color:var(--ink-3)}
.st-c table.price{font-size:10.5px}
.st-c table.price th{font-size:8.5px}
.st-c tr.sum td{font-weight:600}
.st-c tr.total td{font-weight:800;border-top:2px solid var(--ink);font-size:12px}
.st-c tr.group td{padding-top:3.5mm;background:var(--soft)}
.st-c table.res td:last-child{color:var(--st-ok)}
.st-c .words{font-size:12.5px}
.st-c .sign-space{height:22mm}
.st-c .img{display:flex;align-items:center;justify-content:flex-start;min-height:12mm;flex:1}
.st-c .img img{display:block;max-width:100%;height:auto;max-height:100%;object-fit:contain}
.st-t-image .st-c .img{justify-content:center;border-radius:2.5mm;overflow:hidden}
.st-t-image .st-c .img img{width:100%}
.st-c .img.cover img{width:100%;height:100%;object-fit:cover}
.st-c .img.logo img{max-height:15mm;width:auto}
.st-b[style*="--h"] .st-c .img img{max-height:calc(var(--h) - 10mm)}
.st-c .img.is-empty{border:1.5px dashed var(--line);border-radius:3mm;min-height:16mm;justify-content:center}
.st-c .img.is-empty::after{content:'Bấm đúp để chọn ảnh';font:500 11px/1.4 var(--f-ui);color:var(--ink-3)}
.st-c .img.is-empty img{display:none}
.st-t-spacer .st-c,.st-t-divider .st-c{justify-content:center}
.st-a4line,.st-ptools,.st-handle,.st-rw,.st-rh,.st-mini,.st-emptyhint{display:none}
body.st-export{margin:0;background:#E9ECF4}
body.st-export .st-page{margin:24px auto}
body.st-export .st-sheet{height:297mm;overflow:hidden;box-shadow:0 10px 40px rgba(14,20,48,.18)}
body.st-export .img.is-empty{display:none}
@page{size:A4;margin:0}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{margin:0;background:none!important}
  .st-page{margin:0!important;break-after:page;page-break-after:always}
  .st-page:last-child{break-after:auto;page-break-after:auto}
  .st-sheet{height:297mm!important;min-height:0!important;overflow:hidden!important;box-shadow:none!important}
  .img.is-empty{display:none!important}
}
/* == EDITOR == */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#E9ECF4;color:#0E1430;font:13px/1.45 var(--f-ui)}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid #D9DDE8;background:#fff;border-radius:8px;padding:6px 10px}
button:hover:not(:disabled){border-color:#9DB4F8;background:#F6F8FF}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--st-accent);border-color:var(--st-accent);color:#fff;font-weight:600}
button.primary:hover:not(:disabled){background:#4A7BF0;border-color:#4A7BF0}
button.danger{color:#C4313A}
input{font:inherit;border:1px solid #D9DDE8;border-radius:8px;padding:7px 9px;width:100%;background:#fff;color:inherit}
#st-app{display:grid;grid-template-columns:210px minmax(0,1fr) 312px;grid-template-rows:56px minmax(0,1fr);height:100vh}
.st-top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff;border-bottom:1px solid #E1E4EE}
.st-brand{font:800 15px/1 var(--f-display);white-space:nowrap}
.st-brand span{color:var(--st-accent)}
#st-title{max-width:360px;border-color:transparent;font-weight:600}
#st-title:hover,#st-title:focus{border-color:#D9DDE8}
#st-save{color:#6B7393;font-size:12px;white-space:nowrap}
.st-top-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.st-menu{position:relative}
.st-menu summary{list-style:none;cursor:pointer;border:1px solid #D9DDE8;border-radius:8px;padding:6px 10px;background:#fff}
.st-menu summary::-webkit-details-marker{display:none}
.st-menu > div{position:absolute;right:0;top:calc(100% + 6px);z-index:30;display:grid;gap:2px;min-width:230px;padding:6px;background:#fff;border:1px solid #E1E4EE;border-radius:10px;box-shadow:0 12px 30px rgba(14,20,48,.14)}
.st-menu > div button{border:0;text-align:left;border-radius:6px}
.st-left{grid-column:1;grid-row:2;overflow:auto;background:#fff;border-right:1px solid #E1E4EE;padding:12px 10px}
.st-left-h{display:flex;justify-content:space-between;align-items:center;margin:0 4px 8px;font:700 11px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:#6B7393}
.st-left-h button{padding:3px 9px}
#st-pagelist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
#st-pagelist li{display:grid;grid-template-columns:30px minmax(0,1fr);grid-template-rows:auto auto;column-gap:8px;align-items:center;padding:6px;border-radius:8px;cursor:grab;user-select:none;border:1px solid transparent}
#st-pagelist li:hover{background:#F4F6FB}
#st-pagelist li.is-cur{background:#EEF3FF;border-color:#C9D7FF}
#st-pagelist li.drop{outline:2px solid var(--st-accent)}
#st-pagelist li.st-dragging{opacity:.4}
.st-sw{grid-row:1/3;display:grid;place-items:center;width:30px;height:40px;border-radius:4px;font:700 11px/1 var(--f-display);border:1px solid #DDE2EE}
.st-sw[data-bg="dark"]{background:linear-gradient(165deg,#141C50,#070B1D);color:#fff;border-color:#141C50}
.st-sw[data-bg="light"]{background:#fff;color:#0E1430}
.st-pt{font-size:12px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.st-pover{grid-column:2;justify-self:start;font-size:10.5px;font-weight:700;color:#C4313A}
#st-canvas{grid-column:2;grid-row:2;overflow:auto;padding:30px 24px 120px;position:relative}
.st-right{grid-column:3;grid-row:2;overflow:auto;background:#fff;border-left:1px solid #E1E4EE}
.st-sec{padding:14px 14px 16px;border-bottom:1px solid #EEF0F5}
.st-sec h4{margin:0 0 10px;font:700 13px/1.3 var(--f-display);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.st-muted{color:#8A91AD;font:500 11.5px/1.3 var(--f-ui)}
.st-lbl{margin:12px 0 6px;font:600 11.5px/1.3 var(--f-ui);color:#454E70}
.st-hint{margin:8px 0 0;font-size:12px;color:#6B7393}
.st-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.st-row.st-sep{margin-top:14px;padding-top:12px;border-top:1px solid #EEF0F5}
.st-lib{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.st-libi{display:grid;justify-items:center;gap:4px;padding:8px 4px;font-size:11px;line-height:1.2;text-align:center;cursor:grab;touch-action:none}
.st-libi svg{width:22px;height:22px;fill:none;stroke:#454E70;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.st-libi svg .a{stroke:var(--st-accent)}
.st-libi svg circle{fill:#454E70;stroke:none}
.st-widths{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.st-widths button{display:grid;gap:4px;padding:6px 3px;font-size:11px;justify-items:center}
.st-widths i{display:block;width:100%;height:8px;border-radius:3px;background:linear-gradient(90deg,var(--st-accent) calc(var(--f)*100%),#E3E7F1 0)}
.st-styles,.st-bgs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.st-bgs{grid-template-columns:repeat(2,1fr)}
.st-styles button,.st-bgs button{display:grid;gap:5px;justify-items:center;padding:6px 3px;font-size:10.5px}
.st-swatch{display:grid;place-items:center;width:42px;height:32px;border-radius:5px;padding:4px}
.st-swatch[data-bg="dark"]{background:linear-gradient(165deg,#141C50,#070B1D);--card:rgba(255,255,255,.08);--card-line:rgba(255,255,255,.2);--accent-bg:rgba(91,140,255,.35);--accent-line:rgba(143,176,255,.7)}
.st-swatch[data-bg="light"]{background:#fff;border:1px solid #E3E7F1;--card:#F0F3FA;--card-line:#DCE1EC;--accent-bg:#E6EDFF;--accent-line:#BFD0FF}
.st-swatch b{display:block;width:100%;height:100%;border-radius:3px;padding:0!important;background-image:linear-gradient(currentColor,currentColor);background-size:60% 2px;background-repeat:no-repeat;background-position:30% 40%;color:#8C95BA}
.st-swatch b.st-s-plain{background-color:transparent}
.st-swatch b.st-s-line{border-left-width:2px}
.st-bgthumb{width:34px;height:46px;border-radius:4px;border:1px solid #DDE2EE}
.st-bgthumb[data-bg="dark"]{background:linear-gradient(165deg,#141C50,#070B1D)}
.st-bgthumb[data-bg="light"]{background:#fff}
.st-layouts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.st-layouts button{display:grid;justify-items:center;gap:4px;padding:6px 2px;font-size:10px;line-height:1.2;text-align:center}
.st-layouts svg{width:46px;height:64px}
.st-layouts svg rect{fill:#C9D7FF}
.st-layouts svg rect.pg{fill:#fff;stroke:#D9DDE8}
.st-widths button.on,.st-styles button.on,.st-bgs button.on,.st-layouts button.on{border-color:var(--st-accent);background:#EEF3FF;box-shadow:0 0 0 1px var(--st-accent)}
.st-fmt{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.st-fmt button{padding:5px 0;min-width:0}
.st-hlbtn{color:var(--st-accent);font-weight:800;text-decoration:underline 2px}
.st-check{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:12.5px}
.st-check input{width:auto}
.st-field{display:grid;gap:4px;margin-top:10px;font-size:12px;color:#454E70}
.st-checks{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.st-checks li{font-size:12px;line-height:1.45;padding:7px 9px;border-radius:7px;background:#FFF8EB;border:1px solid #F7DFAE}
.st-checks li.bad{background:#FFF0F0;border-color:#F5C2C4}
.st-checks li[data-goto-page],.st-checks li[data-goto-block]{cursor:pointer}
/* Trang trong trình soạn */
.st-sheet{box-shadow:0 10px 36px rgba(14,20,48,.16)}
.st-page.is-sel .st-sheet{box-shadow:0 0 0 2px var(--st-accent),0 10px 36px rgba(14,20,48,.16)}
.st-ptools{display:flex;position:absolute;left:0;right:0;bottom:calc(100% + 6px);align-items:center;gap:8px;font:600 11.5px/1 var(--f-ui);color:#6B7393}
.st-over{color:#C4313A;font-weight:700}
.st-fix{padding:3px 9px;font-size:11.5px;border-color:#F5C2C4;color:#C4313A}
.st-page.is-over .st-a4line{display:block;position:absolute;left:-8px;right:-8px;top:297mm;border-top:2px dashed #F0565B;pointer-events:none;z-index:4}
.st-a4line span{position:absolute;left:8px;top:4px;background:#F0565B;color:#fff;font:700 10.5px/1 var(--f-ui);padding:4px 7px;border-radius:4px}
.st-a4line button{position:absolute;right:8px;top:2px;pointer-events:auto;padding:3px 9px;font-size:11.5px;border-color:#F0565B;color:#C4313A;background:#fff}
.st-page.is-over .st-sheet{box-shadow:0 0 0 2px #F0565B,0 10px 36px rgba(14,20,48,.16)}
.st-emptyhint{display:block;grid-column:1/-1;padding:18mm 8mm;text-align:center;border:1.5px dashed var(--line);border-radius:4mm;color:var(--ink-3);font-size:13px}
.st-addpage{display:flex;justify-content:center;width:210mm;margin:0 auto}
.st-b:hover{outline:1px dashed rgba(91,140,255,.65);outline-offset:3px}
.st-b.is-sel{outline:2px solid var(--st-accent);outline-offset:3px}
.st-c[contenteditable]{cursor:text}
.st-handle{display:grid;place-items:center;position:absolute;left:-13px;top:-13px;width:24px;height:24px;padding:0;border-radius:50%;background:var(--st-accent);border:2px solid #fff;color:#fff;font-size:13px;line-height:1;cursor:grab;opacity:0;z-index:6;touch-action:none;box-shadow:0 2px 8px rgba(14,20,48,.25)}
.st-rw,.st-rh{display:block;position:absolute;z-index:6;border-radius:4px;background:var(--st-accent);border:2px solid #fff;opacity:0;touch-action:none;box-shadow:0 2px 6px rgba(14,20,48,.25)}
.st-rw{right:-7px;top:50%;width:10px;height:34px;margin-top:-17px;cursor:ew-resize}
.st-rh{bottom:-7px;left:50%;width:34px;height:10px;margin-left:-17px;cursor:ns-resize}
.st-mini{display:flex;position:absolute;right:4px;top:-15px;gap:3px;z-index:7;opacity:0;pointer-events:none}
.st-mini button{padding:2px 7px;font-size:12px;line-height:1.3;background:#fff;box-shadow:0 2px 8px rgba(14,20,48,.2)}
.st-b:hover > .st-handle,.st-b.is-sel > .st-handle,.st-b:hover > .st-rw,.st-b.is-sel > .st-rw,.st-b:hover > .st-rh,.st-b.is-sel > .st-rh{opacity:1}
.st-b.is-sel > .st-mini{opacity:1;pointer-events:auto}
.st-b.st-dragging{opacity:.35}
.st-t-spacer .st-c{min-height:6mm;background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(91,140,255,.08) 6px 12px);border-radius:2mm}
body.st-dragging-on,body.st-dragging-on *{cursor:grabbing!important;user-select:none!important}
body.st-resizing-w,body.st-resizing-w *{cursor:ew-resize!important;user-select:none!important}
body.st-resizing-h,body.st-resizing-h *{cursor:ns-resize!important;user-select:none!important}
#st-drop{position:fixed;z-index:60;background:var(--st-accent);border-radius:3px;pointer-events:none;box-shadow:0 0 0 3px rgba(91,140,255,.25)}
#st-ghost,#st-tip{position:fixed;z-index:61;pointer-events:none;padding:5px 9px;border-radius:7px;background:#0E1430;color:#fff;font:600 12px/1.2 var(--f-ui);white-space:nowrap;box-shadow:0 6px 18px rgba(14,20,48,.3)}
#st-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:70;max-width:min(560px,90vw);padding:10px 14px;border-radius:10px;background:#0E1430;color:#fff;font-size:13px;box-shadow:0 10px 30px rgba(14,20,48,.3)}
#st-dialog{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(14,20,48,.45);padding:16px}
#st-dialog[hidden]{display:none}
.st-dlg{width:min(520px,100%);max-height:80vh;overflow:auto;background:#fff;border-radius:14px;padding:20px;box-shadow:0 24px 60px rgba(14,20,48,.35)}
.st-dlg h3{margin:0 0 10px;font:800 17px/1.3 var(--f-display)}
.st-dlg-body{font-size:13.5px;line-height:1.55;color:#454E70}
.st-dlg-b{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:18px}
.st-doclist{display:grid;gap:6px}
.st-docrow{display:grid;grid-template-columns:1fr auto;gap:6px}
.st-docrow.cur .st-docopen{border-color:var(--st-accent)}
.st-docopen,.st-recent{display:grid;gap:2px;text-align:left;width:100%}
.st-docopen span,.st-recent span{font-size:11.5px;color:#6B7393}
.st-welcome{max-width:560px;margin:8vh auto;padding:28px;background:#fff;border-radius:16px;box-shadow:0 10px 36px rgba(14,20,48,.12)}
.st-welcome h1{margin:0 0 6px;font:800 26px/1.2 var(--f-display)}
.st-welcome p,.st-welcome li{color:#454E70;line-height:1.6}
.st-welcome .st-row{margin-top:16px}
#st-recent{display:grid;gap:6px;margin-top:18px}
#st-recent h4{margin:0;font:700 12px/1 var(--f-display);color:#6B7393;text-transform:uppercase;letter-spacing:.1em}
body.st-empty .st-left,body.st-empty .st-right{visibility:hidden}
body.st-preview #st-app{grid-template-columns:0 minmax(0,1fr) 0}
body.st-preview .st-left,body.st-preview .st-right,body.st-preview .st-ptools,body.st-preview .st-addpage,body.st-preview .st-handle,body.st-preview .st-rw,body.st-preview .st-rh,body.st-preview .st-mini,body.st-preview .st-a4line{display:none!important}
body.st-preview .st-b{outline:none!important}
body.st-preview .st-t-spacer .st-c{background:none}
body.st-preview .img.is-empty{visibility:hidden}
@media (max-width:1180px){#st-app{grid-template-columns:0 minmax(0,1fr) 300px}.st-left{display:none}}
@media (max-width:860px){#st-app{grid-template-columns:minmax(0,1fr);grid-template-rows:56px minmax(0,1fr) 42vh}#st-canvas{grid-column:1}.st-right{grid-column:1;grid-row:3;border-left:0;border-top:1px solid #E1E4EE}#st-canvas{padding:24px 8px 80px}.st-page,.st-addpage{zoom:.5}#st-title{display:none}}
@media print{
  #st-app{display:block;height:auto}
  .st-top,.st-left,.st-right,.st-ptools,.st-handle,.st-rw,.st-rh,.st-mini,.st-a4line,.st-emptyhint,.st-addpage,#st-dialog,#st-toast,#st-drop,#st-ghost,#st-tip{display:none!important}
  #st-canvas{overflow:visible;padding:0}
  .st-b{outline:none!important}
  .st-t-spacer .st-c{background:none!important}
  body.st-preview #st-app{display:block}
}
</style>
</head>
<body>
<div id="st-app">
  <header class="st-top">
    <div class="st-brand">Quote <span>Studio</span></div>
    <input id="st-title" aria-label="Tên tài liệu" placeholder="Tên tài liệu">
    <span id="st-save" aria-live="polite"></span>
    <div class="st-top-actions">
      <button type="button" id="st-undo" title="Hoàn tác (⌘Z / Ctrl+Z)" aria-label="Hoàn tác" disabled>↶</button>
      <button type="button" id="st-redo" title="Làm lại (⇧⌘Z / Ctrl+Y)" aria-label="Làm lại" disabled>↷</button>
      <button type="button" id="st-preview">Xem trước</button>
      <details class="st-menu" id="st-menu"><summary>Tệp</summary><div>
        <button type="button" data-file="docs">Tài liệu đã lưu…</button>
        <button type="button" data-file="new">Tài liệu trống</button>
        <button type="button" data-file="open">Mở file dự án (.json)…</button>
        <button type="button" data-file="save">Lưu file dự án (.json)</button>
        <button type="button" data-file="html">Tải bản HTML</button>
      </div></details>
      <button type="button" id="st-pdf" class="primary">Xuất PDF</button>
    </div>
  </header>
  <aside class="st-left"><div class="st-left-h">Trang <button type="button" id="st-add-page" title="Thêm trang">＋</button></div><ol id="st-pagelist"></ol></aside>
  <main id="st-canvas"><div id="st-pages"></div></main>
  <aside class="st-right" id="st-panel"></aside>
</div>
<div id="st-drop" hidden></div><div id="st-ghost" hidden></div><div id="st-tip" hidden></div>
<div id="st-toast" role="status" hidden></div>
<div id="st-dialog" hidden></div>
<input type="file" id="st-file-img" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>
<input type="file" id="st-file-json" accept="application/json,.json" hidden>

  image:{name:'Ảnh',w:6,style:'plain',html:'<div class="img" contenteditable="false"><img alt=""></div><p class="s">Chú thích ảnh</p>'},

const ST_STYLES=[['plain','Trơn'],['card','Thẻ'],['white','Thẻ sáng'],['accent','Nổi bật'],['line','Viền nhấn']];
const ST_WIDTHS=[[3,'¼'],[4,'⅓'],[6,'½'],[8,'⅔'],[9,'¾'],[12,'Cả hàng']];
// Bố cục trang: độ rộng (trên 12 cột) gán lần lượt cho các block; phần tử đầu là block đầu, phần còn lại lặp vòng.
const ST_LAYOUTS=[
  {id:'one',name:'Một cột',spans:[12]},
  {id:'two',name:'Hai cột',spans:[6]},
  {id:'three',name:'Ba cột',spans:[4]},
  {id:'h2',name:'Tiêu đề + hai cột',spans:[12,6]},
  {id:'h3',name:'Tiêu đề + ba cột',spans:[12,4]},
  {id:'hm',name:'Tiêu đề + chỉ số + nội dung',spans:[12,4,4,4,12]},
  {id:'main',name:'Nội dung chính + phụ',spans:[12,8,4]},
  {id:'side',name:'Phụ + nội dung chính',spans:[12,4,8]},
];
const ST_FIXED=new Set(['divider','spacer']);
function stLayoutSpans(layout,blocks){
  const s=layout.spans;let i=0;
  return blocks.map(b=>{if(ST_FIXED.has(b.type))return 12;const w=s.length===1?s[0]:i===0?s[0]:s[1+(i-1)%(s.length-1)];i++;return w;});
}
// Hình thu nhỏ của bố cục: 5 block giả, xếp theo hàng 12 cột.
function stLayoutThumb(layout){
  const W=60,H=84,pad=6,gap=2,col=(W-2*pad-11*gap)/12,blocks=Array.from({length:5},(_,i)=>({type:'x',i}));
  const spans=stLayoutSpans(layout,blocks);let x=0,y=pad,rowH=0,out='';
  spans.forEach((sp,i)=>{
    if(x+sp>12){x=0;y+=rowH+gap;rowH=0;}
    const h=i===0&&layout.spans.length>1?9:sp===12?12:16;
    out+=`<rect x="${(pad+x*(col+gap)).toFixed(1)}" y="${y}" width="${(sp*col+(sp-1)*gap).toFixed(1)}" height="${h}" rx="1.5"/>`;
    x+=sp;rowH=Math.max(rowH,h);
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><rect class="pg" x=".5" y=".5" width="${W-1}" height="${H-1}" rx="3"/>${out}</svg>`;
}

let stSeq=0;
const stId=p=>p+Date.now().toString(36)+(stSeq++).toString(36)+Math.floor(Math.random()*1296).toString(36);
function stNewBlock(type,extra={}){const t=ST_TYPES[type]||ST_TYPES.text;return {id:stId('b'),type,w:t.w,style:t.style,h:t.h||0,html:t.html,...extra};}
function stNewPage(bg='light',blocks=[],extra={}){return {id:stId('p'),bg,chrome:true,blocks,...extra};}

const stE=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stNf=(n,d=0)=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:d}).format(n);
const stMoney=n=>stNf(Math.round(n))+' đ';
const stBig=n=>Math.abs(n)>=1e9?stNf(n/1e9,2)+' tỷ đồng':stNf(n/1e6,1)+' triệu đồng';
const stShort=n=>Math.abs(n)>=1e9?stNf(n/1e9,2)+' tỷ đ':stNf(n/1e6,1)+' tr đ';
const stLc=s=>String(s).charAt(0).toLowerCase()+String(s).slice(1);
// Số tiền thành chữ tiếng Việt (cùng thuật toán với qdWords của báo giá cũ).
function stWords(value){
  let n=Math.round(Math.abs(value));if(!n)return 'Không đồng';
  const d=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'],units=['','nghìn','triệu','tỷ','nghìn tỷ','triệu tỷ'];
  const three=(x,full)=>{const h=Math.floor(x/100),t=Math.floor(x%100/10),u=x%10,w=[];
    if(full||h)w.push(d[h]+' trăm');
    if(t>1){w.push(d[t]+' mươi');if(u===1)w.push('mốt');else if(u===4)w.push('tư');else if(u===5)w.push('lăm');else if(u)w.push(d[u]);}
    else if(t===1){w.push('mười');if(u===5)w.push('lăm');else if(u)w.push(d[u]);}
    else if(u){if(full||h)w.push('lẻ');w.push(d[u]);}
    return w.join(' ');};
  const groups=[];while(n>0){groups.push(n%1000);n=Math.floor(n/1000);}
  const out=[];
  for(let i=groups.length-1;i>=0;i--){if(!groups[i])continue;out.push(three(groups[i],i<groups.length-1)+(units[i]?' '+units[i]:''));}
  const s=(value<0?'âm ':'')+out.join(' ')+' đồng';
  return s.charAt(0).toUpperCase()+s.slice(1);
}

const stB=(type,html,w,style,extra={})=>({id:stId('b'),type,w:w??ST_TYPES[type].w,style:style??ST_TYPES[type].style,h:0,html,...extra});
const stHead=(eyebrow,h,lead)=>stB('heading',`<p class="eyebrow">${stE(eyebrow)}</p><h2>${stE(h)}</h2>${lead?`<p class="lead">${stE(lead)}</p>`:''}`);
const stTable=(head,rows,cls='')=>`<table${cls?` class="${cls}"`:''}><thead><tr>${head.map(h=>`<th${h.num?' class="num"':''}>${stE(h.t??h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${head[i]?.num?' class="num"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const stSpan=n=>n<=1?12:n===2?6:4;
const stClean=s=>s&&!/^\[.*\]$/.test(String(s).trim());

// Tên dòng gói và mức nhân sự.
function stLineName(l,scopeNames){return (l.addon?'Add-on ':l.scope==='combo'?'':(scopeNames[l.scope]||l.scope)+' · ')+l.name+(l.lite?' Lite':'');}
function stPs(r){return r?.ps?.items?.length?r.ps:null;}
function stPeople(r){return (r.staff||[]).filter(g=>g.count>0).reduce((s,g)=>s+g.count,0);}

// Các block lấy số liệu từ phương án: dựng lại được khi Quote Lab gửi số mới.
function stSummaryMetrics(ctx){
  const {rec,years,valYear,valCash,payback}=ctx,r=rec.r,out=[],ps=stPs(r),people=stPeople(r);
  out.push([`Đầu tư ${years} năm, thanh toán trước`,stShort(r.total),`phần mềm ${stMoney(r.monthly)} mỗi tháng${ps?.gross?', cộng dịch vụ triển khai':''}`]);
  const pb=payback(rec);
  if(pb)out.push([valCash(rec)?'Hoàn vốn, chỉ tính tiền mặt':'Hoàn vốn ước tính',`~${pb} tháng`,`hiệu quả khoảng ${stBig(valYear(rec)||valCash(rec))} mỗi năm`]);
  if(people)out.push(['Người dùng',stNf(people)+' người',(r.staff||[]).filter(g=>g.count>0).map(g=>`${g.name} ${stNf(g.count)}`).join(' · ')]);
  if(out.length<3)out.push(['Kỳ hạn',`${years} năm`,'thanh toán trước toàn bộ']);
  return out.slice(0,3).map(([k,v,s])=>`<p class="k">${stE(k)}</p><p class="v">${stE(v)}</p><p class="s">${stE(s)}</p>`);
}
function stOptionHTML(o,i,ctx){
  const r=o.r,isRec=o.id===ctx.rec.id&&ctx.opts.length>1,ps=stPs(r),{scopeNames}=ctx;
  const chips=r.lines.filter(l=>l.scope!=='usage').map(l=>`<span class="chip">${stE((l.addon?'+ ':l.scope==='combo'?'':(scopeNames[l.scope]||l.scope)+' ')+l.name+(l.lite?' Lite':''))}</span>`).join(' ');
  const rows=[['Phần mềm mỗi tháng',stMoney(r.monthly)],[`Phần mềm ${r.years*12} tháng`,stMoney(r.software)+(r.discountAmount?` (đã trừ chiết khấu ${stNf(r.discount,1)}%)`:'')]];
  if(ps?.gross)rows.push(['Dịch vụ triển khai (PS)',stMoney(ps.gross)+' · một lần, gồm VAT']);
  if(r.serviceFee)rows.push(['Phí dịch vụ khác',stMoney(r.serviceFee)]);
  if(ctx.valYear(o))rows.push(['Hiệu quả mỗi năm',stShort(ctx.valYear(o))+(ctx.valCash(o)?` (${stShort(ctx.valCash(o))} tiền mặt)`:'')]);
  const pb=ctx.payback(o);if(pb)rows.push([ctx.valCash(o)?'Hoàn vốn, tiền mặt':'Hoàn vốn',`~${pb} tháng`]);
  rows.push(['Kỳ hạn',`${r.years} năm`]);
  return `<p class="eyebrow">Phương án ${i+1}${isRec?' · Khuyến nghị':''}</p><h3>${stE(o.label)}</h3>${o.solves?`<p class="s">${stE(o.solves)}</p>`:''}<p class="chips">${chips}</p><p class="v">${stE(stShort(r.total))}</p><p class="s">tổng ${r.years} năm${ps?.gross||r.serviceFee?', gồm dịch vụ triển khai':''}</p><table class="kv"><tbody>${rows.map(([k,v])=>`<tr><td>${stE(k)}</td><td class="num">${stE(v)}</td></tr>`).join('')}</tbody></table>`;
}
function stPsHTML(rec){
  const ps=stPs(rec.r);if(!ps)return '';
  const qty=x=>x.qty?`${stNf(x.qty)} × ${x.pack||'buổi'}`:x.sessions?`${x.sessions} buổi`:x.sessionsText||'Theo chính sách';
  return `<h3>Dịch vụ triển khai đi kèm · tính một lần</h3>`+stTable(['Dịch vụ','Khối lượng','Phạm vi chính'],ps.items.map(x=>[stE(x.name),stE(qty(x))+(x.agents?`<br>tối đa ${x.agents} Agents`:''),stE((x.scope||[]).join(' · ')||(x.pack?'Mua thêm · '+x.pack:''))]));
}
function stPriceHTML(ctx){
  const {rec,deal:d,scopeNames}=ctx,r=rec.r,months=r.years*12,ps=stPs(r),q=d.quote||{};
  const start=q.serviceStart||'[Chưa xác nhận]',end=q.serviceEnd||'[Chưa xác nhận]';
  const row=(cells,cls='')=>`<tr${cls?` class="${cls}"`:''}>${cells}</tr>`;
  const sum=(label,val,cls='')=>row(`<td colspan="6">${stE(label)}</td><td class="num">${val}</td>`,'sum'+(cls?' '+cls:''));
  let body=r.lines.map(l=>row(`<td>${stE(l.scope==='combo'?'Base Combo':scopeNames[l.scope]||l.scope)}</td><td>${stE(l.name+(l.lite?' Lite':''))}</td><td>${l.lite?'15 TK (Lite)':l.fixedPrice?'1 gói':stNf(l.seats)+' TK'}</td><td>${stE(start)}</td><td>${stE(end)}</td><td class="num">${stNf(l.monthly)}</td><td class="num">${stNf(l.monthly*months)}</td>`)).join('');
  body+=sum(`Cộng phần mềm ${months} tháng theo giá niêm yết`,stNf(r.listPrice));
  body+=sum('Ưu đãi (nếu có)'+(r.discountAmount?` · Chiết khấu phần mềm ${stNf(r.discount,1)}%`:''),r.discountAmount?'−'+stNf(r.discountAmount):'Không');
  for(const offer of d.offers?.items||[])body+=sum('Ưu đãi có điều kiện: '+offer.offer+(offer.commit?' · '+offer.commit:''),stE(offer.value||'Theo điều kiện'));
  if(r.discountAmount)body+=sum('Cộng phần mềm sau chiết khấu',stNf(r.software));
  if(ps){
    body+=row(`<td colspan="7"><b>Dịch vụ triển khai (Professional Service) · tính một lần</b></td>`,'group');
    body+=ps.items.map(x=>row(`<td>${stE(x.name)}</td><td>${stE(x.pack||'Triển khai')}</td><td>${stE(x.qty?stNf(x.qty)+' gói':x.sessions?x.sessions+' buổi':'1 gói')}</td><td colspan="3">Một lần</td><td class="num">${x.waived?'Miễn phí':stNf(x.net)}</td>`)).join('');
    body+=sum('Cộng dịch vụ triển khai trước VAT',stNf(ps.net));
    if(ps.vat)body+=sum(`VAT ${stNf(ps.vat/ps.net*100)}% dịch vụ triển khai`,stNf(ps.vat));
  }
  if(r.serviceFee)body+=sum('Phí dịch vụ khác (đã gồm thuế nếu có)',stNf(r.serviceFee));
  body+=sum('Tổng giá trị hợp đồng',stNf(r.total),'total');
  return `<table class="price"><thead><tr><th>Gói sản phẩm</th><th>Gói dịch vụ</th><th>Số lượng tài khoản</th><th>Ngày bắt đầu</th><th>Ngày hết hạn</th><th class="num">Chi phí / tháng (VNĐ)</th><th class="num">Thành tiền (VNĐ)</th></tr></thead><tbody>${body}</tbody></table><p class="words"><b>Bằng chữ:</b> ${stE(stWords(r.total))}.</p><p class="s">Ghi chú: Kỳ hạn ${r.years} năm (${months} tháng); thanh toán trước toàn bộ. Chi phí / tháng là tổng phí của số tài khoản trên từng dòng. ${stE(q.note||'Ngày bắt đầu và ngày hết hạn dịch vụ được xác nhận khi ký hợp đồng.')}</p>`;
}

function stContext(payload){
  const d=payload.deal||{},opts=(payload.options||[]).filter(o=>o&&o.r);
  if(!opts.length)throw new Error('Chưa có phương án nào để dựng báo giá.');
  const rec=opts.find(o=>o.id===payload.recommendedId)||opts[0];
  const valYear=o=>(+o.valueYear>0?+o.valueYear:0)*1e6,valCash=o=>(+o.valueCash>0?+o.valueCash:0)*1e6;
  const payback=o=>{const v=valCash(o)||valYear(o);return v?Math.max(1,Math.round(o.r.total/(v/12))):null;};
  const c=d.customer||{};
  return {d,deal:d,opts,rec,years:rec.r.years,valYear,valCash,payback,scopeNames:payload.scopeNames||{},policy:payload.policy||{},short:c.short||c.name||'khách hàng',useCases:(payload.useCases||[]).filter(Boolean)};
}

// Dựng tài liệu Studio từ dữ liệu Quote Lab. Mục thiếu dữ liệu thì bỏ trang đó.
function stBuildDoc(payload,{baseLogo=''}={}){
  const ctx=stContext(payload),{d,opts,rec,years,short}=ctx,q=d.quote||{},c=d.customer||{},prep=d.preparer||{},msg=d.message||{};
  const pages=[],P=(bg,blocks,extra)=>{if(blocks.length)pages.push(stNewPage(bg,blocks,extra));};
  const assets={};if(baseLogo)assets['base-logo']=baseLogo;
  const logo=(id,w)=>stB('logo',`<div class="img logo" contenteditable="false"><img alt="" data-asset="${id||''}"></div>`,w,'plain');

  // 1. Bìa
  const recips=(d.recipients||[]).map(x=>stE([x.name,x.title].filter(Boolean).join(', '))).join('<br>');
  P('dark',[
    ...(q.tag?[stB('text',`<p><span class="tag">${stE(q.tag)}</span></p>`,12,'plain')]:[]),
    stB('cover',`<h1>${stE(msg.title||'Đề xuất giải pháp cho '+short)}${msg.highlight?` <span class="hl">${stE(msg.highlight)}</span>`:''}</h1><p class="lead">${stE(msg.lead||`Đề xuất giải pháp và báo giá Base 2.0 cho ${c.name||short}.`)}</p>`,12,'plain'),
    stB('spacer','',12,'plain',{h:18}),
    ...(recips?[stB('text',`<p class="k">Kính gửi</p><p>${recips}</p>`,6,'plain')]:[]),
    stB('text',`<p class="k">Người lập</p><p>${stE(prep.name||'[Tên chuyên viên tư vấn]')}<br>${stE([prep.phone,prep.email].filter(Boolean).join(' · ')||'[Số điện thoại · Email]')}</p>${q.validText?`<p class="k" style="margin-top:3mm">Hiệu lực</p><p>Đến hết ngày ${stE(q.validText)}</p>`:''}`,6,'plain'),
    logo('base-logo',4),stB('spacer','',4,'plain'),logo('',4),
  ],{chrome:true,role:'cover'});

  // 2. Tóm tắt
  const pb=ctx.payback(rec),rows=[];
  if(c.context)rows.push(['Bối cảnh',c.context]);
  if(c.goal)rows.push(['Mục tiêu',c.goal]);
  rows.push(['Phương án khuyến nghị',`${rec.label}: ${rec.r.lines.filter(l=>!l.addon&&l.scope!=='usage').map(l=>stLineName(l,ctx.scopeNames)).join(', ')}.`]);
  const tl=d.timeline?.items||[],steps=d.steps?.items||[];
  if(tl.length){const ms=tl.filter(x=>x.milestone);rows.push(['Thời gian',`Bắt đầu ${tl[0].startText}${ms.length?'; '+ms.map(m=>`${stLc(m.name)} ${m.startText}`).join(', '):''}.`]);}
  if(steps.length)rows.push(['Bước tiếp theo',`${steps[0].task}${steps[0].dateText?' ngày '+steps[0].dateText:''}.`]);
  P('dark',[
    stHead('Tóm tắt điều hành',pb?`Đầu tư ${stBig(rec.r.total)} cho ${years} năm, hoàn vốn trong khoảng ${pb} tháng.`:`Đầu tư ${stBig(rec.r.total)} cho ${years} năm với phương án ${rec.label}.`,`Chúng tôi khuyến nghị phương án ${rec.label}.`),
    ...stSummaryMetrics(ctx).map((h,i)=>stB('metric',h,4,'card',{src:'metric:'+i})),
    stB('table',`<table class="kv"><tbody>${rows.map(([k,v])=>`<tr><th>${stE(k)}</th><td>${stE(v)}</td></tr>`).join('')}</tbody></table>`,12,'card',{src:'summary-rows'}),
  ]);

  // 3. Hiện trạng
  const pains=d.pains?.items||[],costs=d.costs?.items||[];
  if(pains.length||costs.length){
    const costSum=costs.reduce((s,x)=>s+(x.amount||0),0)*1e6;
    const blocks=[stHead('Hiện trạng',d.pains?.heading||d.costs?.heading||(costSum?`Mỗi năm ${short} trả khoảng ${stBig(costSum)} cho cách vận hành hiện tại.`:`${pains.length} vấn đề ${short} cần giải quyết.`),d.pains?.lead||(pains.length?`${pains.length} vấn đề ghi nhận${d.pains?.source?' qua '+d.pains.source:''}, bằng lời của chính đội ngũ ${short}.`:''))];
    pains.forEach((p,i)=>blocks.push(stB('card',`<p class="no">${i+1}</p><h3>${stE(p.title)}</h3>${p.quote?`<p class="q">“${stE(p.quote)}”</p>`:''}${p.who?`<p class="s">${stE(p.who)}</p>`:''}${p.fact?`<p>${stE(p.fact)}</p>`:''}`,6,'card')));
    if(costs.length)blocks.push(stB('table',`<h3>Cái giá mỗi năm, ước tính thận trọng</h3>`+stTable(['Hạng mục','Cách tính',{t:'Ước tính mỗi năm',num:true}],[...costs.map(x=>[stE(x.item),stE(x.method),x.amount===null?'—':stE(stShort(x.amount*1e6))+(x.cash?' (tiền mặt)':'')]),['<b>Tổng</b>','',`<b>${stE(stShort(costSum))}</b>`]])+(d.costs?.note?`<p class="s">${stE(d.costs.note)}</p>`:''),12,'plain'));
    P('light',blocks);
  }

  // 4. Mục tiêu
  const k=d.mainKpi,kpis=d.kpis?.items||[];
  if(k||kpis.length){
    const unit=k?.unit?' '+k.unit:'';
    const blocks=[stHead('Mục tiêu và tiêu chí thành công',k?.heading||(k?`Đưa ${stLc(k.name)} từ ${k.current} về ${k.target}${unit}.`:'Thành công được đo bằng các chỉ số hai bên đã thống nhất.'),k?.lead||'')];
    if(k){blocks.push(stB('metric',`<p class="k">Hôm nay</p><p class="v bad">${stE(k.current+unit)}</p><p class="s">${stE(k.name)}</p>`,6,'card'));blocks.push(stB('metric',`<p class="k">Mục tiêu</p><p class="v ok">${stE(k.target+unit)}</p><p class="s">${k.threshold!==null&&k.threshold!==undefined?stE((k.thresholdLabel||'Ngưỡng')+': '+k.threshold+unit):stE(k.name)}</p>`,6,'card'));}
    if(kpis.length)blocks.push(stB('table',`<h3>${stE(d.kpis.when?'Chỉ số đo '+d.kpis.when:'Chỉ số thành công')}${d.kpis.confirmed?` <span class="tag">Đã xác nhận ${stE(d.kpis.confirmed)}</span>`:''}</h3>`+stTable(['Chỉ số','Hiện tại','Mục tiêu','Người theo dõi'],kpis.map(x=>[stE(x.name),stE(x.current),stE(x.target),stE(x.owner)]))+(d.kpis.note?`<p class="s">${stE(d.kpis.note)}</p>`:''),12,'white'));
    P('dark',blocks);
  }

  // 5. Giải pháp
  const sols=d.solutions?.items||[];
  if(sols.length){
    const blocks=[stHead('Giải pháp đề xuất',d.solutions.heading||'Mỗi hạng mục nối thẳng về một vấn đề; hạng mục nào không nối được đã bỏ ra.','')];
    blocks.push(stB('table',stTable(['Vấn đề','Giải pháp trên Base 2.0','Kết quả đo được'],sols.map(s=>[`${s.no?`<b>${stE(s.no)}.</b> `:''}${stE(s.problem)}`,`${s.apps.length?`<span class="chips">${s.apps.map(a=>`<span class="chip">${stE(a)}</span>`).join(' ')}</span><br>`:''}${stE(s.desc)}`,s.result?'✓ '+stE(s.result):''])),12,'plain'));
    if(d.solutions.excluded)blocks.push(stB('note',`<p><b>Chưa đưa vào đợt này:</b> ${stE(d.solutions.excluded)}</p>`,12,'line'));
    P('light',blocks);
  }

  // 6. Use-case
  const ucs=ctx.useCases;
  if(ucs.length){
    const shown=u=>u.public?u.name:`Một doanh nghiệp ${stLc(u.industry||'cùng nhóm ngành')}`;
    const blocks=[stHead('Doanh nghiệp đã làm được',ucs.length===1?`${shown(ucs[0])} đã giải bài toán tương tự trên Base.`:`${ucs.length} doanh nghiệp đã giải bài toán tương tự trên Base.`,'Kết quả do chính doanh nghiệp ghi nhận sau khi vận hành trên Base.')];
    for(const u of ucs){
      const meta=[u.public?u.industry:'',u.size,u.duration?'triển khai '+u.duration:''].filter(Boolean).join(' · ');
      const res=(u.results||[]).map(r=>r.metric?`<tr><td>${stE(r.metric)}</td><td>${stE(r.before)}</td><td><b>${stE(r.after)}</b></td></tr>`:`<tr><td colspan="3">${stE(r.text)}</td></tr>`).join('');
      const role=u.public?u.who:(String(u.who||'').includes('·')?u.who.split('·').slice(1).join('·').trim():'');
      const ref=[u.reference?'Người tham chiếu: '+u.reference:'',u.source?'Nguồn: '+u.source:''].filter(Boolean).join(' · ');
      blocks.push(stB('card',`<h3>${stE(shown(u))}</h3>${meta?`<p class="s">${stE(meta)}</p>`:''}${u.problem?`<p class="k">Bài toán</p><p>${stE(u.problem)}</p>`:''}${u.apps?.length||u.solution?`<p class="k">Cách làm trên Base</p>${u.apps?.length?`<p class="chips">${u.apps.map(a=>`<span class="chip">${stE(a)}</span>`).join(' ')}</p>`:''}${u.solution?`<p>${stE(u.solution)}</p>`:''}`:''}${res?`<p class="k">Kết quả</p><table class="res"><thead><tr><th>Chỉ số</th><th>Trước</th><th>Sau</th></tr></thead><tbody>${res}</tbody></table>`:''}${u.quote?`<p class="q">“${stE(u.quote)}”</p>${role?`<p class="s">${stE(role)}</p>`:''}`:''}${ref?`<p class="s">${stE(ref)}</p>`:''}`,ucs.length===1?12:6,'white'));
    }
    P('dark',blocks);
  }

  // 7. Phạm vi và lộ trình
  const inScope=d.inScope||[],outScope=d.outScope||[],duties=d.duties||[],gates=d.gates||[];
  if(tl.length||inScope.length||outScope.length||duties.length||gates.length){
    const blocks=[stHead(tl.length?'Phạm vi và lộ trình triển khai':'Phạm vi triển khai',d.timeline?.heading||'Phạm vi triển khai và trách nhiệm của hai bên.',d.timeline?.lead||'')];
    if(tl.length)blocks.push(stB('table',stTable(['Giai đoạn','Thời gian','Ghi chú'],tl.map(x=>[`${x.key?'<b>':''}${stE(x.name)}${x.key?'</b>':''}`,stE(x.milestone?x.startText:`${x.startText} – ${x.endText}`),x.milestone?'Mốc':''])),12,'plain'));
    const lists=[['Trong phạm vi',inScope],['Ngoài phạm vi (báo giá riêng khi cần)',outScope],[`${short} phối hợp`,duties]].filter(([,a])=>a.length);
    for(const [t,a] of lists)blocks.push(stB('list',`<h3>${stE(t)}</h3><ul>${a.map(x=>`<li>${stE(x)}</li>`).join('')}</ul>`,stSpan(lists.length),'card'));
    for(const g of gates)blocks.push(stB('card',`<p class="k">${stE(g.title)}</p><p>${stE(g.text)}</p>`,stSpan(gates.length),'line'));
    P('light',blocks);
  }

  // 8. Phương án đầu tư
  {
    const cheaper=opts.filter(o=>o!==rec&&o.r.total<rec.r.total).sort((a,b)=>b.r.total-a.r.total)[0];
    let lead=rec.why||'';
    if(!lead&&cheaper){const extra=ctx.valYear(rec)-ctx.valYear(cheaper);lead=`So với phương án ${opts.indexOf(cheaper)+1}, phương án ${opts.indexOf(rec)+1} tốn thêm ${stBig(rec.r.total-cheaper.r.total)}${extra>0?` nhưng mang thêm hiệu quả khoảng ${stBig(extra)} mỗi năm`:''}.`;}
    if(!lead)lead=`Tổng đầu tư ${stBig(rec.r.total)} cho ${years} năm, thanh toán trước toàn bộ phí phần mềm.`;
    const blocks=[stHead('Phương án đầu tư',opts.length>1?`Khuyến nghị phương án ${opts.indexOf(rec)+1}: ${rec.label}.`:`Phương án đề xuất: ${rec.label}.`,lead)];
    opts.forEach((o,i)=>blocks.push(stB('card',stOptionHTML(o,i,ctx),stSpan(opts.length),o===rec&&opts.length>1?'accent':'card',{src:'option:'+o.id})));
    const anyPs=opts.some(o=>stPs(o.r)?.gross);
    blocks.push(stB('text',`<p class="s">Giá theo Chính sách giá Base 2.0${ctx.policy.effective?' hiệu lực '+stE(ctx.policy.effective):''}: phần mềm không cộng VAT${anyPs?', dịch vụ triển khai (Professional Service) tính một lần và cộng VAT':''}, phí dịch vụ khác đã gồm thuế nếu có, thanh toán trước toàn bộ kỳ hạn.</p>`,12,'plain'));
    if(stPs(rec.r))blocks.push(stB('table',stPsHTML(rec),12,'white',{src:'ps'}));
    for(const o of opts)if(o!==rec&&o.why)blocks.push(stB('card',`<h3>Vì sao chưa chọn phương án ${opts.indexOf(o)+1}</h3><p>${stE(o.why)}</p>`,6,'card'));
    P('dark',blocks);
  }

  // 9. Đội ngũ, rủi ro
  const team=d.team||[],risks=d.risks?.items||[],cases=ucs.length?[]:d.cases||[];
  if(team.length||risks.length||cases.length){
    const blocks=[stHead(cases.length?'Bằng chứng, đội ngũ và cam kết':'Đội ngũ và cam kết',d.risks?.heading||(risks.length?'Mọi rủi ro chính đều đã có cách xử lý từ trước.':'Đội ngũ phụ trách triển khai và đồng hành sau triển khai.'),'')];
    for(const x of cases)blocks.push(stB('card',`<h3>${stE(x.title)}</h3><p>${stE(x.text)}</p>`,stSpan(cases.length),'card'));
    if(team.length)blocks.push(stB('table',`<h3>Đội ngũ phụ trách</h3>`+stTable(['Vai trò','Người phụ trách','Trách nhiệm'],team.map(x=>[stE(x.role),stE(x.person),stE(x.duty)])),12,'plain'));
    if(risks.length)blocks.push(stB('table',`<h3>Rủi ro chính và cách xử lý</h3>`+stTable(['Rủi ro','Cách xử lý'],risks.map(x=>[stE(x.risk),stE(x.fix)])),12,'plain'));
    P('light',blocks);
  }

  // 10. Điều khoản
  {
    const anyPs=opts.some(o=>stPs(o.r)?.gross);
    const terms=d.terms?.length?[...d.terms]:[{label:'Thanh toán phần mềm',text:`Thanh toán trước toàn bộ phí phần mềm của kỳ hạn ${years} năm.`},{label:'Thuế',text:'Giá phần mềm không cộng VAT theo Chính sách giá Base 2.0'+(anyPs?'; dịch vụ triển khai (Professional Service) cộng VAT 8%':'')+'; phí dịch vụ khác đã gồm thuế nếu có.'},{label:'Căn cứ giá',text:`Chính sách giá Base 2.0${ctx.policy.effective?' hiệu lực '+ctx.policy.effective:''}.`}];
    if(anyPs&&!terms.some(t=>/triển khai|professional/i.test(t.label)))terms.push({label:'Dịch vụ triển khai',text:'Phí Professional Service tính một lần cho cả hợp đồng, không nhân theo số năm; giá chưa gồm VAT, cộng VAT 8%.'});
    const blocks=[stHead('Điều khoản thương mại',q.validText?(q.reason?`Hiệu lực đến hết ${q.validText}, vì ${q.reason}.`:`Báo giá có hiệu lực đến hết ${q.validText}.`):'Điều khoản thương mại.','')];

    ]);

  // 12. Phụ lục: form báo giá dịch vụ Base
  {

const stDealKey=p=>[p?.deal?.quote?.no||'',p?.deal?.customer?.name||''].join('|');

// Cập nhật các block lấy số liệu (chỉ số tóm tắt, thẻ phương án, PS, bảng giá); giữ chữ đã sửa ở các block khác.
function stRefreshDoc(doc,payload){
  const ctx=stContext(payload),metrics=stSummaryMetrics(ctx);let changed=0;
  for(const p of doc.pages)for(const b of p.blocks){
    if(!b.src)continue;let html=null;
    if(b.src.startsWith('metric:'))html=metrics[+b.src.slice(7)]??null;
    else if(b.src.startsWith('option:')){const i=ctx.opts.findIndex(o=>o.id===b.src.slice(7));if(i>=0)html=stOptionHTML(ctx.opts[i],i,ctx);}
    else if(b.src==='ps')html=stPsHTML(ctx.rec)||null;
    else if(b.src==='price')html=stPriceHTML(ctx);
    if(html!==null&&html!==b.html){b.html=html;changed++;}
  }
  doc.data=payload;doc.notes=stNotes(payload);doc.updated=Date.now();
  return changed;
}

// Việc cần kiểm tra trước khi gửi; hiện trong Studio, không in.
function stNotes(payload){
  const notes=[],d=payload.deal||{},q=d.quote||{},opts=(payload.options||[]).filter(o=>o&&o.r),money=n=>stMoney(n);
  opts.forEach((o,i)=>{const x=o.r,p=`Phương án ${i+1}`,ps=stPs(x);
    if(x.approval)notes.push(`${p}: có Lite, chiết khấu hoặc miễn PS. Cần phê duyệt (Trading Order) trước khi gửi khách.`);
    if(!x.feeKnown)notes.push(`${p}: chưa xác nhận đủ phí dịch vụ${ps?' (PS '+money(ps.gross)+(ps.assumed?', có phần tạm tính':'')+')':''}.`);
    if(ps){for(const t of [...(ps.approvals||[]),...(ps.notes||[])])notes.push(`${p}: ${t}`);if(ps.items.some(i=>i.kind==='ai'&&i.net))notes.push(`${p}: thuế suất PS with AI chưa ghi trong chính sách; đang cộng VAT 8%. Xác nhận với kế toán.`);}
    if(x.gap)notes.push(`${p}: nằm ngoài khoảng ngân sách đã lọc.`);});
  for(const u of payload.useCases||[]){if(u.sample)notes.push(`Use-case “${u.name}” là mẫu định dạng, số liệu minh hoạ. Thay bằng use-case thật trước khi gửi.`);if(!u.public)notes.push(`Use-case “${u.name}” đang ẩn tên doanh nghiệp vì hồ sơ chưa ghi “Công khai tên: có”.`);if(!u.reference&&!u.source)notes.push(`Use-case “${u.name}” chưa có nguồn hoặc người tham chiếu.`);}
  if(q.tag)notes.push(`Bìa đang có nhãn “${q.tag}”. Xoá nhãn này khi gửi khách thật.`);
  notes.push('Đối chiếu các câu mô tả tính năng với sản phẩm thực tế trước khi gửi.');
  for(const w of d.warnings||[])notes.push('Hồ sơ: '+w);
  return notes;
}

// Lưu trữ: IndexedDB (đủ chỗ cho ảnh); mỗi tài liệu một bản ghi.
const stStore=(()=>{
  let dbp=null;
  const open=()=>dbp??=new Promise((res,rej)=>{try{const r=indexedDB.open('quote-studio',1);r.onupgradeneeded=()=>{r.result.createObjectStore('docs',{keyPath:'id'});r.result.createObjectStore('kv');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});
  const run=async(store,mode,fn)=>{const db=await open();return new Promise((res,rej)=>{const t=db.transaction(store,mode),req=fn(t.objectStore(store));t.oncomplete=()=>res(req?.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});};
  return {put:d=>run('docs','readwrite',s=>s.put(d)),get:id=>run('docs','readonly',s=>s.get(id)),del:id=>run('docs','readwrite',s=>s.delete(id)),all:()=>run('docs','readonly',s=>s.getAll()),setKV:(k,v)=>run('kv','readwrite',s=>s.put(v,k)),getKV:k=>run('kv','readonly',s=>s.get(k))};
})();

// Làm sạch HTML khi mở file dự án: bỏ script, sự kiện, link javascript.
function stSanitize(html){
  const t=document.createElement('template');t.innerHTML=String(html??'');
  t.content.querySelectorAll('script,style,iframe,object,embed,link,meta,form,input,button,textarea,select').forEach(n=>n.remove());
  t.content.querySelectorAll('*').forEach(n=>{for(const a of [...n.attributes]){const v=a.value.trim().toLowerCase();if(a.name.startsWith('on')||((a.name==='href'||a.name==='src'||a.name==='xlink:href')&&(v.startsWith('javascript:')||(v.startsWith('data:')&&!v.startsWith('data:image/')))))n.removeAttribute(a.name);}});
  return t.innerHTML;
}

const stSnap=()=>JSON.stringify({title:stDoc.title,header:stDoc.header,footer:stDoc.footer,pages:stDoc.pages});
function stHistReset(){stHist={undo:[],redo:[],last:stDoc?stSnap():null};stHistUI();}
function stCommit(){clearTimeout(stTyping);stTyping=0;if(!stDoc)return;const s=stSnap();if(s===stHist.last)return;stHist.undo.push(stHist.last);if(stHist.undo.length>120)stHist.undo.shift();stHist.redo=[];stHist.last=s;stHistUI();stScheduleSave();}
function stTypingCommit(){clearTimeout(stTyping);stTyping=setTimeout(stCommit,700);}
function stFlush(){if(stTyping)stCommit();}
function stRestore(s){Object.assign(stDoc,JSON.parse(s));if(stSel?.bid&&!stFind(stSel.bid))stSel=stSel.pid&&stPage(stSel.pid)?{pid:stSel.pid}:null;if(stSel?.pid&&!stPage(stSel.pid))stSel=null;}
function stUndo(){stFlush();if(!stHist.undo.length)return;stHist.redo.push(stHist.last);stHist.last=stHist.undo.pop();stRestore(stHist.last);stRender();stHistUI();stScheduleSave();}
function stRedo(){stFlush();if(!stHist.redo.length)return;stHist.undo.push(stHist.last);stHist.last=stHist.redo.pop();stRestore(stHist.last);stRender();stHistUI();stScheduleSave();}
