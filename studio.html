// Chuyển các hàng khối nằm ngoài khổ A4 sang một trang mới ngay sau. Khối đầu trang quá cao: tách bảng theo dòng nếu có.
function stContinuedPage(source,blocks){const p=stNewPage(source.bg,blocks,{chrome:source.chrome,role:source.role||'custom',question:source.question});stSeedFocus(source);stSeedFocus(p);return p;}
function stFixOverflow(pid){
  const p=stPage(pid),el=stPageEl(pid);if(!p||!el)return false;
  const grid=el.querySelector('.st-grid'),limit=stLimit(grid),kids=[...grid.querySelectorAll(':scope > .st-b')];
  const idx=kids.findIndex(k=>k.offsetTop+k.offsetHeight>limit+2);if(idx<0)return false;
  let cut=idx;while(cut>0&&kids[cut-1].offsetTop===kids[idx].offsetTop)cut--;
  if(cut>0&&p.blocks[cut-1].type==='heading'&&kids[cut-1].offsetTop<kids[cut].offsetTop)cut--;
  if(cut===0){
    const k=kids[idx],b=p.blocks[idx],tbl=k.querySelector('.st-c table');
    if(!tbl)return 'too-tall';
    const gTop=grid.getBoundingClientRect().top,rows=[...(tbl.tBodies[0]?.rows||[])];
    const s=rows.findIndex(row=>row.getBoundingClientRect().bottom-gTop>limit);
    if(s<1)return 'too-tall';
    const make=keepFirst=>{const c=k.querySelector('.st-c').cloneNode(true),t=c.querySelector('table'),body=t.tBodies[0];[...body.rows].forEach((row,i)=>{if(keepFirst?i>=s:i<s)row.remove();});
      if(keepFirst){let n=t.nextSibling;while(n){const nx=n.nextSibling;n.remove();n=nx;}}else{let n=t.previousSibling;while(n){const pv=n.previousSibling;n.remove();n=pv;}t.insertAdjacentHTML('beforebegin','<p class="s">(tiếp theo)</p>');}
      c.querySelectorAll('img[data-asset]').forEach(i=>i.removeAttribute('src'));return c.innerHTML;};
    const rest={...JSON.parse(JSON.stringify(b)),id:stId('b'),html:make(false),src:undefined};
    if(b.src==='phase2:payment'){const start=b.sourceRows?.[0]||0,end=b.sourceRows?.[1]??null;b.sourceRows=[start,start+s];rest.sourceRows=[start+s,end];rest.src=b.src;}
    b.html=make(true);const moved=[rest,...p.blocks.splice(idx+1)];
    stDoc.pages.splice(stDoc.pages.indexOf(p)+1,0,stContinuedPage(p,moved));

  }
  const moved=p.blocks.splice(cut);
  stDoc.pages.splice(stDoc.pages.indexOf(p)+1,0,stContinuedPage(p,moved));
  return 'moved';
}
async function stSettle(){try{await document.fonts?.ready;}catch{}await Promise.all(st$$('#st-pages img[src]').map(i=>i.decode?.().catch(()=>{})));await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));}
async function stAutoPaginate(){

    if(!changed)break;

// Một lần bấm: chia liên tiếp cho tới khi trang cuối của chuỗi vừa khổ A4.

function stTableOp(op){
  const bEl=stSel?.bid&&stBlockEl(stSel.bid);if(!bEl)return;
  const cell=stCell&&bEl.contains(stCell)?stCell:null,tbl=cell?.closest('table')||bEl.querySelector('table');
  if(!tbl){stToast('Khối này chưa có bảng.');return;}
  const body=tbl.tBodies[0],row=cell?.closest('tr')||body?.rows[body.rows.length-1]||tbl.rows[0],ci=cell?cell.cellIndex:(row?.cells.length||1)-1;
  if(!row){stToast('Bảng chưa có dòng để sửa.');return;}
  if(op.startsWith('col-')&&[...tbl.querySelectorAll('td,th')].some(c=>c.colSpan>1||c.rowSpan>1)){stToast('Bảng có ô gộp. Dùng khối Bảng cơ bản để thêm hoặc xoá cột.');return;}
  stFlush();let next=null;
  if(op==='row-add'){
    const base=row.parentElement.tagName==='THEAD'?(body?.rows[0]||row):row,nr=document.createElement('tr');
    [...base.cells].forEach(c=>{const nc=document.createElement('td');nc.innerHTML='<br>';nr.append(nc);});
    if(row.parentElement.tagName==='THEAD')(body||tbl.createTBody()).prepend(nr);else row.after(nr);next=nr.cells[Math.min(ci,nr.cells.length-1)];
  }else if(op==='row-del'){
    if(row.parentElement.tagName!=='TBODY'||body.rows.length<2){stToast('Bảng cần ít nhất một dòng.');return;}next=row.previousElementSibling?.cells[ci]||row.nextElementSibling?.cells[ci];row.remove();
  }else if(op==='col-add'){
    if(row.cells.length>=12){stToast('Tối đa 12 cột trong một bảng A4.');return;}
    for(const r of tbl.rows){const ref=r.cells[Math.min(ci,r.cells.length-1)];if(!ref)continue;const c=document.createElement(ref.tagName);c.innerHTML=r.parentElement.tagName==='THEAD'?'Cột '+(ci+2):'<br>';ref.after(c);if(r===row)next=c;}
    tbl.classList.add('st-edit-table');tbl.querySelectorAll('colgroup').forEach(n=>n.remove());tbl.querySelectorAll('[width]').forEach(n=>n.removeAttribute('width'));
  }else if(op==='col-del'){
    if((tbl.rows[0]?.cells.length||0)<2){stToast('Bảng cần ít nhất một cột.');return;}
    for(const r of tbl.rows){if(r.cells.length<2)continue;const i=Math.min(ci,r.cells.length-1);r.cells[i].remove();if(r===row)next=r.cells[Math.min(i,r.cells.length-1)];}tbl.classList.add('st-edit-table');
  }

  if(next){bEl.querySelector('.st-c').focus();stSelectAllIn(next);next.scrollIntoView({block:'nearest',inline:'nearest'});}
}

// ---------- Kéo thả: khối, khối mới từ thư viện, trang trong danh sách ----------
function stDropTarget(x,y){
  const el=document.elementFromPoint(x,y);if(!el)return null;
  const li=el.closest('#st-pagelist li');
  if(li){
    if(stDrag.src.kind==='page'){const r=li.getBoundingClientRect(),after=y>r.top+r.height/2,ids=stDoc.pages.map(p=>p.id);return {kind:'page',index:ids.indexOf(li.dataset.pid)+(after?1:0),line:{x:r.left,y:after?r.bottom:r.top,w:r.width}};}
    const r=li.getBoundingClientRect();return {pid:li.dataset.pid,index:stPage(li.dataset.pid).blocks.length,box:r};
  }
  if(stDrag.src.kind==='page')return null;
  const b=el.closest('.st-b');
  if(b&&b.dataset.bid!==stDrag.src.bid&&!b.closest('.st-dragging')){
    const f=stFind(b.dataset.bid),r=b.getBoundingClientRect(),full=f.b.w>=12;
    const after=full?y>r.top+r.height/2:x>r.left+r.width/2;
    return {pid:f.p.id,index:f.i+(after?1:0),line:full?{x:r.left,y:after?r.bottom+2:r.top-2,w:r.width}:{x:after?r.right+2:r.left-2,y:r.top,h:r.height}};
  }
  const pg=el.closest('.st-page');
  if(pg){
    const p=stPage(pg.dataset.pid),kids=[...pg.querySelectorAll('.st-grid > .st-b')].filter(k=>k.dataset.bid!==stDrag.src.bid);
    let index=p.blocks.length,ref=null;
    for(const k of kids){const r=k.getBoundingClientRect();if(y<r.top+r.height/2){index=p.blocks.findIndex(b=>b.id===k.dataset.bid);ref=r;break;}}
    const g=pg.querySelector('.st-grid').getBoundingClientRect();
    if(ref)return {pid:p.id,index,line:{x:g.left,y:ref.top-3,w:g.width}};
    const last=kids[kids.length-1]?.getBoundingClientRect();
    return {pid:p.id,index,line:{x:g.left,y:last?last.bottom+3:g.top+4,w:g.width}};
  }
  return null;
}
function stShowDrop(t){

  st$$('#st-pagelist li.drop').forEach(l=>l.classList.remove('drop'));

function stStartDrag(e,src,label){
  e.preventDefault();stFlush();
  stDrag={src,x0:e.clientX,y0:e.clientY,moved:false,target:null,label};
  window.addEventListener('pointermove',stDragMove);window.addEventListener('pointerup',stDragEnd,{once:true});window.addEventListener('pointercancel',stDragEnd,{once:true});
}
function stDragMove(e){
  const d=stDrag;if(!d)return;
  if(!d.moved){if(Math.hypot(e.clientX-d.x0,e.clientY-d.y0)<5)return;d.moved=true;document.body.classList.add('st-dragging-on');
    const g=st$('#st-ghost');g.textContent=d.label;g.hidden=false;
    if(d.src.kind==='block')stBlockEl(d.src.bid)?.classList.add('st-dragging');
    if(d.src.kind==='page')st$(`#st-pagelist li[data-pid="${d.src.pid}"]`)?.classList.add('st-dragging');}
  const g=st$('#st-ghost');g.style.left=e.clientX+14+'px';g.style.top=e.clientY+10+'px';
  d.target=stDropTarget(e.clientX,e.clientY);stShowDrop(d.target);
  const c=st$('#st-canvas'),r=c.getBoundingClientRect();
  clearInterval(d.scroll);if(e.clientY<r.top+60)d.scroll=setInterval(()=>c.scrollBy(0,-18),16);else if(e.clientY>r.bottom-60)d.scroll=setInterval(()=>c.scrollBy(0,18),16);
}
function stDragEnd(){
  const d=stDrag;stDrag=null;window.removeEventListener('pointermove',stDragMove);if(!d)return;
  clearInterval(d.scroll);document.body.classList.remove('st-dragging-on');st$('#st-ghost').hidden=true;stShowDrop(null);st$$('.st-dragging').forEach(x=>x.classList.remove('st-dragging'));
  if(!d.moved){if(d.src.kind==='new')d.src.preset?stInsertPreset(d.src.preset):stInsert(d.src.type);return;}
  const t=d.target;if(!t)return;
  if(d.src.kind==='page'&&t.kind==='page')stMovePage(d.src.pid,t.index);
  else if(d.src.kind==='block'&&t.pid)stMove(d.src.bid,t.pid,t.index);
  else if(d.src.kind==='new'&&t.pid)d.src.preset?stInsertPreset(d.src.preset,{pid:t.pid,index:t.index}):stInsert(d.src.type,{pid:t.pid,index:t.index});
}

function stStartResize(e,axis,bEl){
  e.preventDefault();e.stopPropagation();stFlush();
  const r=stFind(bEl.dataset.bid);if(!r)return;stSetSel({pid:r.p.id,bid:r.b.id});
  const grid=bEl.parentElement,gr=grid.getBoundingClientRect(),gap=parseFloat(getComputedStyle(grid).columnGap)||0,col=(gr.width-11*gap)/12,r0=bEl.getBoundingClientRect();
  const tip=st$('#st-tip');tip.hidden=false;document.body.classList.add('st-resizing-'+axis);
  const name=w=>(ST_WIDTHS.find(x=>x[0]===w)?.[1]||'')+` · ${w}/12`;
  let val=axis==='w'?r.b.w:r.b.h;
  const move=ev=>{
    if(axis==='w'){val=Math.max(2,Math.min(12,Math.round((ev.clientX-r0.left+gap)/(col+gap))));bEl.style.setProperty('--w',val);tip.textContent='Độ rộng '+name(val);}
    else{val=Math.max(8,Math.round((ev.clientY-r0.top)/ST_PXMM/2)*2);bEl.style.setProperty('--h',val+'mm');tip.textContent=`Chiều cao ${val} mm`;}

  st$('#st-pdf').addEventListener('click',()=>stDoc&&stPrint());
  st$('#st-menu').addEventListener('click',async e=>{
    const b=e.target.closest('button[data-file]');if(!b)return;e.target.closest('details').open=false;
    const k=b.dataset.file;
    if(k==='new')stOpenDoc(stBlankDoc());
    else if(k==='open')st$('#st-file-json').click();
    else if(k==='save'&&stDoc)stSaveFile();
    else if(k==='html'&&stDoc)stExportHTML();
    else if(k==='docs')await stHomeUI.home();else if(k==='template'&&stDoc){stFlush();await stSaveNow();await stHomeUI.promptTemplate(stDoc);}else if(k==='firebase'){await stHomeUI.home();await stHomeUI.showFirebase();}
  });
  st$('#st-file-img').addEventListener('change',e=>stLoadImage(e.target.files[0]));
  st$('#st-file-json').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)stOpenFile(f);});
  document.addEventListener('keydown',e=>{
    const mod=e.metaKey||e.ctrlKey;
    if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?stRedo():stUndo();return;}
    if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();stRedo();return;}
    if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();stSaveNow();return;}
    if(e.key==='Escape'){if(!st$('#st-dialog').hidden){st$('#st-dialog').click();return;}document.activeElement?.blur?.();stSetSel(stSel?.bid?{pid:stSel.pid}:null);return;}
    if((e.key==='Delete'||e.key==='Backspace')&&stSel?.bid&&!e.target.closest?.('[contenteditable],input,textarea'))
      {e.preventDefault();stDel(stSel.bid);}
  });
  window.addEventListener('beforeprint',()=>{stFlush();stSetSel(null,{panel:false});});
  window.addEventListener('message',e=>{if(!stQuoteOriginOK(e.origin))return;if(stReadonly&&e.source===window.parent&&e.data?.kind==='quote-studio-preview-data'){stReadPreview(e.data.doc);return;}if(e.source===window.opener&&['quote-studio-data','quote-studio-open'].includes(e.data?.kind))stQueuePayload(e.data);if(stChildWindows.has(e.source)&&e.data?.kind==='quote-studio-saved')try{window.opener?.postMessage(e.data,stQuoteTargetOrigin());}catch{}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){stFlush();stSaveNow();}});
}

async function stStart(){
  stSetupWorkspace();if(!stReadonly)stWire();else window.addEventListener('message',e=>{if(e.source===window.parent&&stQuoteOriginOK(e.origin)&&e.data?.kind==='quote-studio-preview-data')stReadPreview(e.data.doc);});
  stQuoteEvents.subscribe(async event=>{if(event.type==='doc-saved'&&stReadonly&&event.docId===stRoute.searchParams.get('doc')){const doc=await stStore.get(event.docId);if((doc?.revision||0)>(stDoc?.revision||0))await stReadPreview(doc);}});
  if(stReadonly){document.body.classList.add('st-preview-readonly','st-preview');const d=await stStore.get(stRoute.searchParams.get('doc')).catch(()=>null);if(d)await stReadPreview(d);else st$('#st-pages').innerHTML='<p>Đang tải bản Studio đã lưu…</p>';stPreviewHeight();window.addEventListener('resize',stPreviewHeight);return;}
  let d=null;const id=stRoute.searchParams.get('doc');
  try{if(id)d=await stStore.get(id);else if(stRoute.searchParams.get('quotation'))d=await stQuoteRepo.findDoc(stRoute.searchParams.get('quotation'));}catch{}
  if(d&&!stQuoteMatches(d,stRoute.searchParams.get('quotation')))d=null;
  try{stLibrary=await stStore.getKV('st-library')||[];}catch{}
  stQuoteSession.set('quote-studio-seen','1');if(d)await stOpenDoc(d);else{await stHomeUI.home();const draft=stRoute.searchParams.get('draft');if(draft)await stHomeUI.resume(draft);}
  const qid=stRoute.searchParams.get('quotation');
  try{const key=qid?'quote-studio-inbox:'+qid:'quote-studio-inbox',raw=localStorage.getItem(key);if(raw){localStorage.removeItem(key);const p=JSON.parse(raw);if(Date.now()-(p.sentAt||0)<15*60e3)await stOnPayload(p);}}catch{}
  if(window.opener)try{window.opener.postMessage({kind:'quote-studio-ready',quotationId:qid},stQuoteTargetOrigin());}catch{}
}
let stCloudService=null,stHomeUI=null;
function stSanitizeDoc(d){d.assets??={};d.pages=(d.pages||[]).map(p=>({...p,blocks:(p.blocks||[]).map(b=>({...b,html:stSanitize(b.html)}))}));return d;}
function stSetupWorkspace(){
  const adapter=stWorkspaceAdapter(stQuoteRepo,{sanitizeDoc:stSanitizeDoc});
  stCloudService=stCreateCloud({repo:stQuoteRepo,adapter,onStatus:()=>stHomeUI?.syncStatus(),onRemote:async event=>{
    if(event.kind==='doc'&&stDoc?.id===event.entity.id&&!stReadonly&&!document.body.classList.contains('st-home-mode')){stFlush();if(stSavedSnapshots.get(stDoc)===stQuoteDocSignature(stDoc))await stOpenDoc(event.entity);else await stSaveNow();}
    if(event.kind==='library'){stLibrary=event.entity.blocks||[];if(stDoc)stPanel();}stHomeUI?.refresh();
  },onConflict:async event=>{
    if(event.kind==='doc'&&stDoc?.id===event.fromId){stFlush();Object.assign(stDoc,{id:event.entity.id,quotationId:event.entity.quotationId,title:event.entity.title,revision:event.entity.revision});stRememberDoc(stDoc);stCommit();await stSaveNow();stToast('Có chỉnh sửa ở nơi khác. Đã giữ phần của bạn trong một báo giá riêng.');}
    if(event.kind==='draft')stHomeUI?.onDraftConflict(event.fromId,event.entity.id);
  }});
  stHomeUI=setupStudioHome({repo:stQuoteRepo,adapter,cloud:stCloudService,openDoc:stOpenDoc,backFromEditor:async()=>{stFlush();await stSaveNow();stDoc=null;stSel=null;},toast:stToast,
    askTemplateName:async name=>{const ok=await stDialog('Lưu thành template','<label class="st-field"><span>Tên template</span><input id="st-template-name" value="'+stEsc(name)+'"></label><p>Khách hàng và giá sẽ được điền lại từ hồ sơ mới. Khối đã đánh dấu giữ nội dung được tái sử dụng.</p>',[{label:'Huỷ',value:false},{label:'Lưu template',value:true,primary:true}]);return ok?st$('#st-template-name').value:null;},
    createDoc:async(input,tpl,context={})=>{stFlush();if(stDoc)await stSaveNow();const d=stWorkspaceBuild(input,tpl,{baseLogo:QD_BASE_LOGO});if(context.draftId){d.quotationId=context.draftId;d.data.quotationId=d.quotationId;}d.sourceSignature=stQuoteSignature(d.data);stDoc=stPrepareDoc(d);stSel=null;stMeasurements={};stHomeUI.hide();stRememberDoc(d);stRender();await stSettle();await stAutoPaginate();stHistReset();await stSaveNow();const draft=await stQuoteRepo.getDraft(d.quotationId);if(draft)await stCloudService.queue('draft',draft);stToast('Đã tạo báo giá độc lập từ bộ hồ sơ.');},
    updateDoc:async(input,id)=>{const target=await stQuoteRepo.getDoc(id);if(!target)throw new Error('Không tìm thấy báo giá.');const payload=stInputPayload(input);if(payload.deal.customer.name!==target.data?.deal?.customer?.name)throw new Error('Hồ sơ thuộc khách hàng khác. Chọn tạo báo giá mới để giữ bản đang có.');await stOpenDoc(target);stFlush();payload.quotationId=target.quotationId;stRefreshDoc(stDoc,payload);stDoc.inputs=input;stDoc.sourceSignature=stQuoteSignature(payload);stRender();stCommit();await stSaveNow();stToast('Đã cập nhật bộ đầu vào và các khối liên kết. Nội dung độc lập giữ nguyên.');}
  });
  stCloudService.start().catch(e=>stToast(e.message));
}
if(document.getElementById('st-app'))stBoot=stStart();
</script>
